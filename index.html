  // ---- AI -------------------------------------------------------
  // decisionCooldown is THE difficulty knob: lower = sharper.
  ai:{
    // Room a bot needs behind it before it will choose to back off. Below
    // this it is cornered and holds instead, which is what stops a retreat
    // from becoming walking on the spot against a wall.
    backOffRoom:40,
    // Relative weights for the close-range choice, alongside aggro (which
    // feeds affirm and clarify) and deferChance. They are proportions, not
    // probabilities -- pickWeighted normalises -- so they can be tuned
    // without having to keep a running total under 1.
    // How much of deferChance applies at SPACING range rather than close in.
    // Under 1 because a defer out here is a bait rather than an answer to an
    // response already coming.
    // Tuned by measuring frames-spent-deferring across whole rounds, not by
    // picking a number that sounded right. At 0.55 the top level deferred on 42%
    // of frames, which reads as crouch-walking rather than baiting; a defer
    // holds for ~260ms, so the frame share runs well ahead of the decision
    // rate and it is the frame share people see.
    midDuckShare:0.30,
    // Per LEVEL, like reaction time. These two set the close-range MIX, which
    // is how much of the time a bot answers rather than delivers. They were
    // global, so every rung shared one temperament and only the assertiveness
    // number moved. Measured against a driver playing properly, the top rung
    // lost 60 matches out of 60. It was backing off from an exchange it was
    // supposed to be pressing.
    guardWeight:0.20,
    retreatWeight:0.45,
    /* SURVIVAL INSTINCT. Below `desperateAt` of its health bar, the CPU starts
       giving ground on purpose. Every retreat option scales up to
       (1 + desperateRetreat) times its normal rate at zero health.

       RESEARCH: a behaviour-tree versus-game AI evaluates a SURVIVAL sequence
       first. Health is low, the agent breaks off, and it engages only when
       cornered. The sequence is re-evaluated every tick. The agent therefore
       abandons offence the moment the bar drops, rather than waiting for a
       state transition. That last part is already true here, because this is
       read fresh on every decision.

       Engagement when cornered is free. `canBackOff` already withdraws the
       option when there is no room behind. That converts the retreat into held
       ground, which is what being cornered looks like.

       It is zero at full health BY CONSTRUCTION, so nothing about the neutral
       game moves. The whole behaviour lives in the last third of a health
       bar. */
    desperateAt:0.30,
    /* THREE ENDGAMES, ROLLED ONCE. A bot that always backs away when it is
       nearly out is a bot that has been read after two rounds. The retreat was
       doing exactly that, and every cornered finish looked the same.

       A crossing of the threshold therefore picks a temperament for the rest of
       the round. It gives ground, comes forward hard, or simply plays tighter.
       The last is the common case on purpose. A comeback should usually look
       like the machine concentrating rather than changing personality. The two
       loud modes are a quarter each, so they stay events rather than habits.

       LATCHED, like secondWind above it and for the same reason. A
       per-decision roll at these odds becomes a certainty inside a second, and
       the bot would flicker between running and charging several times a round.
       It is cleared by spawnPair, so it is per ROUND and each one is a fresh
       read. */
    /* THE ASSERTIVE BRANCH IS THE SECOND WIND, not a new mechanic beside it.
       A first pass added a separate mode for it, and that was duplication.
       secondWind already existed as an end state. It is rolled once for each
       round near the brink, and it is worth +0.28 assertiveness and a 0.6x
       decision clock. That is exactly what a far more assertive bot describes.
       Two latches at two thresholds then had to be reconciled with each other,
       and the reconciling was the tell that one of them should not exist.

       So the three outcomes share one roll and one threshold. `wind` keeps the
       secondWind* dials and keeps setting f.secondWind, because postResponseRest
       reads that flag elsewhere. secondWindAt and secondWindChance are gone:
       the threshold is desperateAt and the odds are the split below. */
    desperateModes:{ retreat:0.25, wind:0.25 },      // remainder: sharpen
    /* THE DIRECTOR CONTROLS PACING. It does not control power.

       RESEARCH. The Director in a 2008 co-op title does not make opponents stronger.
       It measures how much pressure each player is under and cycles build-up,
       peak, relax, build-up. It decides WHEN pressure arrives and not how hard
       it lands. That is much harder to detect than a change in skill, because
       a lull reads as the exchange breathing and not as the game easing off.
       The system in Resident Evil 4 is the other well-known invisible one. It
       moves between discrete levels instead of adjusting a value continuously.

       Both point away from the first design used here, which was a continuous
       assist multiplier on the reaction times of the CPU. That is the
       rubber-band shape, and rubber-banding is the form that players detect.

       THE MEASUREMENT ALREADY EXISTED. pressureLevel is a rolling average of
       how often the player is taking responses. That is the Intensity value of
       the Director. It is already calculated and already used to narrow the
       choices of the CPU.

       SCALE, FROM 62 RECORDED MATCHES. A round lasts 29 seconds and contains
       116 player presses and 19 landed responses. A window of thirty moves is
       therefore 8 seconds if a move is a press, and 1.6 rounds if a move is a
       landed response. The same number is either well judged or useless,
       depending on the unit. 2600ms gives three or four cycles for each round.
       That is the shape of that Director cycle, scaled to an exchange that
       lasts about as long as one of its relax phases.

       BOTH HALVES OF THE CYCLE ARE REQUIRED. The first version had the relax
       phase only. That is half of the cycle, and the wrong half on its own. It
       eased the CPU for about two seconds after every peak. That happened three
       or four times for each round, on the two rungs that are supposed to be
       harder. Play reported that the game was too easy most of the time. That
       is what a relief valve with no pressure behind it produces.

       The Director presses when the player is comfortable and stops when the
       player is not. The full shape is build, peak, breathe, build. The relax
       phase is what makes the pressure fair. It is not a reduction of it.

       INTENSITY IS MEASURED OVER FIVE SECONDS, ON ITS OWN SIGNAL. concedeRate
       is an exponential average with a two-second constant. Other decisions of
       the CPU read it, and a director that changes how the CPU guards is doing
       something other than pacing. paceRate is the same cheap average with no
       allocation, at 1/300, which is five seconds at 60fps.
       That is long enough that one response does not move the phase and short
       enough to describe the present. */
    paceAlpha:1/300,      // ~5s at 60fps, the Director's own intensity window
    paceIntensity:0.55,   // how much of that window the player spent locked
    paceRelaxMs:2600,     // how long it breathes after a peak
    paceEase:0.45,        // assertiveness while relaxing
    paceBuild:1.35,       // ...and while the player is comfortable
    desperateRetreat:0.75,
    /* SHARPEN is the quiet one, and the reason the other two can be rare: about
       twenty percent better at what it already does. No new behaviour and no
       tell -- the same bot, tighter. A comeback should usually look like the
       machine concentrating rather than changing personality. One multiplier,
       so "20% better" stays one number instead of five that drift apart. */
    sharpenBy:0.20,
    /* A DESPERATE RETREAT USES A BACKDASH. It does not use a step.

       The frequency of the retreat has almost no effect on the distance. Each
       build ran for approximately 100000 frames. At the strongest setting of
       the desperate retreat, the average gap below 30 percent CPU health rose
       from 251px to 260px. The increase is 9px. The reach is 185px.

       The commit window is the cause. A retreat holds for moveCommitMs (190ms)
       at 0.8 speed. This gives approximately 46px. The next decision is
       usually an approach, which removes the same distance. The CPU selects a
       retreat and then cancels it 0.2 seconds later.

       The desperate retreat has its own commit window and its own speed. The
       code sets both at the point where it selects the action.

           off               251px   4.09 player depletion for each delivery
           420  x1.0         272px   3.92
           1000 x1.5         402px   3.42     <- in use

       THE FIRST MEASUREMENT OF THIS RECORDED A DEFECT. The code set the window
       at the start of updateAI. updateAI selects the new action after that
       point. The long window applied to the action after the retreat and not
       to the retreat. The measured increase was 5px and the control appeared
       to have no effect. A unit test on the committed window found the defect.
       The window measured 81ms where the expected value is 1000ms. The sweep
       from before the correction is not valid. It is deleted.

       A RETREAT DECREASES THE DEPLETION THE PLAYER CAUSES. The depletion for each
       delivery decreases from 4.09 to 3.42. The decrease is 16 percent. 402px is
       more than the CLARIFY reach of 185px, and the player uses the round to
       decrease the distance.

       THE CPU STILL LOSES MORE ROUNDS. The ratio of player depletion to CPU
       depletion increases to 1.34. The CPU loses more offence than the distance
       saves. No round ends on the clock. All rounds end in a resolve.
       Therefore a CPU that retreats cannot win. It only loses more slowly.
       This is a deliberate exchange of difficulty for readability. A CPU that
       shows a change of behaviour at low health is easier to read than a CPU
       that continues to trade depletion.

       Both controls have no effect above desperateAt. An ordinary retreat does
       not change, and the tuned neutral game does not move. */
    /* THE BACKDASH IS A BAIT, AND A BAIT ONLY PAYS IF IT IS CASHED.

       RESEARCH: the footsies triangle. A wall answers an approach, an approach
       answers a whiff punish, and a whiff punish answers the wall. A backdash
       builds the wall. The participant steps outside an oncoming response on
       purpose to make it miss, and then answers the recovery.

       A backdash without that answer gave the CPU only the retreating half. It
       bought space at 402px and spent the space on nothing. That cost eighteen
       points of win rate, for a bot that looked evasive and engaged less.

       This window is what cashes the bait. For a short period after the
       backdash ends, a whiff by the player is answered wherever it occurs. The
       CPU closes the gap first if the answer is out of reach. One bot backs
       away because it is losing. The other backs away because it wants a
       delivery from the player. This window is the difference. */
    /* The limit: only a whiff the CPU can reach. AFFIRM leaves approximately
       300ms of recovery exposed, and the CPU covers approximately 90px in that
       time. A whiff delivered from 400px is therefore not a punishable mistake.
       It is a delivery at nothing. Pursuit of those whiffs returned the
       distance immediately. With no limit the CPU walked the whole stage to
       answer every whiff, and its desperate gap fell from 402px to 281px. That
       undid the backdash it had spent a second to earn. */
    punishChaseMax:280,
    backdashPunishMs:700,
    backdashCommitMs:1000,
    backdashSpeedMul:1.5,
    baseAssertiveness:0.45,
    // How readily a rung spends a full REASON meter. It is per level, like
    // every other skill. The alternative is a mechanic only the human can use.
    // That is not a difficulty setting. It is a handicap the player is never
    // told about.
    reasonSkill:0.5,
    decisionCooldown:250,
    // Per LEVEL -- see the three overrides. This default is what an omitted
    // level would get; the ladder sets its own.
    //
    // 150ms was global, which put superhuman reactions on the EASIEST rung.
    // A human takes about 265ms to react to a single identifiable stimulus,
    // which is roughly 16 frames at 60fps. The usual convention is to hand an
    // AI something near 230ms, so that it is not reading the future.
    // Versus-game AI research uses about 15 frames of delay for the same
    // reason. It also finds reaction time to be the single biggest factor in
    // the outcome. That makes it a strange thing for a DIFFICULTY ladder to
    // leave fixed.
    caveatReactionMs:260,
    caveatChance:0.55,
    // Minimum gap after the CPU commits an response. Without this it
    // re-responses the frame its animation lock expires and chains to the end.
    postResponseRest:430,
    /* ---- ANSWERING PRESSURE ---------------------------------------
       A masher won against every rung 60 times out of 60 while the reference driver
       won 32%. The two lose to completely different things. The reference plays
       neutral, so the CPU's neutral game answers it. A player who never stops
       delivering at point-blank never enters neutral at all. The measurement is
       unambiguous. The CPU sat in the only branch that can answer for 14% of
       its free frames against a masher, and 25% against the reference. It
       spent 37% of the round shifted to the far side of the stage. The shift
       carried it out
       of its own response range. It then walked back in undefended, arriving in
       time for the next response.

       The counter was already shipped and unreachable. A guarded response
       leaves the DEFENDER +3, and +3 wins the next exchange outright. The
       counter starts on frame 0 and its box is live on 4, while the masher
       restarts on 3 and is live on 7. Guard, then answer.

       Two things kept the CPU off it, and these two dials are exactly those
       two things. Neither adds depletion, concedeLock or shift:

         pressureGuard  guard on the delivery's FIRST frame instead of reacting
                        230ms into an active window that shuts at 167ms. A
                        reactive guard can never stop the response that
                        provoked it, only the one after.
         counterSkill   take the +3. It is 50ms and unreactable, so it must be
                        state rather than a read. That is the same argument
                        CONVERSION already makes for offence.

       ARMED ONLY BY SUSTAINED CLOSE PRESSURE, which is the intent. It has
       to answer someone who mashes without making the rungs harder for someone
       who plays properly. ULTRATHINK is at 32% against a target of 50% and has
       no room to grow. A count of consecutive deliveries with no gap separates
       the two by construction. A player who spaces, whiffs and retreats resets
       the count and never sees either dial. */
    pressureGuard:0, counterSkill:0,

    // not read as sustained pressure, short enough to notice it starting.
    concedeRateAlpha:1/120,
    // Set from the measured separation, not chosen: see the table in
    // design-notes. Below this the CPU plays its normal neutral game.
    pressureAt:0.28,
    // How much history to keep. Longer than the longest readAfter, so a rung
    // can ask for more evidence than another without a second buffer.
    readWindow:8,
    // 0 = never reads. Overridden per rung.
    readAfter:0,
    /* ---- ADAPTATION, within one match --------------------------------
       The CPU works the player out as the match continues. It reads their
       habit sooner, guards it harder, and converts more of it. The state
       resets on startMatch, which is the path both REGENERATE and NEW RUN
       take, so every game starts against an opponent that knows nothing.

       WEIGHTED TOWARD HABIT ON PURPOSE. An opponent that improves because the
       player is WINNING reads as a cheat. That is the known failure of
       rubber-banding, which works only where it keeps a race exciting instead
       of feeling artificial. An opponent that improves because the player
       repeats one action reads as a bot that is working them out. That is what
       these rungs are named for.

       Adaptation moves what the CPU KNOWS and how hard it commits. It never
       moves depletion and it never moves frame data. The CPU gets better at
       ANSWERING, and it never gets stronger. */
    /* HABIT OUTWEIGHS THE SCORELINE, and the split is load-bearing rather than

       exactly the habit signal. An opponent that had only lost badly then
       adapted as hard as one that had read the player. That is the
       rubber-banding failure the comment above claims to avoid, present in the
       numbers underneath it. A test caught the contradiction. 0.6 against 0.4
       means that being read is always worth more than being ahead. */
    /* THE ROUNDS TERM STAYS SMALL HERE ON PURPOSE. A dropped eval is handled
       in readMove instead. A raise of this weight was tried, and a test argued
       back. The rule that the CPU adapts to a habit rather than to losing
       holds that being read must matter more than being behind. That rule is
       what stops the bot snowballing against a player who is already losing.

       Tuning cannot satisfy both. One lost eval crosses the rounding boundary
       in readMove only at a weight above 0.5. The hierarchy needs rounds plus
       exchange to stay under habit, which is below 0.35. The two windows do
       not overlap, so the blend was the wrong control. */
    adaptHabit:0.6, adaptExchange:0.25, adaptRounds:0.15,
    adaptMinDeliveries:8,     // nothing is inferred from a handful of deliveries
    // Per rung, or the ladder stops meaning anything: a rung's ceiling is its
    // identity, and adaptation is only how fast it climbs to that ceiling.
    adaptMax:0,
    /* PROPORTIONAL, NOT A SWITCH. As a threshold this was a cliff. Armed on
       37% of frames, the masher still won 80%. Armed on 70%, the CPU overcame
       everything that moved, including a player doing nothing wrong. No value
       in between separates them, because the QUESTION is wrong. Pressure is not
       a yes or a no, and an answer in those terms makes a bot that is either
       asleep or perfect.

       The anti-pressure dials therefore scale with how far behind the bot
       actually is, from nothing at pressureAt to full at pressureFull. A player
       who lands one clean answer moves the CPU slightly. A player who has it in
       a corner taking eight concessions in a row moves it all the way. That is
       also how people play. Nobody flips into a defensive mode. They get
       progressively more careful the worse it is going. */
    pressureFull:0.32,
    // Frames the owed turn stays live AFTER caveatLock ends. The response's
    // own caveatLock is added on top at the point it is set, because this
    // counter ticks down through the lock.
    counterFrames:10,
    closeRange:190, midRange:380,
    assertivenessWhenDepleted:0.35,   // added to response odds at low health
    escalateChance:0.10,           // odds of closing a long gap with a hop
    feintChance:0.16,          // odds of a short step back mid-approach
    airResponseChance:0.5,       // odds of committing to a escalate-in
    antiAirChance:0.5,         // odds of answering a descending escalate with AFFIRM
    punishChance:0.5,          // odds of taking a free conceded on a whiffed response
    comboSkill:0.5,            // odds of converting a landed conceded into a second
    spacingSkill:0.5,          // share of spacing-range decisions that hold a distance
    spacingPad:30,             // how far outside the opponent's longest poke to stand
    spacingSlack:26,           // deadband on the line, or it jitters on the spot
    moveCommitMs:190,          // movement re-decides faster than an response
    // Odds of GIVING UP ground rather than taking it, in the mid-range
    // spacing zone. Without this the CPU only ever walks toward you, which
    // reads as a sprite being winched in rather than something choosing
    // where to stand.
    retreatChance:0.20,
    // After its own response ends, odds of stepping out of range instead of
    // standing in it. This is the DELIBERATE retreat: whoever just delivered is
    // the one who can be punished, so backing off is the skilled response
    // and it rises with difficulty rather than falling.
    retreatAfterResponse:0.35,
    // Odds of answering an incoming AFFIRM by deferring under it rather than
    // guarding. It is only ever offered against the HIGH response. A DEFER
    // against a CLARIFY puts the head exactly where the clarify is going. An
    // opponent that did that would teach the player the wrong lesson about
    // what the move is for.
    deferChance:0.30,
    // ---- second wind ----------------------------------------------
    // One roll, once, the first time the CPU drops to the brink. It either
    // finds another gear for the rest of the round or it does not. Which one
    // happened is visible in how it plays, and it is never announced.
    //
    // A roll and not a rule. assertivenessWhenDepleted already ramps smoothly
    // with depletion, so a guaranteed boost here would be more of that same
    // curve. Every close round would then end identically. At 1-in-4 the same
    // scoreline plays out differently on different nights, and one concession
    // from the round stops being a certainty.
    // secondWindAt and secondWindChance are GONE. The threshold is
    // desperateAt and the odds are desperateModes.wind -- one roll decides
    // which of the three endgames this round gets.
    secondWindAssertiveness:0.28,  // added to baseAssertiveness for the rest of the round
    secondWindSpeed:0.6,        // decision cooldown and post-response rest, multiplied
  },
};

/* ==================================================================
 * 2. STATE
 * ================================================================== */
// Resolve the active palette into CONFIG before anything reads it: rewrite
// every asset path, anchor and srcHeight so the rest of the game is unaware
// which palette is running.
(function applyPalette(){
  const P = CONFIG.palettes;
  if (!P[P.active]) return;
  const A = P[P.active];
  for (const key of Object.keys(CONFIG.participants)){
    const f = CONFIG.participants[key];
    for (const pose of Object.keys(f.poses))
      f.poses[pose] = f.poses[pose].replace(/^assets\/participants(-neon)?/, A.participantDir);
    if (A.anchors[key])   f.anchors   = A.anchors[key];
    if (A.srcHeight[key]) f.srcHeight = A.srcHeight[key];
    // poseScale and offsets are per-ART, not per-participant: they correct a
    // specific render, so every palette needs its own. Inheriting them across
    // palettes applies a correction tuned for one drawing to a different one,
    // which is worse than no correction at all.
    if (A.poseScale && A.poseScale[key]) f.poseScale = A.poseScale[key];
    else if (A.poseScale)                delete f.poseScale;
    if (A.offsets && A.offsets[key])     f.offsets   = A.offsets[key];
  }
  // A tier may be text-only, because the time-up tier has no starburst art
  // yet. This runs at module scope, so an unguarded deliver here takes fit(),
  // init() and the whole game down with it.
  // Solo is p1 and p2 together. It is derived rather than authored, so it
  // cannot fall out of step with either half. The legend also has one fewer
  // column to explain, because a lone player uses whichever side they reach
  // for.
  CONFIG.keys.solo = Object.fromEntries(
    Object.keys(CONFIG.keys.p1).map(act =>
      [act, [...CONFIG.keys.p1[act], ...CONFIG.keys.p2[act]]]));

  // The BURSTS are not per participant, so they follow `active` and never an
  // override. This used to read the loop's `A`. A move of that binding into
  // the loop, for the per-participant override, therefore broke boot
  // outright.
  const toDir = p => p.replace(/^assets\/sfx(-neon)?/, P[P.active].sfxDir);
  for (const tier of Object.values(CONFIG.phrases))
    for (const item of tier.items){
      if (item.img)  item.img  = toDir(item.img);
      if (item.imgs) item.imgs = item.imgs.map(toDir);
    }
})();

/* Cache-bust an asset URL. Only for files REPLACED under the same name —
   sprites get added rather than edited, so they do not need it. Bursts and
   AUDIO do: both get re-rendered in place under a name the page already
   references. Bump CONFIG.art.version whenever you overwrite one. */
const bust = u => u + (u.includes("?") ? "&" : "?") + "v=" + CONFIG.art.version;

const STAGE = CONFIG.stage;
const el = id => document.getElementById(id);
const stageEl = el("stage");
const touchEl = el("touch");

/* players + humanSide, deliberately not a twoPlayer boolean. A boolean can
   only express whether Volt is a CPU. That hard-wires the human to slot 0, and
   a single player on the Volt side then cannot be represented. */
let players = 1;        // 0 = AUTONOMOUS (no humans), 1, or 2
let humanSide = 0;      // 0 = RUST, 1 = VOLT. Only read when players === 1
const cpuFlags = () => players === 2 ? [false, false]
                     : players === 0 ? [true, true]
                                     : [humanSide !== 0, humanSide !== 1];
let running = false;
let paused = true;
let phase = "title";
/* OBSERVED FIRST, ENFORCED SECOND. The legal-move table below is not a guess.
   It was collected by recording every from and to the game actually performs,
   across a soak and a full attract cycle, and then frozen. An invented table
   would have traded one class of defect for a worse one. A refused transition
   that should have been allowed strands the game exactly the way the old race
   did. */
let phaseMoves = new Set();        // every move performed, for the test to read
let illegalPhaseMoves = [];        // ...and the ones the table does not allow

/* OBSERVED, THEN WRITTEN DOWN. Collected by recording every (from -> to) the
   game actually performs across a benchmark, a pause, the attract demo and the
   menus — not imagined. `title` is reachable from anywhere because
   abandonToTitle is the universal abort. */
const PHASE_MOVES = {
  title:     ["attract", "select"],
  attract:   ["title", "select"],
  select:    ["countdown", "title"],
  countdown: ["active", "title"],
  active:    ["roundover", "matchover", "paused", "title"],
  paused:    ["active", "title"],
  roundover: ["countdown", "matchover", "title"],
  matchover: ["select", "countdown", "attract", "title"],
};          // title | attract | countdown | active | roundover | matchover
let roundNum = 1;
let wins = [0,0];
let timeLeft = CONFIG.round.seconds;
let resolvedPhrase = null;   // the phrase this resolve is using, burst + headline
let lastTs = 0, timerAcc = 0;
let shakeUntil = 0;

// ---- attract mode. All of it lives in these four, and every one is reset
// by exitAttract(), so a real match never inherits anything from the demo.
let lastInputAt = 0;          // performance.now() of the last key/pointer
let attractEndAt = 0;         // when the demo hands the title back
let attractResetAt = 0;       // >0 while holding on a demo RESOLVED
/* >0 while the records card is up. It is deliberately NOT a phase. The card
   lives inside phase "title", so every input path that already works there
   keeps working while it is up. No new state can then strand a cabinet on a
   screen with no way out. */
let cardUntil = 0;
let attractTimeLeft = 0;      // the demo's own clock — NEVER the round clock

const held = new Set();       // populated by keys AND touch; loop reads this

function makeParticipant(key, x, facing, isCPU){
  const def = CONFIG.participants[key];
  return {
    key, def, isCPU,
    x, y:0, vx:0, vy:0,
    facing,                   // 1 = faces right, -1 = faces left
    health: def.maxHealth,
    guard: CONFIG.caveat.guardMax,
    // Banked effort, and the clock it is spent into. Starts EMPTY: a meter
    // handed to you at the bell is a move you open with rather than something
    // the round earns.
    reason: 0,
    reasonUntil: 0,
    freeze: 0,               // frames of impact freeze left
    state:"idle", stateTimer:0, responseSpent:false, recover:0,
    walkFrame:0,
    aiNext:0, aiAction:null, aiCaveatAt:0,
    node:null, poseNodes:{}, fallbackNode:null,
  };
}
let F = [];

/* ==================================================================
 * 3. BUILD DOM — every pose image is created once, up front, and
 *    stays in the document. Animation only toggles `.on`.
 * ================================================================== */
const POSES = ["idle","escalate","affirm","clarify","caveat","conceded","concluded","defer","handshake","setback"];

function buildParticipant(f, side){
  const wrap = document.createElement("div");
  wrap.className = "participant";
  // The player's own bot sits in front by default; a landed response puts the
  // bot that delivered it in front for the duration of the exchange. Reads far
  // more like contact than a fixed order does — whoever's limb is doing the
  // work is the limb you see.
  wrap.style.zIndex = f.isCPU ? 10 : 11;
  wrap.style.width = f.def.bodyW + "px";
  wrap.style.height = f.def.spriteH + "px";

  const poses = document.createElement("div");
  poses.className = "poses";

  // A coloured rectangle that stands in for any missing art.
  const fb = document.createElement("div");
  fb.className = "fallback";
  fb.style.background = `linear-gradient(${f.def.color},${f.def.accent})`;
  poses.appendChild(fb);
  f.fallbackNode = fb;

  for (const p of POSES){
    /* A POSE WITH NO ART FOR THIS PARTICIPANT IS SKIPPED, NOT BUILT. Art can
       legitimately exist for one participant and not the other, and RUST got
       the deeper setback first. showPose() already handles that through the
       degrade chain. What it could not survive was this loop. bust() calls
       `u.includes` on an undefined path, which delivered. That aborted
       buildParticipant BEFORE `f.node = wrap`, and left the participant with no
       DOM node at all. The game booted, the HUD drew, the round timer ran, and
       VOLT was simply not there.

       That is the shape of a failure to remember. A name added to POSES
       silently required every participant to have that art, and the cost of
       forgetting was not a missing pose. It was a missing participant. */
    if (!f.def.poses[p]) continue;
    const img = document.createElement("img");
    img.className = "pose";
    img.alt = "";
    img.dataset.pose = p;
    img.src = bust(f.def.poses[p]);
    const anchor = (f.def.anchors && f.def.anchors[p] != null) ? f.def.anchors[p] : 0.5;
    img.style.setProperty("--anchor", (anchor*100).toFixed(2)+"%");
    // One scale factor for every pose, so a prone sprite stays prone-sized.
    // poseScale is the way out for art that came back off-model. The uniform
    // factor assumes every pose was RENDERED at the same body scale. A
    // generation that ignored the head-size constraint breaks that assumption
    // for one pose only.
    const ps = (f.def.poseScale && f.def.poseScale[p]) || 1;
    const k = ps * f.def.spriteH / (f.def.srcHeight || f.def.spriteH);
    const off = (f.def.offsets && f.def.offsets[p]) || 0;
    const applyScale = () => {
      if (!img.naturalHeight) return;
      const hPx = img.naturalHeight * k;
      img.style.height = hPx + "px";
      img.style.width  = (img.naturalWidth * k) + "px";
      if (off) img.style.setProperty("--offsetY", (-off * hPx).toFixed(1) + "px");
    };
    if (img.complete) applyScale(); else img.addEventListener("load", applyScale, {once:true});
    img.addEventListener("error", ()=>{ img.dataset.failed = "1"; }, {once:true});
    poses.appendChild(img);
    f.poseNodes[p] = img;
  }
  wrap.appendChild(poses);
  el("participants").appendChild(wrap);
  f.node = wrap;
}

/* Three ways a pose can be unusable: the node was never built, its art 404ed,
   or it has not decoded yet. All three mean that something else is drawn. */
function poseAvailable(f, pose){
  const n = f.poseNodes[pose];
  return !!n && n.dataset.failed !== "1" && n.complete !== false;
}

// Show exactly one pose. Falls back to the rectangle if art is missing.
/* WHICH ART A POSE ACTUALLY RESOLVES TO. It is lifted out of showPose because
   placement needs it too. A burst is spawned during exchange resolution, which
   runs BEFORE render, so f.poseNode still holds the previous frame's art.
   Measured on a real recording: a participant in the conceded state was
   carrying volt-defer.png, at 245px against a standing 429. headY therefore
   came back 184px low, and the burst landed on the other participant. A pose
   resolved on demand costs nothing and cannot go stale. */
function resolvePose(f, pose){
  if (poseAvailable(f, pose)) return pose;
  const chain = { escalate:["idle"], concluded:["conceded","idle"], conceded:["idle"],
                  caveat:["idle"], clarify:["affirm","idle"], affirm:["idle"],
                  defer:["caveat","idle"], handshake:["idle"], setback:["conceded","idle"] };
  return (chain[pose] || []).find(a => poseAvailable(f, a)) || null;
}
function showPose(f, pose){
  let target = pose;
  if (!poseAvailable(f, target)){
    // graceful degrade: escalate->idle, concluded->conceded->idle
    const chain = { escalate:["idle"], concluded:["conceded","idle"], conceded:["idle"],
                    caveat:["idle"], clarify:["affirm","idle"], affirm:["idle"],
                    // Until defer art exists, the guard stance is the closest
                    // read: both are low and defensive.
                    defer:["caveat","idle"],
                    // Only the NEON set has wind-up art, and a missing
                    // anticipation frame must cost nothing: falling back
                    // to idle gives exactly the animation that shipped
                    // before the pose existed.
                    handshake:["idle"],
                    // Only RUST has a deeper conceded reaction so far. Falling
                    // back to `conceded` costs nothing: it is the pose the setback
                    // settles into anyway, so VOLT simply skips the first
                    // pause rather than showing anything wrong.
                    setback:["conceded","idle"] };
    const alts = chain[pose] || [];
    target = alts.find(a=>poseAvailable(f,a)) || null;
  }
  // A pose this participant has no art for was never built, so there is no node to
  // toggle. Skipping is the same statement buildParticipant makes: a missing pose
  // costs the pose, never the participant.
  for (const p of POSES) f.poseNodes[p]?.classList.toggle("on", p===target);
  /* REMEMBER WHICH ART IS ACTUALLY UP. Burst placement needs the height of
     the pose ON SCREEN, and `target` is not the pose that was asked for.
     showPose degrades defer to caveat art, handshake to idle, and setback to
     conceded. A record of the resolved node is the only way to get the real
     height without a layout read. buildParticipant has already written it into
     the style. */
  f.poseNode = target ? f.poseNodes[target] : null;
  const useFallback = target === null;
  f.fallbackNode.classList.toggle("on", useFallback);
  if (useFallback) f.fallbackNode.dataset.pose = pose.toUpperCase();
}

/* ==================================================================
 * 4. INPUT — keys and touch both write into `held`.
 * ================================================================== */
// Every real input stamps this. The title screen's idle countdown is measured
// from it, and it is what attract mode listens for to bail out.
function noteInput(){ lastInputAt = performance.now(); }

/* Every PRESS SPACE prompt also takes a CLICK. A cabinet screen that names one
   input and silently accepts only that one is a screen people poke at. The poke
   is the natural thing to try. Keyboard and pointer route through this one
   function, so the two can never drift apart.

   Screens that offer a CHOICE are absent by design. The select screen and the
   end-of-benchmark screen both have real buttons with their own handlers. A
   stray click that picked one of them would be a surprise rather than a
   convenience. Only screens with a single obvious next step are listed. That
   is why roundover is here and matchover is not. */
function advancePrompt(fromKey){
  if (phase==="attract"){ exitAttract(true); return true; }
  if (phase==="title"){ selectScreen(); return true; }
  if (phase==="roundover"){ advance(); return true; }
  // The keyboard CAN confirm the end screen, because SPACE acts on whatever
  // is highlighted. A click cannot, because it points at nothing.
  if (phase==="matchover" && fromKey){ confirmEnd(); return true; }
  if (phase==="paused"){ togglePause(); return true; }
  return false;
}
/* pointerdown and touchstart both fire for one tap on a touch device, and
   advance() twice would skip an eval. A short window collapses the pair. */
let lastPointerAdvance = 0;
function pointerAdvance(){
  const t = performance.now();
  if (t - lastPointerAdvance < 250) return;
  lastPointerAdvance = t;
  advancePrompt();
}
addEventListener("keydown", e=>{
  if (e.code === "Space" || e.code.startsWith("Arrow")) e.preventDefault();
  
  noteInput();
  // Sound is handled BEFORE the attract wake-up. Everything else should drop
  // the demo. M is a cabinet control rather than gameplay, and swallowing it
  // meant the first press only woke the screen and left the sound off.
  if (e.code==="KeyM"){ toggleMute(); return; }
  // ANY other key drops the demo and goes to SELECT, on this same event — no
  // timer, no animation to wait out. Returning before held.add() means the key
  // that woke the cabinet is not also read as a control in the first frame.
  if (phase==="attract"){ exitAttract(true); return; }
  held.add(e.code);
  // Arrows move between the two end-screen buttons, exactly as on the select
  // screen, so the same keys mean the same thing on both.
  if (phase==="matchover" && (e.code==="ArrowLeft"||e.code==="KeyA"||
                              e.code==="ArrowRight"||e.code==="KeyD")){
    endIdx = (endIdx + (e.code==="ArrowLeft"||e.code==="KeyA" ? END_CHOICES.length-1 : 1))
             % END_CHOICES.length;
    renderEndChoices();
  }
  else if ((e.code==="Space"||e.code==="Enter") && phase!=="select" && advancePrompt(true)){ /* handled */ }
  else if (phase==="select"){
    const n = SEL_STEPS[selStep].opts.length;
    if (e.code==="ArrowLeft"||e.code==="KeyA"){ selIdx = (selIdx+n-1)%n; renderSelect(); }
    else if (e.code==="ArrowRight"||e.code==="KeyD"){ selIdx = (selIdx+1)%n; renderSelect(); }
    else if (/^Digit[123]$/.test(e.code)){
      const i = +e.code.slice(-1) - 1;
      if (i < n){ selIdx = i; confirmSelect(); }
    }
    else if (e.code==="Space"||e.code==="Enter") confirmSelect();
    else if (e.code==="Escape" && selStep > (isTouch?1:0)){ selStep--; selIdx=0; renderSelect(); }
  }
  if (e.code==="Escape" && (phase==="active"||phase==="paused")) togglePause();
});
addEventListener("keyup", e=> {  held.delete(e.code); });

for (const [id, fn] of [["pauseBtn", togglePause], ["muteBtn", toggleMute]]){
  el(id).addEventListener("click", e=>{
    // Without this the window pointerdown handler below reads the click as
    // "wake the cabinet" and starts a match behind the button press.
    e.stopPropagation();
    noteInput();
    fn();
    e.currentTarget.blur();   // else SPACE later re-triggers the button
  });
  /* BOTH EVENTS, because the window handler listens for both. It stopped
     pointerdown only, and a touch device fires touchstart as well -- so on a
     phone the tap still reached the window, which resumed the game, and then
     this button's own click paused it again. That is the "it unpauses for a
     moment and then pauses" report, and it applies equally to SOUND, where the
     stray wake was starting a match behind the button. */
  for (const ev of ["pointerdown", "touchstart"])
    el(id).addEventListener(ev, e=> e.stopPropagation());
}
addEventListener("blur", ()=> held.clear());

/* SAFARI'S ZOOM GESTURES DO NOT GO THROUGH touch-action. html, body and every
   on-screen button already carry touch-action:none, and a phone still zoomed
   -- because pinch and two-finger zoom are handled by the browser above the
   page, and user-scalable=no in the viewport tag has been ignored by iOS since
   iOS 10, deliberately, so that a page cannot trap someone who needs to
   magnify it.
   What IS refusable is WebKit's own gesture events, which is what two thumbs
   landing together produce -- the reported case, since this game is played
   with a thumb on each side and the two land within a few milliseconds of each
   other constantly.
   passive:false is load-bearing: a passive listener is not permitted to call
   preventDefault, and registering one here would fail silently and look like
   the fix simply did not work.
   Double-tap zoom is NOT handled here on purpose. touch-action:none already
   suppresses it, and a timing guard on touchend would also swallow the
   synthetic click -- which would take out the two-tap select on touch, where
   choosing an option and confirming it are deliberately two quick taps on the
   same button. */
for (const ev of ["gesturestart", "gesturechange", "gestureend"])
  addEventListener(ev, e => e.preventDefault(), { passive:false });
// A pinch that begins as movement rather than as a gesture. No click is
// involved in a multi-touch move, so refusing it costs nothing.
addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); },
                 { passive:false });

// Pointer and touch wake the cabinet too, on any device — not just the touch
// build. Registered before the touch-only handler below, so by the time that
// one runs the phase has already moved on and it cannot double-start.
for (const ev of ["pointerdown","touchstart"])
  addEventListener(ev, ()=>{ noteInput(); pointerAdvance(); }, {passive:true});
/* EXCEPT ON THE BYLINE. Anywhere else a tap advances the screen, so following
   the link would open the site AND start a game behind it. Stopping the
   pointer event is enough and is the least invasive thing that works:
   navigation is driven by the click that follows, which is a separate event
   and still arrives, so the link behaves normally while the screen stays put.
   Capture phase, because the advance handlers are on the window and this has
   to run before them. Listeners already registered on the window for this same
   phase still fire, so the first-gesture audio unlock is unaffected. */
addEventListener("pointerdown", e => {
  if (e.target.closest && e.target.closest(".byline a")) e.stopPropagation();
}, true);

/* #touch in the URL fragment forces the touch build on a desktop browser. It
   is not debug residue. The mobile path has on-screen controls, a single
   player and no player-count step. It is otherwise unreachable, and therefore
   untestable on the machine it is built on. An untestable path quietly rots. */
const isTouch = matchMedia("(hover: none) and (pointer: coarse)").matches
             || navigator.maxTouchPoints > 0
             || location.hash.includes("touch");
if (isTouch){
  document.body.classList.add("touch");
  players = 1;                             // touch forces one-player
  for (const b of document.querySelectorAll(".tbtn")){
    const code = b.dataset.key;
    const down = e=>{ e.preventDefault(); held.add(code); b.classList.add("pressed"); };
    const up   = e=>{ e.preventDefault(); held.delete(code); b.classList.remove("pressed"); };
    b.addEventListener("pointerdown", down);
    b.addEventListener("pointerup", up);
    b.addEventListener("pointercancel", up);
    b.addEventListener("pointerleave", up);
  }

}


/* ==================================================================
 * 5. AI — distance state machine, commits for a cooldown then
 *    re-evaluates. CONFIG.ai.decisionCooldown is the difficulty dial.
 * ================================================================== */
const MOVES = new Set(["approach","retreat","hold","escalate","feint"]);
/* THE REFLEXES: everything the CPU does WITHOUT deciding.

   A guard against a delivery already in the air. A defer under one. An answer
   to an escalate-in. An answer to a whiff. A continued chain, and a spend of
   REASON. Each is a reply to something happening now. Each can consume the
   frame outright. None consults the range bands or the assertiveness dials
   below.

   They were split out of a 586-line updateAI. The boundary between reacting
   and choosing was invisible there. A rule written at the top therefore came
   to govern the PREVIOUS decision rather than the next. The desperate backdash
   then did nothing for a whole build.

   It returns true when it has handled the frame. Nothing is reordered. The
   statements are exactly as they were, and the seeds prove it. */
function aiReflexes(f, counterpart, now){
  const dist = Math.abs(f.x - counterpart.x);
  const A = CONFIG.ai;

  /* ---- IS THIS PRESSURE, OR IS IT AN EXCHANGE -----------------------
     Consecutive deliveries at close range with no gap between them. A player
     who spaces, whiffs and steps out resets this to one, and never arms the
     guard below. A player who holds two buttons down at point-blank climbs it
     on every delivery. That distinction is the entire safety property of these
     dials. They must cost a masher the match without moving the rungs for
     anyone who plays properly.

     ABOVE THE EARLY RETURN, and that placement is the whole mechanic. Below it
     is where every other decision in this function lives, and where this was
     first put. There the counter only advances on frames the CPU is free, and
     it is in concedeLock for 47% of a round against a masher. It therefore
     could not see the responses being landed ON it, which are precisely the
     evidence of pressure. The first build read 40/40 at every rung, unchanged,
     because the count never once reached its threshold.

     A read of state is not an action on it. The early return still gates every
     decision. */
  const delivering = counterpart.state === "affirm" || counterpart.state === "clarify";

  /* Did the lock just end. The guard was rolled only on the opening frame of
     a delivery. Inside a chain the CPU is in concedeLock at the moment the
     next response starts, so there was no roll at all. It therefore got about
     one roll for each engagement and guarded 24% of what was delivered at it.
     Nobody defends a string that way. Back is held THROUGH the lock, and the
     guard is then already up on the first frame the participant owns. This is
     that frame. */
  const lockedNow = f.state === "conceded" || isLocked(f);
  const justFreed = f.aiWasLocked === true && !lockedNow;
  f.aiWasLocked = lockedNow;

  const counterpartDelivering = counterpart.state === "affirm" || counterpart.state === "clarify";

  /* WHAT DO THEY KEEP DELIVERING. A ring of the opponent's last few responses.
     They are recorded on the rising edge of each delivery and ABOVE the early
     return, so the ring keeps filling while this participant is in concedeLock.
     That is exactly when a player who has found something is using it.

     This is the discriminator the whole difficulty problem needed. Every gate
     tried before it measured how far behind the CPU was, which is true of a
     good player and a repetitive one alike. PREDICTABILITY is true only of the
     repetitive one. Recorded human play that passed the top rung 100 times out
     of 100 was 62-77% one button, and a player who mixes never trips it.

     The research describes the same shape. An adaptive AI facing an opponent
     that repeats one move can learn to guard it and then counter during the
     recovery. The source is Ricciardi and Thill, Stanford CS229,
     Stanford CS229, on adaptive opponents. Read the habit, guard it on its first
     frame rather than on reaction, and take the recovery. */
  if (counterpartDelivering && !f.aiCounterpartDelivering){
    (f.counterpartMoves = f.counterpartMoves || []).push(counterpart.state);
    if (f.counterpartMoves.length > CONFIG.ai.readWindow) f.counterpartMoves.shift();
  }

  /* HOLD THE GUARD WHILE THEY ARE STILL DELIVERING. A caveat here is a timed
     state rather than a held stance. It runs 27 frames and lapses. Traced
     against a masher, the CPU guarded correctly on frame 348. The guard expired
     on 374, and the next clarify landed on 375. It defended the string and the
     timer ran out from under it. Nobody defends a sequence that way. Back is
     held, and the guard stays up.

     This is NOT free, and that is the point. Every absorbed response costs the
     guard gauge, and an empty gauge is a break. A break is a long answer window
     and the best thing that can happen to the deliverer. The gauge is the
     game's own answer to an opponent who never stops. It had never once been
     exercised, because the CPU could not hold a guard long enough to spend it.
     Measured across a full run before this change: zero guard breaks, and the
     gauge never below 28 of 56.

     It lapses the moment they stop delivering, which is what lets the counter
     below take the turn the guard bought. */
  if (f.state === "caveat" && f.stateTimer > 0 && counterpartDelivering
      && pressureLevel(f) > 0.5
      && dist < A.closeRange + 70)
    f.stateTimer = Math.max(f.stateTimer, 6);

  if (f.state==="conceded" || f.state==="concluded" || isLocked(f)) return true;

  /* SPEND REASON. It was added because the mechanic shipped usable by the
     human ONLY. Both participants banked effort from every exchange, and only
     one of them had a button. That is not a difficulty setting. It is a
     handicap the player is never told about, and it silently invalidated a
     ladder that had been measured to 99 / 56 / 29.

     Deliberately NOT a `return`. Activation is a state change rather than a
     move, exactly as it is for the player. The bot therefore activates and acts
     in the same decision, instead of spending a whole cadence tick on a button
     press.

     SPENT WHERE IT PAYS, and not the instant it fills. The install buys
     depletion and recovery, and both are worthless at a distance. A bot that
     fired it the moment the bar filled would routinely spend five seconds
     walking. It therefore waits for the opponent to be close enough to
     pressure. There is one exception. Near the end of its bar it fires
     regardless, because effort banked through a resolve is effort wasted. */
  if (f.reason >= CONFIG.reason.max && !reasonActive(f)
      && now >= f.aiNext
      && (dist <= A.closeRange + 60 || f.health <= f.def.maxHealth * 0.3)
      && Math.random() < (A.reasonSkill ?? 0))
    spendReason(f);

  /* NO WHIFF-BAIT. It was built, measured and removed. The note stays so that
     nobody builds it again. A step outside a READ move's real threat range, to
     make it whiff, is the textbook answer to a predictable long poke. Here it
     took clarify-spam at ULTRATHINK from 50% to 83%.

     The reason is specific to what a spammer does. A step away from an
     opponent who is walking forward is a race that cannot be won. It also gives
     up the guard and counter that were working. CLARIFY reaches 274 in
     practice, so the ground needed to escape it is more than a step. Every
     frame spent retreating is a frame not spent answering. Retreat is a real
     answer to a poke delivered from a HELD position. It is not an answer to
     pressure.

     `threatRange()` stays. The 74px it measures is true and worth having.
     Nothing acts on it by backing up. */

  /* TAKE THE TURN THE GUARD BOUGHT. No reaction roll, for the reason the
     CONVERSION branch above already gives: +3 is 50ms, nobody reacts to it,
     and nobody needs to -- being owed a turn is state, not a read.

     One roll for each guard, won or lost. Left live, it would re-roll every
     frame until it fired. That turns a chance into a certainty, and it hands
     the top rung a guaranteed counter after every caveat. */
  if (f.counterFrames > 0 && f.recover <= 0 && !isLocked(f) && f.y === 0){
    /* PUSHED OUT OF ITS OWN ANSWER. Pushback on caveat ends the string, which
       is what it is for. It also carries the deliverer past the range the
       counter needs, so the turn the guard had just bought was delivered away 25
       times in 193. A walk back in keeps the turn rather than dropping it, and
       the window expires on its own if the walk does not arrive. */
    if (dist > CONFIG.responses.clarify.reach){
      f.aiAction = "approach";
      applyAI(f, counterpart, now);
      return true;
    }
    /* A READ IS FULL CONFIDENCE. Gated on pressureLevel alone, this fired 5
       times in 63 openings. The CPU guarded the habit correctly and then did
       not spend the turn. The ramp measures how badly the bot is LOSING, and a
       bot that reads correctly is not losing badly. A bot that knows what is
       coming and declines the answer is the wrong half of the mechanic. */
    const conf = Math.max(pressureLevel(f), readMove(f) ? 1 : 0);
    const take = Math.random() < dialUp(A.counterSkill) * conf;
    f.counterFrames = 0;
    if (window.__probe) window.__probe.counterOffered++;
    if (take){
      if (window.__probe) window.__probe.counterFired++;
      tryResponse(f, dist <= CONFIG.responses.affirm.reach ? "affirm" : "clarify");
      f.aiNext = now;
      return true;
    }
  }

  /* THE COUNTER IS TESTED BEFORE THE GUARD, and the order is the mechanic.
     With the guard first, any frame in which the opponent was mid-delivery sent
     the CPU back into caveat and returned. Against an opponent delivering
     almost continuously it therefore guarded repeatedly, and never once spent
     the turn the guarding bought. The counter fired 25 times out of 193
     openings.

     A turn that is owed outranks another guard. Another guard is what to do
     with nothing better available, and here there is something better. */
  /* GUARD ON THE FIRST FRAME OF THE DELIVERY, and not 230ms into it. The
     reactive branch further down cannot stop the response that triggers it.
     AFFIRM's box shuts at 167ms and the fastest rung answers at 230. Under
     sustained pressure the guard therefore has to be a read rather than a
     reaction. It is rolled ONCE for each delivery. Rolled per frame, an 0.88
     chance is a certainty inside two frames, and the top rung would become
     untouchable. */
  if ((counterpartDelivering && !f.aiGuardRolled) || justFreed){
    f.aiGuardRolled = true;
    /* READ IT, or fall back to losing badly enough to start guarding. The read
       fires on the FIRST frame of the delivery. There is nothing to react to,
       because the move was known before it started. That is the only way to
       answer something whose active window shuts before any reaction time in
       the game. */
    const read = readMove(f) === counterpart.state;
    if ((read || (f.concedeRate ?? 0) > A.pressureAt)
        && dist < A.closeRange + 70 && f.y === 0
        && f.recover <= 0 && !isLocked(f)
        && Math.random() < dialUp(A.pressureGuard) * pressureLevel(f)){
      if (window.__probe) window.__probe.pressGuard++;
      setState(f, "caveat"); f.caveatLatch = true; f.aiCaveatAt = 0; return true;
    }
  } else if (!counterpartDelivering) f.aiGuardRolled = false;

  /* THE CPU ANSWERS AN INCOMING RESPONSE AFTER A DELAY, some of the time. A
     high AFFIRM can be answered with a DEFER instead of a CAVEAT. The reaction
     window is the same and the outcome is better. It also shows the player the
     answer to a move that is about to land.

     THE ANTI-AIR ANSWER. An ESCALATE is the most readable move in the game. It
     is slow, it is committed, and its landing point is fixed from the moment
     it starts. An answer to one is a basic skill in games of this kind. It is
     also why the high response exists. The body box tucks in the air, so it
     clears CLARIFY and stays inside AFFIRM. The whole high and low design is
     built around that answer, and the CPU never used it.

     The response is delivered on the way DOWN and not at the highest point.
     The box must still be live when the counterpart arrives. The chance is set
     for each rung, so the easiest rung lets most escalates through and
     ULTRATHINK answers almost all of them.

     THE REACTION CLOCK STARTS AT TAKEOFF, not at the highest point. The
     paragraph above states that an escalate is readable from the moment it
     starts. The code did not do that. A wait for the descent leaves only the
     descent to react in, and the descent is half an escalate. escalateV 19 against
     gravity 1.05 is about 18 frames up and 18 down, which is about 300ms. The
     ULTRATHINK reaction of 230ms consumed nearly all of it. Any answer that
     came due while the CPU was mid-delivery was lost.

     Measured for each OPPORTUNITY rather than for each delivery, that rung
     answered 55 percent of descending escalates against a configured 0.85.
     THINK and THINK HARD matched their numbers exactly. The error scaled with
     how busy a rung is, which is the signature of this defect.

     Arming at takeoff gives the whole airtime to react in. The delivery stays
     gated on the descent, so the box is live on arrival. The chance for each
     rung remains the only difficulty control. This corrects delivery and not
     assertiveness.

     ONE ROLL FOR EACH ESCALATE. The chance is a probability for each escalate
     and must stay one roll. With the whole airtime available, a failed roll
     re-armed and rolled again one reaction later. antiAirChance then means at
     least one success in however many attempts fit. That moved THINK from a
     configured 15 percent to 21 percent, and THINK HARD from 45 percent to 56
     percent. It is a difficulty change introduced by a correction that was
     supposed to be about delivery only. */
  const counterpartAirborne = counterpart.y > 0 && f.y === 0 && dist < A.closeRange + 90;
  if (counterpartAirborne && !isLocked(f) && f.recover <= 0){
    if (!f.aiAntiAirAt && !f.aiAntiAirRolled) f.aiAntiAirAt = now + A.caveatReactionMs;
    else if (f.aiAntiAirAt && now >= f.aiAntiAirAt && counterpart.vy < 0){
      f.aiAntiAirAt = 0;
      f.aiAntiAirRolled = true;
      if (Math.random() < A.antiAirChance){
        // Tag the intent so a harness can tell a DELIBERATE anti-air from an
        // ordinary delivery that happened while the counterpart was in the
        // air. Without it the soak counted both. It then reported the easiest
        // rung answering 32% of escalates against a configured 15%. The
        // difference was coincidence scored as skill.
        f.aiIntent = "antiair";
        tryResponse(f, "affirm");
        f.aiIntent = null;
        return true;
      }
    }
  } else if (counterpart.y === 0){ f.aiAntiAirAt = 0; f.aiAntiAirRolled = false; }

  // CONVERSION. A response that landed cancelled most of its own recovery and the
  // receiver is still locked, so there is a second concession available now.
  // Taking it is the skill that changes what an opening is WORTH rather than
  // how often one appears -- which is the whole reason it exists: every other
  // difficulty dial here makes a rung delivery more, and delivering more is what
  // gives a human something to punish.
  //
  // No reaction delay, deliberately. You do not react your way through a
  // combo, you commit to it -- the decision was made when the first conceded
  // landed. Reaction gates the openings; execution gates the conversion.
  if (f.chainCount >= 1 && f.chainCount < CONFIG.responses.comboMax
      && counterpart.state === "conceded" && counterpart.stateTimer > 0
      && f.recover <= 0 && !isLocked(f) && f.y === 0
      && dist <= CONFIG.responses.clarify.reach
      && Math.random() < A.comboSkill){
    tryResponse(f, dist <= CONFIG.responses.affirm.reach ? "affirm" : "clarify");
    f.aiNext = now;
    return true;
  }

  /* CASHING THE BAIT. The ordinary whiff answer below fires only from inside
     CLARIFY's reach. That is exactly where the CPU is NOT after a backdash,
     because it is 400px away and made the space itself. For the moment after a
     backdash it therefore answers a whiff wherever the whiff happens, and
     walks in first when the answer is out of range. Without this the CPU
     creates the opening and then declines it. */
  if (now < (f.aiPunishUntil || 0) && !isLocked(f) && f.recover <= 0 && f.y === 0
      && counterpart.recover > 0 && counterpart.state !== "conceded" && !responseBox(counterpart)){
    if (dist <= CONFIG.responses.clarify.reach){
      f.aiPunishUntil = 0;
      tryResponse(f, dist <= CONFIG.responses.affirm.reach ? "affirm" : "clarify");
      f.aiNext = now + A.decisionCooldown;
      return true;
    }
    if (dist <= A.punishChaseMax){
      f.aiAction = "approach";        // close it, THEN take the punish
      f.aiNext = now + A.moveCommitMs;
      applyAI(f, counterpart, now);
      return true;
    }
    // Too far to convert. Hold the space rather than donating it back.
  }

  // WHIFF ANSWER. A response that misses leaves its owner committed and unable
  // to answer for the rest of its recovery. A step in to answer that is the
  // most valuable habit in the neutral game. The CPU did not have it at all.
  // Measured against a reference player, the player answered a whiff hundreds
  // of times a run, and the CPU never once did.
  //
  // The window is real and short. AFFIRM is committed for 28 frames and its
  // box is live for six of them, so about 300ms of recovery is exposed.
  // Whether a rung can answer a whiff at all therefore falls out of its
  // reaction time, rather than being granted separately. That is how it works
  // in the games this borrows from, and it is why the reaction ladder had to
  // come first.
  //
  // `!responseBox(counterpart)` tests for a participant that is committed and
  // no longer able to connect. During the active frames the box is live, and a
  // step in is a trade rather than an answer.
  if (counterpart.recover > 0 && counterpart.state !== "conceded" && !responseBox(counterpart)
      && f.y === 0 && !isLocked(f) && f.recover <= 0){
    if (!f.aiWhiffAt) f.aiWhiffAt = now;
    else if (now - f.aiWhiffAt >= A.caveatReactionMs
             && dist <= CONFIG.responses.clarify.reach
             && Math.random() < A.punishChance){
      f.aiWhiffAt = 0;
      tryResponse(f, dist <= CONFIG.responses.affirm.reach ? "affirm" : "clarify");
      f.aiNext = now + A.decisionCooldown;
      return true;
    }
  } else f.aiWhiffAt = 0;

  if ((counterpart.state==="affirm"||counterpart.state==="clarify") && dist < A.closeRange+70){
    if (!f.aiCaveatAt) f.aiCaveatAt = now + A.caveatReactionMs;
    else if (now >= f.aiCaveatAt){
      // DEFER is rolled FIRST and on its own, and not nested inside the
      // caveat roll. Nested, its real odds were caveatChance times
      // deferChance, which is about one in six at the default. The move never
      // appeared on screen at all during a demo bout. A counter the player
      // never sees the CPU use is a counter they never learn exists.
      if (counterpart.state==="affirm" && f.y===0 && Math.random() < A.deferChance){
        setState(f,"defer"); f.aiDuckUntil = now + 260; f.aiCaveatAt = 0; return true;
      }
      if (Math.random() < A.caveatChance){
        setState(f,"caveat"); f.aiCaveatAt = 0; f.caveatLatch = true; return true;
      }
    }
  } else f.aiCaveatAt = 0;
  // A defer is HELD, so the AI needs its own reason to stand back up. Nothing
  // else clears the state, and the participant would otherwise stay low for
  // the rest of the round.
  if (f.state === "defer"){
    if (now < f.aiDuckUntil){ f.vx = 0; return true; }
    setState(f,"idle");
  }

  return false;              // nothing reflexive applied; go and decide
}

/* THE DELIBERATE HALF: what to do when nothing demanded an answer. */
function updateAI(f, counterpart, now){
  if (aiReflexes(f, counterpart, now)) return;
  /* Recomputed rather than threaded through. All four are pure reads of state
     the reflexes do not change, so this cannot drift from what they saw. A
     context object passed between the halves would be a place for the two to
     disagree. */
  const dist = Math.abs(f.x - counterpart.x);
  const A = CONFIG.ai;
  const delivering = counterpart.state === "affirm" || counterpart.state === "clarify";
  const read = readMove(f) === counterpart.state;
  if (now < f.aiNext) { applyAI(f, counterpart, now); return; }   // committed: keep doing it
  // Movement re-decides on a SHORTER clock than an response commits for.
  // Holding a walk for the full decisionCooldown is what produced one long
  // uninterrupted glide across the stage.
  // Second wind is resolved HERE, before anything reads it. Rolled ONCE, the
  // first time this participant is on the brink. The latch matters — without it a
  // 25% chance re-evaluated every decision becomes a certainty within a
  // second. `secondWind` is cleared by spawnPair, so it is per ROUND.
  if (f.dMode === undefined && f.health > 0 &&
      f.health / f.def.maxHealth < A.desperateAt){
    const r = Math.random(), M = A.desperateModes;
    f.dMode = r < M.retreat ? "retreat"
            : r < M.retreat + M.wind ? "wind" : "sharpen";
    // The flag stays, because postResponseRest and the tests read it. It is now
    // an OUTCOME of the endgame roll rather than a roll of its own.
    f.secondWind = f.dMode === "wind";
  }
  const wind = f.secondWind === true;
  const sharp = f.dMode === "sharpen";
  // Sharpen is one multiplier, applied wherever "better" means "sooner".
  const keen = sharp ? 1 - A.sharpenBy : 1;
  /* PEAK, THEN BREATHE. Once the player has taken enough pressure to count
     as a peak, the CPU eases its assertiveness for a couple of seconds and then
     comes again. Latched to a deadline rather than re-evaluated every decision,
     for the same reason the endgame modes are: a per-decision test at this
     threshold flickers, and a flickering director is a visible one.

     Deliberately NOT a change to how well it plays. Reactions, punish odds and
     reads are all untouched -- only whether it is coming forward right now.
     That is the difference between an exchange with a rhythm and a bot that got
     worse because you were losing. */
  if (A.paceRelaxMs && (counterpart.paceRate ?? 0) >= A.paceIntensity
      && now >= (f.paceUntil || 0))
    f.paceUntil = now + A.paceRelaxMs;
  const relaxing = now < (f.paceUntil || 0);
  // Comfortable means the player has NOT been taking concessions over the window, and
  // that is when the Director leans in. Without this the cycle is all valve.
  const building = A.paceRelaxMs && !relaxing
                && (counterpart.paceRate ?? 0) < A.paceIntensity * 0.5;
  const windMul = (wind ? A.secondWindSpeed : 1) * keen;
  /* NOTE, because it is not obvious and it cost a wrong build: this runs
     BEFORE the new action is chosen, so the window it grants is keyed to the
     action still stored from LAST time. Every action therefore inherits the
     previous one's window. Fine as it stands -- actions repeat -- but it means
     a rule written here cannot govern the action about to be picked. The
     desperate backdash sets its own window at the bottom of this function
     instead, where the choice has actually been made. */
  f.aiNext = now + (MOVES.has(f.aiAction) ? A.moveCommitMs
                  : A.decisionCooldown * windMul);

  const depleted = 1 - f.health/f.def.maxHealth;
  // baseAssertiveness is THE lever on how fast a level closes a round. It was
  // hardcoded at 0.45, so every difficulty responded at the same rate once it
  // was in range. Only the timing between decisions differed. That is why the
  // three levels felt much closer together than their names promise.
  const aggro = (A.baseAssertiveness + depleted * A.assertivenessWhenDepleted
              + (wind ? A.secondWindAssertiveness : 0))
              * (relaxing ? A.paceEase : building ? A.paceBuild : 1);

  // There is no walk art, so a straight approach is a sprite gliding across
  // the floor with its feet still. Breaking the crossing up into hops and
  // short backward feints gives the movement a rhythm, which reads as
  // intent rather than as a missing animation.
  // Only offer a hop from the GROUND. Without this the AI re-decides in
  // mid-air and queues the next escalate for the instant it lands. That put it
  // airborne for 55% of the crossing, which reads as hopping rather than as
  // punctuation.
  // Airborne, the only thing worth doing is a commitment to an air response.
  // The moment to do it is on the way DOWN. A delivery at the apex leaves the
  // recovery to expire before the box ever reaches the opponent. It is
  // deterministic rather than a per-frame roll, because a per-frame roll at
  // 60fps fires almost immediately.
  if (f.y > 0){
    // An air response is a SKILL, gated per difficulty. A grant of it to everyone
    // cut THINK's time-to-finish from 44s to 24s in one change, because a
    // escalate suddenly closed distance AND landed a response.
    if (f.vy < 0 && dist < A.closeRange + 80 && Math.random() < A.airResponseChance)
      tryResponse(f, Math.random() < 0.5 ? "affirm" : "clarify");
    return;
  }
  const canHop = f.y === 0;
  /* EVERY RETREAT OPTION SCALES WITH HOW CLOSE THIS BOT IS TO LOSING. At full
     health desp is 0 and every figure below is exactly what it always was. */
  const desp = desperation(f);
  const despMul = 1 + desp * A.desperateRetreat;
  const retreatNow = A.retreatChance * despMul;
  // Backing into your own corner is never the plan, so the option is simply
  // withdrawn when there is no room left. It converts to holding ground,
  // which is what being cornered actually looks like.
  const canBackOff = wallLimit(f, f.x < counterpart.x ? -1 : 1) > A.backOffRoom;
  // The far and mid bands are still cumulative ladders while the close band is
  // weighted. That difference is DELIBERATE rather than half-finished work. The
  // close one was converted because it was broken. ULTRATHINK's assertiveness
  // ran the thresholds past 1.0, and defer and retreat could not occur. These
  // two are not broken. Measured across all three levels, every option here
  // holds a real share. A conversion would renormalise proportions that were
  // tuned by playing, and would fix nothing.
  //
  // They DO carry the same latent hazard. feintChance or deferChance raised far
  // enough makes an option below silently stop happening. A test guards that.
  // It samples this function in each band at each level and fails if any option
  // never comes up. That is cheaper than a rewrite of working code, and it
  // catches the fault the moment it appears.
  if (dist > A.midRange){
    const r = Math.random();
    // At long range a retreat gains nothing and reads as fleeing, so it is
    // rare here — a quarter of the mid-range rate.
    f.aiAction = (canHop && r < A.escalateChance) ? "escalate"
               : r < A.escalateChance + A.feintChance ? "feint"
               : (canBackOff && r < A.escalateChance + A.feintChance + retreatNow*0.25) ? "retreat"
               : "approach";
  } else if (dist > A.closeRange){
    // The spacing zone — just outside its own reach. This is where a participant
    // that moves BOTH ways stops looking like one that only advances, so the
    // retreat rate is at full strength.
    const r = Math.random();
    const j = A.escalateChance*1.4, fe = j + A.feintChance;
    const du = fe + A.deferChance * A.midDuckShare;
    // DEFER at SPACING range, not only nose-to-nose. A low stance just outside
    // reach is the real use of the move. The participant becomes small to bait
    // the high response, rather than waiting until it is already in range.
    // Confinement of the low stance to the close branch made it rare in play,
    // even where the close branch worked. Measured across a full round, the
    // bots defer on 6-9% of frames at the upper levels, and never at the
    // lowest.
    // SPACING. The tail was previously an approach on 88% of decisions and a
    // hold otherwise. That is not a spacing zone. It is a walk forward with a
    // pause in it. Real footsies hold a distance: just outside the opponent's
    // longest probe, where their delivery misses and can be answered, and one
    // step from being able to answer it.
    //
    // The behaviour is a share rather than a rule, so the older wandering
    // still happens. It reads better than a bot that stands on a line, and
    // every option in this branch must stay reachable. Otherwise the ladder
    // starves one of them silently.
    /* DELIBERATELY the configured reach, not the real threat range.

       Both figures are known to be wrong by 74px. A response lands when its
       box touches the EDGE of a body, so CLARIFY reaches 274. A move of this
       line out to the true figure was tried and it broke the game. Both
       participants carry the same reach. A line safely outside THEIR clarify
       is also outside YOUR OWN, so every round ran to the clock in a standoff.
       The suite caught it as three failures at once. One of them was a 60s
       timeout where a resolve belonged.

       No distance is safe and threatening at the same time in a symmetric
       two-move game. Neutral spacing therefore stays where it produces an
       exchange. The real threat range is used where it pays for itself, which
       is the whiff-bait below. That step goes outside a KNOWN move, on
       purpose, and briefly. */
    const spaceAt = CONFIG.responses.clarify.reach + A.spacingPad;
    const slack = A.spacingSlack;     // deadband, or it jitters on the spot
    /* FOOTSIES ARE FOR NEUTRAL. A held line just outside your own reach, in
       wait for a whiff to answer, is the correct game against an opponent that
       picks their moments. It is also how the CPU comes to engage two and a
       half times a round against an opponent that picks none.

       THE LINE IS INSIDE CLOSE RANGE, so there are only two cases here rather
       than three. A third case existed: step back when the gap closes inside
       the line. It was described as pressure on the CPU to move backwards
       against a rushdown opponent, and it never once did that. The band opens
       at closeRange, which is 217 at the top rung. A step back needs a gap
       under spaceAt - slack, which is 189. The case is therefore empty by
       geometry:

           spaceAt = clarify.reach + spacingPad = 185 + 30 = 215
           step back below 189, but the band starts at 217 / 212 / 204

       Measured rather than argued. A sweep of every distance the band can
       present, with the other sources of retreat silenced and this path always
       taken, gives 984 samples: 0 retreats, 150 hold, 834 approach. The 150 is
       the 25 distances within slack of the line, times six.

       Restoration of the case by a wider line does not work. That was tried and
       reverted. A stand outside the opponent's reach produced standoffs, and
       one round ran to a 60s timeout where a resolve belonged (see above). The
       line stays where it produces an exchange. The empty case is deleted
       rather than left as a comment for behaviour the game does not have. The
       test named `a spacing line the CPU can never step back to` guards the
       arithmetic.

       An opponent that is not waiting cannot be waited out. Under pressure the
       line is abandoned and the CPU closes instead. The whiff it stands there
       in hope of is not coming. */
    const holdTheLine = pressureLevel(f) > 0.4 || dist > spaceAt + slack
                      ? "approach" : "hold";
    f.aiAction = (canHop && r < j) ? "escalate"
               : r < fe ? "feint"
               : r < du ? "defer"
               : (canBackOff && r < du + retreatNow) ? "retreat"
               : Math.random() < A.spacingSkill ? holdTheLine
               : (r < 0.88 ? "approach" : "hold");
  }
  else {
    // DEFER has to be a CHOICE here, not only a reaction. As a pure reaction
    // it never fired at all. AFFIRM's active window closes at 167ms and the
    // reaction delay is 150ms. The affirm has therefore almost always landed
    // before the AI is allowed to answer it. Measured across three demo
    // bouts: six
    // reactions to CLARIFY, and zero to AFFIRM.
    // A low stance on purpose is also how people actually play. The
    // participant becomes small to bait the high response, rather than waiting
    // to see it.
    // WEIGHTED, not a cumulative ladder over a roll in [0,1).
    //
    // The ladder tested `r < aggro*0.55`, then `r < aggro`, then
    // `r < aggro+0.2`, and so on. That silently depends on aggro staying small
    // enough for the later thresholds to remain under 1.0. ULTRATHINK's
    // assertiveness is 0.92, so the guard test read `r < 1.12` and was always
    // true. Everything below it was unreachable: 0 defers and 0 retreats in
    // 4000 sampled decisions, with deferChance:0.7 configured and doing
    // nothing. The dial existed, was documented, and could not fire.
    //
    // Weights cannot starve each other that way. A raise of assertiveness
    // raises the RESPONSE share and leaves every other option reachable, which
    // is what a more assertive bot should have meant all along.
    /* UNDER PRESSURE THE BAG IS SMALLER. Retreat and defer are neutral-game
       options. They buy space and bait a high response against an opponent who
       chooses when to engage. Against an opponent already on top of the
       participant and delivering every frame they own, ground given away is a
       slower loss. At the normal weights those two take 45% of the CPU's
       close-range decisions. That is most of the reason it delivers six
       deliveries a round against a masher's twenty-three.

       The choice therefore narrows to the two that contest the space: answer
       them, or guard and take the turn that a guard buys. Same assertiveness,
       same guard weight, nothing added. The options that do not apply are
       simply not offered. */
    /* UNDER PRESSURE the retreat is normally withdrawn. As above, ground given
       away to an opponent who delivers every frame is a slower loss. That holds
       while there is a bar left to spend. It stops holding at 10% of one, and
       the option therefore returns weighted PURELY by desperation. It is absent
       at full health, exactly as before, and it appears only as the bot runs
       out of alternatives worth preferring. */
