    f.aiAction = pickWeighted(pressureLevel(f) > 0.4 ? {
      affirm:   aggro * 0.55,
      clarify:    aggro * 0.45,
      guard:   A.guardWeight,
      retreat: canBackOff ? A.retreatWeight * desp * A.desperateRetreat : 0,
    } : {
      affirm:   aggro * 0.55,
      clarify:    aggro * 0.45,
      guard:   A.guardWeight,
      defer:    A.deferChance * 0.4,
      retreat: canBackOff ? A.retreatWeight * despMul : 0,
    });
  }
  /* THE BACKDASH OWNS ITS WINDOW, and it has to be claimed here rather than
     above: re-deciding at the ordinary 190ms move cadence is exactly how the
     distance was being handed back to the player a fifth of a second later. */
  if (f.aiAction === "retreat" && desperation(f) > 0){
    f.aiNext = now + A.backdashCommitMs;
    // ...and the moment AFTER it, in which the whiff it is fishing for is taken.
    f.aiPunishUntil = f.aiNext + A.backdashPunishMs;
  }
  applyAI(f, counterpart, now);
}
/* HOW CLOSE TO LOSING, 0 to 1. Zero until the bar drops under `desperateAt`,
   then ramping to 1 at nothing left. Read fresh on every decision, so a bot
   that is put down and climbs back out stops running immediately. */
function desperation(f){
  const at = CONFIG.ai.desperateAt;
  if (!at || !f.def.maxHealth) return 0;
  /* GIVING GROUND IS ONE OF THREE ENDGAMES, and only one. The bot rolls a
     temperament when its bar first drops under the threshold: back away, find
     another gear, or simply play tighter. This ramp belongs to the first of
     those, so a bot in either of the other two does not retreat at all.

     That also retires a rule that used to live here, under which a second
     wind cancelled the retreat. It existed because the two mechanics were
     separate and pointed opposite ways. As branches of one roll they cannot
     collide. */
  if (f.dMode && f.dMode !== "retreat") return 0;
  const share = f.health / f.def.maxHealth;
  return share >= at ? 0 : Math.min(1, (at - share) / at);
}

/* Pick a key in proportion to its weight. Weights are relative, so no caller
   has to make them sum to anything, and a zero weight simply never comes up. */
function pickWeighted(weights){
  let total = 0;
  for (const k in weights) total += Math.max(0, weights[k]);
  if (total <= 0) return Object.keys(weights)[0];
  let r = Math.random() * total;
  for (const k in weights){
    r -= Math.max(0, weights[k]);
    if (r < 0) return k;
  }
  return Object.keys(weights)[Object.keys(weights).length - 1];
}

/* 0 at pressureAt, 1 at pressureFull. Every anti-pressure dial is multiplied
   by this, so the CPU's defence comes up smoothly with the pressure instead of
   switching on. */
function pressureLevel(f){
  const A = CONFIG.ai, r = f.concedeRate ?? 0;
  return Math.max(0, Math.min(1, (r - A.pressureAt) / (A.pressureFull - A.pressureAt)));
}
function afterResponseMove(f, counterpart){
  /* NOT WHILE BEING RUSHED DOWN. A step out after a delivery is correct
     footsies, because whoever just delivered is the one standing in range to
     be answered. It is exactly wrong against an opponent who walks straight
     back in anyway. At 0.65 the CPU concedes the initiative after two
     deliveries in three. Some opponents plan to occupy that space and nothing
     else. Ground handed to them on a schedule is how a rung with 0.88
     assertiveness ends up delivering four affirms a round. */
  if (pressureLevel(f) > 0.5) return "hold";
  // CONFIG.ai spelled out, not the `A` alias: that alias is local to updateAI
  // and this is a different function.
  return (Math.random() < CONFIG.ai.retreatAfterResponse
          && wallLimit(f, f.x < counterpart.x ? -1 : 1) > CONFIG.ai.backOffRoom)
         ? "retreat" : "hold";
}
/* `now` IS THE SIMULATION'S CLOCK, and it has to be, because this function
   sets deadlines that updateAI later compares against that same clock.

   It used to read performance.now() here instead. In the browser the two
   agree, because loop() passes a performance.now() timestamp straight through.
   Nothing looked wrong. The soak drives a VIRTUAL clock starting at 1e6, which
   races ahead of wall time as it runs frames as fast as it can. Every deadline
   written here therefore landed about a million milliseconds in the past, and
   every `now < f.aiNext` test was false.

   The CPU took NO post-response rest and NO defer hold in any simulated match,
   while a real player faced a bot that takes both. Every ladder number in this
   repository was measured against a slightly different opponent from the one
   that ships. It defaults to performance.now(), so the two callers outside the
   simulation keep working. */
function applyAI(f, counterpart, now){
  // The two callers outside the simulation pass nothing, and for them wall
  // time IS the simulation time. Inside, `now` is always given.
  const t = now === undefined ? performance.now() : now; // CLOCK-OK
  const dir = counterpart.x > f.x ? 1 : -1;
  switch(f.aiAction){
    case "approach": f.vx = dir * f.def.speed; break;
    case "retreat":  f.vx = -dir * f.def.speed *
                       (desperation(f) > 0 ? CONFIG.ai.backdashSpeedMul : 0.8); break;
    case "hold":     f.vx = 0; break;
    case "escalate":
      if (f.y === 0) f.vy = f.def.escalateV;
      f.vx = dir * f.def.speed * 0.75;   // carry forward, so it closes ground
      f.aiAction = "approach";           // one hop, then back to normal play
      break;
    // A short step back before coming forward again. Costs the AI almost
    // nothing in ground and buys the crossing a moment, so it stops looking
    // like a sprite being dragged toward you.
    case "feint":
      f.vx = -dir * f.def.speed * 0.55;
      f.aiAction = "approach";
      break;
    // Whoever just delivered is the one standing in range to be answered for it,
    // so stepping out is the skilled follow-up rather than a timid one. It
    // resolves as a real retreat, which the rest turns into backward walking.
    case "affirm":
    case "clarify": {
      const before = f.state;
      tryResponse(f, f.aiAction);
      if (f.state === before){
        // THE DELIVERY NEVER HAPPENED. tryResponse bails silently while
        // recover is still running. This used to charge the full post-response
        // rest anyway and then pick a different action. A decision to deliver,
        // taken a few frames too early, therefore cost the CPU an entire cycle
        // and produced nothing.
        //
        // That is why assertiveness did not translate into deliveries. Measured
        // with a driver playing properly against ULTRATHINK, the player delivered
        // 3046 responses to the CPU's 1173 and won 60 of 60. A driver acting AT
        // RANDOM four times out of five still won 96 of 100. The player fires
        // the instant recovery clears, and the CPU did not.
        //
        // There is therefore no rest for a response that was not delivered, and
        // the intent to deliver it is kept. An immediate return is exactly what a
        // player holding the button does. recover still bounds how often either
        // of them can connect.
        f.aiNext = t;
        break;
      }
      f.aiAction = afterResponseMove(f, counterpart);
      /* A participant on its second wind also stops pausing so long between
         deliveries, which is most of what makes the change legible from outside.
         SHARPEN GETS THE SAME TREATMENT, and without it that mode was very
         nearly inert: `keen` only multiplied the decision cooldown, and this
         line overwrites aiNext on every response turn -- which at close range
         is most of them. A "plays 20% better" that switches off whenever the
         bot delivers a affirm is not a mode, it is a rounding error. */
      const rest = CONFIG.ai.postResponseRest *
                   (f.secondWind === true ? CONFIG.ai.secondWindSpeed : 1) *
                   (f.dMode === "sharpen" ? 1 - CONFIG.ai.sharpenBy : 1);
      f.aiNext = t + rest; break; }
    case "guard":    setState(f,"caveat");  f.aiAction="hold"; break;
    // Held for a moment, like the reactive defer — a crouch that lasts one frame
    // is a twitch, not a stance, and would never be seen.
    case "defer":
      setState(f,"defer");
      f.aiDuckUntil = t + 340;
      f.vx = 0; f.aiAction = "hold"; break;
  }
}

/* ==================================================================
 * 6. PHYSICS + STATE
 * ================================================================== */
const LOCKED = new Set(["affirm","clarify","conceded","caveat","concluded"]);
const isLocked = f => LOCKED.has(f.state) && f.stateTimer > 0;

function setState(f, s){
  if (f.state === "concluded") return;
  f.state = s;
  f.responseSpent = false;
  if (s==="affirm"||s==="clarify") f.stateTimer = CONFIG.responses[s].lock;
  else if (s==="conceded")   f.stateTimer = CONFIG.concedeLock;
  else if (s==="caveat"){ f.stateTimer = CONFIG.caveat.lock;
    // Armed here rather than in readControls, so the AI's guard commits too.
    // setState is the only way into the stance, which makes it the only place
    // this can be missed.
    f.caveatCommit = CONFIG.caveat.commitFrames; }
  else if (s==="concluded") f.stateTimer = 1e9;
  else f.stateTimer = 0;
}
/* Recovery is separate from the response's own lock, and it applies to BOTH
   sides. Without it, a held response key re-fires on the frame the lock
   expires. The pose then snaps straight back to its first frame, which reads
   as a glitch rather than as a delivery. It also makes the button meaningless,
   because mashing is strictly better than timing. The AI had a rest of its own
   in postResponseRest, and the player had nothing. */
/* Every assignment to `recover` goes through here, which is what keeps the
   REASON install honest. It is set in two places: when a delivery starts, and
   again when one connects and cancels into a chain. A multiplier applied at
   only one of them would speed up whiffs and not conversions, or the reverse,
   depending on which was edited. */
function setRecover(f, frames){
  f.recover = reasonActive(f) ? Math.round(frames * CONFIG.reason.recoverMul)
                              : frames;
}
/* The launch speed that carries a participant exactly `px` before constant
   deceleration brings them to rest. Inverting the physics here is what lets
   the config state the shift in the unit the design cares about.

   Solved for the DISCRETE sum, not the continuous one. stepPhysics moves
   before it decelerates, so the travel is v + (v-a) + (v-2a) + ... which
   exceeds the textbook v^2/(2a) by about v/2 -- enough that the continuous
   form overshot a configured 44px by 49.3. Setting

       px = v^2/(2a) + v/2

   and taking the positive root lands every configured distance inside a fifth
   of a pixel, checked across all six shift values the game uses. */
function shiftVel(px){
  const a = CONFIG.physics.groundDecel, d = Math.max(0, px);
  return (-a + Math.sqrt(a * a + 8 * a * d)) / 2;
}
/* A move's own recovery, falling back to the shared default. One reader, so
   the cap and the delivery can never disagree about what a move costs. */
function recoveryOf(kind){
  const A = CONFIG.responses[kind];
  return (A && A.recovery != null) ? A.recovery : CONFIG.responses.recoveryFrames;
}
function tryResponse(f, kind){
  if (isLocked(f) || f.recover > 0) return;
  // Only a person's choices are worth learning from. A CPU's own deliveries would
  // otherwise teach it about itself, and in a mirror both sides would train on
  // each other until the numbers meant nothing.
  if (!f.isCPU) learnMove(kind);
  setState(f, kind);
  setRecover(f, CONFIG.responses[kind].lock + recoveryOf(kind));
}

/* Rock the affected participant's health bar. The class has to come off, and
   the element has to be reflowed, before it goes back on. Otherwise a second
   concession inside the 300ms window does nothing at all. That window is
   exactly when the exchange is busiest and the feedback matters most. */
/* Put a participant in front. Called on every connect, so the delivering limb is
   never hidden behind the bot it lands on. */
function raiseParticipant(front){
  for (const f of F)
    if (f.node) f.node.style.zIndex = (f === front) ? 12 : 10;
}

function joltBar(idx, soft){
  const b = el("bar" + (idx+1));
  if (!b) return;
  const cls = soft ? "jolt-soft" : "jolt";
  b.classList.remove("jolt", "jolt-soft");
  void b.offsetWidth;                 // force a reflow to restart the animation
  b.classList.add(cls);
}

const down = codes => codes.some(c => held.has(c));
function readControls(f, keys){
  if (f.state==="concluded") return;
  const K = CONFIG.keys[keys];
  // GUARD IS HANDLED BEFORE THE LOCK CHECK, deliberately. A guarding
  // participant is locked by definition. Behind that bail the stance could be
  // entered and never dropped. A released key did nothing until the state
  // expired on its own, up to 28 frames later. A guard that cannot be released
  // is not a stance. It is the old latched action wearing a stance's clothes.
  //
  // stateTimer carries both meanings here, and the threshold separates them. A
  // value of 2 means the key is still held. Anything larger is caveatLock,
  // written by a guarded response. A guard therefore drops on the frame the key
  // is released, and caveatLock still pins the participant for its full length
  // whatever the key does.
  if (f.state === "caveat"){
    // COMMITTED. Inside the window the key is not consulted at all: releasing
    // does not drop it and pressing again does not restart it, which is what
    // makes mashing it impossible. Same contract as a delivery mid-lock.
    if (f.caveatCommit > 0){
      // stateTimer still has to be nudged, or the stance expires UNDERNEATH
      // the commit: 2 means "held by choice" and the per-frame tick turns it
      // into idle the moment it reaches zero. Returning early without this
      // gave a guard that dropped after two frames and re-entered on the next
      // press -- the strobe again, wearing a commit.
      f.stateTimer = Math.max(f.stateTimer, 2);
      f.vx = 0;
      return;
    }
    if (f.y === 0 && down(K.caveat)){
      f.stateTimer = Math.max(f.stateTimer, 2);
      f.vx = 0;
      return;
    }
    if (f.stateTimer > 2) return;          // still paying for a guarded conceded
    setState(f, "idle");
  }
  if (isLocked(f)) return;
  let vx = 0;
  if (down(K.left))  vx -= f.def.speed;
  if (down(K.right)) vx += f.def.speed;
  f.vx = vx;
  if (down(K.escalate) && f.y === 0) f.vy = f.def.escalateV;
  // Guard and low stance are BOTH held. A participant guards for exactly as
  // long as the key is held, and drops it the instant the key is released.
  // That is what every game of this shape does, and what hands expect. The
  // guard gauge is what stops it being a free ride, rather than an awkward
  // input.
  //
  // stateTimer is nudged rather than reset, because a guarded response writes
  // caveatLock into it and that must survive. A reset on every held frame
  // would erase the -3 the frame data depends on.
  if (f.y === 0 && down(K.defer)){
    if (f.state !== "defer") setState(f,"defer");
    f.vx = 0;                       // no crouch-walking; the defer is a stance
    return;
  }
  if (f.state === "defer") setState(f,"idle");
  if (f.y === 0 && down(K.caveat)){
    setState(f,"caveat");
    f.stateTimer = 2;              // 2 = held by choice; see the note above
    f.vx = 0;                      // a guard is a stance, not a walk
    return;
  }
  // REASON is checked before the responses and does not consume the frame: it
  // sets a state rather than committing a move, so activating and immediately
  // delivering is one motion rather than two presses with a gap. That is the
  // point of an install -- you spend it to start pressure, not instead of it.
  if (down(K.reason) && spendReason(f)) announceReason(f);
  /* ONE PRESS, ONE DELIVERY. These two lines were level-triggered. A held
     AFFIRM therefore delivered an affirm on every frame the participant was able
     to deliver one. That is free, frame-perfect auto-fire, and it is the reason
     mashing won against the hardest rung 120 rounds out of 120 without dropping one.
     Nobody was out-playing the CPU. The buttons were repeating faster than a
     hand can.

     The guard was already edge-triggered for exactly this reason. The note
     above it records that a held guard produced one guard, and that a fresh
     press was needed for the next. The responses were never given the same
     treatment.

     WITH A BUFFER, because strict edge-triggering penalises a player for
     pressing slightly early, which is most players. A press inside the last
     few frames of recovery is remembered, and it fires the moment the
     participant is free. That is the standard courtesy in this genre. It keeps
     a deliberate rhythm responsive without a return to auto-fire, because the
     buffer is spent by ONE delivery and needs a fresh press to refill. */
  const want = down(K.affirm) ? "affirm" : down(K.clarify) ? "clarify" : null;
  // Latched PER BUTTON, rather than on whether anything is held. A single flag
  // made a switch from AFFIRM to CLARIFY register as the same continuous
  // press. Alternating the two therefore produced one delivery and then
  // nothing. The masher went from winning every round to losing every round.
  // That is the same defect as auto-fire, wearing the opposite face.
  if (want !== f.atkHeldKind){
    f.atkHeldKind = want;
    if (want){
      f.atkBuffer = CONFIG.responses.inputBufferFrames;
      f.atkKind = want;
    }
  }
  if (f.atkBuffer > 0 && !isLocked(f) && f.recover <= 0){
    f.atkBuffer = 0;
    tryResponse(f, f.atkKind);
  }
}
/* The activation has to be legible to the other player, who needs to know the
   next few seconds are worse for them. Reuses the burst layer rather than
   inventing a new one, so it obeys the same placement and reduced-motion
   rules everything else does. */
function announceReason(f){
  const ground = STAGE.h - CONFIG.stage.groundY;
  spawnPop("affirm", f.x, headY(f) - CONFIG.popPlacement.headGap, 700,
           { text:"REASON", img:null });
}

function stepPhysics(){
  const [a,b] = F;
  // face each other
  a.facing = b.x >= a.x ? 1 : -1;
  b.facing = a.x >  b.x ? 1 : -1;

  for (const f of F){
    /* FROZEN AT THE MOMENT OF IMPACT. The whole per-participant update is skipped
       -- position, gravity, friction, state timers, recovery, guard regen --
       so the pair genuinely holds still.
    
       Deliberately NOT a pause of the frame loop or of the clock. The soak
       drives frames by hand on a virtual clock and every ladder number ever
       measured came off it; a freeze that stopped the clock would change all
       of them and fail no test. Freezing the two participants and letting the
       world carry on is also what the genre literature recommends
       over the naive whole-game freeze. */
    if (f.freeze > 0){ f.freeze--; continue; }
    // Ticks THROUGH caveatLock, which is the point: the participant is locked while
    // it runs, so what survives to the far side is the turn they are owed.
    if (f.counterFrames > 0) f.counterFrames--;
    if (f.atkBuffer > 0) f.atkBuffer--;
    if (f.landFrames > 0) f.landFrames--;
    if (f.concedeFrames > 0) f.concedeFrames--;

    /* HOW MUCH PRESSURE IS ON THIS PARTICIPANT RIGHT NOW. A rolling average of
       the share of recent frames spent in concedeLock, over about two
       seconds.

       This asks about the PARTICIPANT rather than the opponent. It is the
       second design, after the first one failed. The first tried to classify
       the player by consecutive deliveries inside a 520ms gap. It could not.
       The shift drives the two apart after every response. A masher's
       deliveries therefore arrive in bursts, separated by the walk back in.
       Measured, the counter sat at 1 for 77% of frames against an opponent
       that did nothing but respond.
       Distance and cadence are both downstream of the game's own physics.
       ConcedeLock is not. It is the depletion actually being taken, and it
       separates the two cases by better than two to one. That is 47% of the
       round against a masher, and 21% against a player who spaces and
       whiffs.

       Cheap and allocation-free, and it needs no history buffer. */
    f.concedeRate = (f.concedeRate ?? 0)
               + ((f.state === "conceded" ? 1 : 0) - (f.concedeRate ?? 0)) * CONFIG.ai.concedeRateAlpha;
    // The Director's own, slower average. Same trick, five seconds instead of
    // two, kept separate so pacing cannot quietly change how the bot defends.
    f.paceRate = (f.paceRate ?? 0)
               + ((f.state === "conceded" ? 1 : 0) - (f.paceRate ?? 0)) * CONFIG.ai.paceAlpha;
    f.x += f.vx;
    f.y += f.vy;
    f.vy -= CONFIG.physics.gravity;
    if (f.y <= 0){
      /* THE SETTLE IS ARMED HERE, at the one frame the feet arrive. It is
         scaled by how fast they arrive. A short hop and a full ESCALATE must
         not land the same, or the effect is decoration rather than weight. It
         is read before vy is zeroed, which is the reason this sits inside the
         branch rather than after it. */
      if (f.y < 0 || f.vy < 0){
        const speed = Math.min(1, Math.abs(f.vy) / (f.def.escalateV || 1));
        if (speed > 0.15){
          f.landFrames = CONFIG.physics.landSettleFrames;
          f.landPower  = speed;
        }
      }
      f.y = 0; f.vy = 0;
    }

    // Bleed off horizontal speed. A LOCKED participant is guarding, conceded
    // or concluded. Without this it keeps whatever vx it had forever, because
    // readControls and updateAI both bail out early and never zero it. That
    // slides a concluded participant clear across the stage.
    if (f.y === 0){
      /* CONSTANT DECELERATION, not a friction multiply. Measured, the old
         curve stopped AFFIRM in 19 frames and CLARIFY in 21. That is 56% more
         weight for 10% more travel, because exponential decay puts
         time-to-stop against the LOG of the initial speed. Every response in
         the game therefore ended after about the same fifth of a second
         whatever its weight. A heavy response bought a faster first frame
         rather than a longer one. It also never actually reached zero, which
         is why a 0.15 cutoff was bolted underneath it.

         Both shipped games with published figures decelerate at a constant.
         That title reduces launch speed by 0.051 a frame, per its community wiki.
         Rivals of Aether 2 uses 0.54 cm/f² (Dragdown). Under that curve
         time-to-stop is v0/a, which is linear in the response's weight.
         CLARIFY now travels 56% longer than AFFIRM rather than 10%, and it
         arrives at rest on a definite frame rather than asymptotically.

         The SHAPE is what transfers, because their constants are in their own
         units. 1.22 was solved to hold this game's total shift distance across
         the two moves at the 113.8px it already had. Spacing is what the
         entire balance pass is measured against. */
      const a = CONFIG.physics.groundDecel;
      f.vx = f.vx > 0 ? Math.max(0, f.vx - a) : Math.min(0, f.vx + a);
    }
    // clamp inside the stage
    const [wallLo, wallHi] = wallSpan(f);
    f.x = Math.max(wallLo, Math.min(wallHi, f.x));
    if (f.stateTimer > 0){
      f.stateTimer--;
      if (f.stateTimer === 0 && f.state!=="concluded") setState(f,"idle");
    }
    if (f.recover > 0) f.recover--;
    if (f.caveatCommit > 0) f.caveatCommit--;
    /* KEPT FULL WHILE GUARDING, so it starts counting the moment the guard
       DROPS. An arm on entry instead was useless, and measurably so. The hold
       is shorter than the commit, so it had already expired eight frames
       before the seam it existed to cover. The trace said exactly that: caveat
       x19, idle x1, caveat x19. That is one frame of idle for each commit
       cycle, unchanged by a hold that was no longer running. */
    if (f.state === "caveat") f.caveatPoseHold = CONFIG.caveat.poseHoldFrames;
    else if (f.caveatPoseHold > 0) f.caveatPoseHold--;
    // The gauge comes back only while the participant is NOT guarding. A step
    // back to reset is therefore a real decision, and a held key is not a way
    // to wait.
    if (f.guardHold > 0) f.guardHold--;
    else if (f.state !== "caveat")
      f.guard = Math.min(CONFIG.caveat.guardMax, f.guard + CONFIG.caveat.guardRegen);
  }
  separate(a, b);
}

/* ---- pushbox ---------------------------------------------------------
   Participants cannot overlap, and a walk into one PUSHES them. That is the
   genre convention, and it is the basis of corner pressure in every 2D game of
   this kind.

   A 50/50 split of the overlap is the obvious implementation and the wrong
   one. It moves a standing participant backwards as hard as it stops the one
   who walked into them. An advance therefore costs the advancing side ground
   they never gave up. The displacement is instead apportioned by how fast each
   participant is moving INTO the other. The three cases then fall out on their
   own. A walk into someone standing makes them give way completely. A walk into
   each other lets neither pass. With nobody moving it splits, which happens
   only when an external force such as the shift caused the overlap.

   The corner is the point of all this. A participant with their back to the
   wall cannot be pushed further. The remainder rebounds onto the deliverer and
   the pair stops moving. Being cornered means having nowhere to give. */
function separate(a, b){
  const gap = Math.abs(a.x - b.x), need = CONFIG.physics.minGap;
  if (gap >= need) return;
  const over = need - gap;
  const dir  = a.x < b.x ? 1 : -1;        // +1 when b stands to the right of a
  const aIn  = Math.max(0,  a.vx * dir);  // a's speed toward b
  const bIn  = Math.max(0, -b.vx * dir);  // b's speed toward a
  const tot  = aIn + bIn;
  // Each participant YIELDS in proportion to how hard the OTHER is pressing.
  const aShare = tot < 0.01 ? 0.5 : bIn / tot;
  const roomA = wallLimit(a, -dir), roomB = wallLimit(b, dir);
  // First pass by share, then hand whatever a wall refused to the other.
  let moveA = Math.min(over * aShare, roomA);
  let moveB = Math.min(over - moveA,  roomB);
  moveA     = Math.min(over - moveB,  roomA);
  a.x -= moveA * dir;
  b.x += moveB * dir;
}
/* The span of x this participant may occupy. It is the participant's own
   half-width plus a small inset, so a bot stops a little short of the wall
   rather than flush against it.

   ONE definition on purpose. stepPhysics clamps x to this span. The AI asks
   wallLimit how much room is left before retreating. Those two had the inset
   written out separately. Nothing was wrong with either. They had to agree,
   and nothing made them. On a drift, the AI would have believed it had room
   the clamp refused to give. A cornered bot would then have walked on the
   spot. */
function wallSpan(f){
  const half = f.def.bodyW/2 + CONFIG.physics.wallInset;
  return [half, STAGE.w - half];
}
/* How far this participant can still travel in `sign` before reaching the wall. */
function wallLimit(f, sign){
  const [lo, hi] = wallSpan(f);
  return sign > 0 ? Math.max(0, hi - f.x) : Math.max(0, f.x - lo);
}

/* ==================================================================
 * 7. EXCHANGE
 * ================================================================== */
/* The body box has three shapes, and they are the whole basis of the high and
   low game. Standing is the full body. Airborne is tucked UP off the feet, so
   it clears a LOW response. Deferred is cut down from the TOP with the feet
   planted, so it clears a HIGH one.

   The boxes, in stage y (0 = the floor, up is positive):

     CLARIFY   100..220     the low response
     AFFIRM    220..330     the high response
     deferred    0..215     entirely under AFFIRM
     RUST air  232..432     at a 172px apex, over CLARIFY and still in AFFIRM
     VOLT air  248..463     at a 190px apex, the same story

   An escalate therefore answers the clarify and a defer answers the affirm.
   Neither answers both, which is what stops either from being the answer to
   everything. An escalate that goes over a clarify and is caught by an affirm
   is the correct answer in any versus game. It is also the reason an
   anti-air exists.

   Those spans are DERIVED, from boxY plus or minus boxH/2, and from spriteH
   times airBoxScale lifted by airBoxLift. They therefore go stale when the
   numbers move. The affirm did exactly that, and sat in this comment as
   165..275 for some time after boxY became 275. The tests read the spans off
   responseBox and bodyBox rather than restating them. A wrong comment here is
   therefore a documentation defect and not a silent hole in the suite. */
function bodyBox(f){
  const P = CONFIG.physics;
  const air = f.y > 0;
  if (!air && f.state === "defer")
    return { x:f.x - f.def.bodyW/2, y:0, w:f.def.bodyW, h:P.crouchBoxH };
  return { x:f.x - f.def.bodyW/2,
           y:f.y + (air ? f.def.spriteH*P.airBoxLift : 0),
           w:f.def.bodyW,
           h:f.def.spriteH * (air ? P.airBoxScale : 0.8) };
}
/* The rect a burst must stay off, in SCREEN space. It is extracted from the
   contact site, so the suite can ask the game what it avoids rather than
   rebuild the geometry alongside it. A second model of a rect is how the
   previous placement defect survived a test written to catch it. */
/* THE HEIGHT OF THE ART THAT IS ON SCREEN, which is not f.def.spriteH.
   spriteH is the IDLE height. Every other pose renders at its own, which is
   naturalHeight * poseScale * spriteH / srcHeight. Measured off the source art,
   the gap between the two is not a rounding error:

     RUST defer   uses caveat art at poseScale 0.667  -> ~267px against 400
     VOLT escalate   620 source against idle's 735      -> ~363px against 430
     RUST concluded                                  -> ~294px against 400

   Placement of a burst 20px above `ground - spriteH` therefore left it 153px
   above the real head of a participant in a low stance. That is the report of
   a burst that floats well above the characters. Standing concessions measured
   24px and were correct, which is why the model kept agreeing with itself. */
function poseHeight(f){
  /* THE POSE IT IS IN NOW, not the one it was drawn in. f.poseNode is written
     by render(), which runs after the simulation. Anything placed during
     exchange resolution would therefore read a frame behind. A frame behind
     can be a low stance against a stand, at 245px against 429. */
  const node = f.poseNodes && f.poseNodes[resolvePose(f, poseFor(f))];
  const h = node ? parseFloat(node.style.height) : NaN;
  return h > 0 ? h : f.def.spriteH;
}
/* The drawn top of the sprite. It comes from render() when render has run,
   and from the pose height otherwise. Placement can be asked for a position
   before the first frame is drawn, and the geometry is a closer fallback than
   the idle height. */
function headY(f){
  /* COMPUTED, NOT REMEMBERED. f.headY is recorded by render(), so it is one
     frame old at the moment a concession resolves. That staleness is the exact
     defect this pair of functions exists to avoid. render() still records it
     for anything that wants the drawn value, and placement asks for the live
     one. The bob and squash are sub-pixel next to a pose change, so their
     absence from the live path costs far less than a frame of lag. */
  return (STAGE.h - CONFIG.stage.groundY) - f.y - poseHeight(f);
}
function popBody(f){
  const g = STAGE.h - CONFIG.stage.groundY, bb = bodyBox(f);
  /* THE SILHOUETTE, NOT THE HURTBOX. bodyBox stands at `spriteH * 0.8`. The
     top 80px of RUST and 86px of VOLT, which is the head, therefore sat
     OUTSIDE the rect that every burst was placed to avoid. A burst could land
     on a face and still satisfy the rule that no burst covers a participant.
     The rect used by the check did not contain the face. 320 of 1296 grid
     placements did exactly that. Play found it before the suite did.

     The body box stays at 0.8. That value is a feel decision about where a
     response connects, and it is not the business of this function. Art hangs
     off what the eye sees. A low stance keeps its own box, because that pose
     really is short. A lift to full height would reserve empty air above the
     participant and push bursts away for no reason. */
  return { l: bb.x, r: bb.x + bb.w, t: headY(f),
           b: Number.isFinite(f.footY) ? f.footY : g - f.y };
}
function responseBox(f){
  const A = CONFIG.responses[f.state];
  if (!A) return null;
  const frame = A.lock - f.stateTimer;          // frames elapsed in the response
  if (frame < A.active[0] || frame > A.active[1]) return null;
  // flip the offset by facing
  const fx = f.x + f.facing * (A.reach - A.boxW/2);
  // An air response aims DOWNWARD, and only CONNECTS through a window.
  //
  // The box is normally placed relative to the deliverer's own feet. Responses
  // allowed in the air therefore put it above a standing opponent's head, and
  // every escalate-in whiffed. airAim drops it back onto the target.
  //
  // A fixed offset then tracks the participant perfectly, so the response
  // landed at EVERY height, including zero. That is not an air response. It is
  // a ground response with extra steps. It has to be earned. The box is live
  // only on the way DOWN and only through a height band. A delivery delivered too
  // early, at the apex, or on the rise passes through empty air. The timing of
  // the descent is the skill.
  let aim = 0;
  if (f.y > 0){
    const B = CONFIG.responses.airConcedeBand;
    if (f.vy > 0 || f.y < B[0] || f.y > B[1]) return null;
    aim = CONFIG.responses.airAim;
  }
  return { x:fx - A.boxW/2, y:f.y + A.boxY + aim - A.boxH/2, w:A.boxW, h:A.boxH };
}
const overlap = (r1,r2) =>
  r1.x < r2.x+r2.w && r1.x+r1.w > r2.x && r1.y < r2.y+r2.h && r1.y+r1.h > r2.y;

/* Both responses are judged against the SAME snapshot, and only then applied.

   Applied as it went, this gave slot 0 a real and systematic advantage. The
   concession from F[0] calls setState on the counterpart before F[1] has been
   looked at. responseBox() returns null for any state that is not a response,
   so F[1]'s simultaneous delivery silently evaporated. Every trade went to the
   participant on the left, every time, and nothing said so.

   Measured in AI against AI, over 200 matches for each level, the left slot won
   61% at ULTRATHINK. A swap of which participant starts there moved the
   advantage with the SLOT rather than with the bot, and VOLT on the left won
   72%. In a game whose whole conceit is a fair benchmark of one model against
   another, the seat was worth more than the participant.

   A decision taken first makes a trade what it is in every game of this kind.
   Both responses land. */
function resolveExchange(){
  const landed = [];
  for (let i=0;i<2;i++){
    const atk = F[i], counterpart = F[1-i];
    if (atk.responseSpent || counterpart.state==="concluded") continue;
    const ab = responseBox(atk);
    if (!ab) continue;
    if (!overlap(ab, bodyBox(counterpart))) continue;
    // The KIND is captured here rather than read back later. The first
    // response applied puts its target into the conceded state, and
    // CONFIG.responses has no entry under that name. A read of atk.state in
    // the apply pass therefore delivers on the second half of every trade. That
    // is the same coupling the snapshot exists to remove.
    landed.push({ i, kind: atk.state });
  }

  for (const { i, kind } of landed){
    const atk = F[i], counterpart = F[1-i];
    atk.responseSpent = true;
    const guarding = counterpart.state === "caveat";
    const A = CONFIG.responses[kind];
    /* A chain is defined by the RECEIVER and not by a timer. This is the next
       concession in a chain exactly when the receiver never recovered from the
       last one. There is no window to tune, and it cannot be gamed by waiting.

       The intent was correct and the STATE TEST could not express it. A frame
       runs decide -> stepPhysics -> resolveExchange. A receiver whose
       concedeLock expires in stepPhysics is set to idle and concedes again in
       resolveExchange, WITHOUT EVER BEING OFFERED A TURN. Read off the state,
       that looked like a fresh first concession. chainCount reset to 1 on every
       response, the deliverer collected the chain-cancel discount forever, and
       comboMax never engaged at all. That is why a correct cap on it changed
       nothing.

       Traced in a real match. The concession-to-concession interval was 27
       frames against 27 frames of concedeLock. The counter stayed pinned at 1,
       and the CPU was held for 4.6 seconds while its lock timer was refreshed
       from 1 back to 27 repeatedly.

       The test therefore asks the question the comment always meant. It asks
       whether this participant has had a DECISION POINT since the last
       concession. That is the only definition immune to a recovery that exists
       between two function calls. It is measured where a player experiences
       it. */
    const chained = !guarding && !counterpart.actedSinceConceded;
    atk.chainCount = chained ? (atk.chainCount || 1) + 1 : 1;
    // TWO is where a chain becomes worth announcing. One response is only a
    // response. A counter that fires on every one is noise, and it trains the
    // eye to ignore the thing it exists to celebrate.
    if (atk.chainCount >= 2) atk.comboUntil = Clock.now + CONFIG.responses.comboHoldMs;
    // Both sides bank effort from the same exchange, and the receiver banks
    // more than the deliverer. A guarded response still pays, because guarding
    // is participating. A meter that rewarded offence alone would tell a
    // player under pressure that their defence is worth nothing.
    const RE = CONFIG.reason;
    atk.reason = Math.min(RE.max, atk.reason + RE.onConcede);
    counterpart.reason = Math.min(RE.max, counterpart.reason + RE.onTaken);
    // Depletion proration: later concessions are worth less, so a conversion is a bonus
    // and not a doubling.
    const scale = Math.pow(CONFIG.responses.comboScale, atk.chainCount - 1);
    // The install multiplies the base response, INSIDE proration rather than
    // outside it. A boosted chain still pays 70% down the links. REASON
    // therefore makes each concession worth more, without removing the cap
    // that stops a conversion becoming a round.
    const boost = reasonActive(atk) ? CONFIG.reason.depletionMul : 1;
    const dmg = Math.round(A.depletion * scale * boost
                           * (guarding ? CONFIG.caveat.depletionMul : 1));
    counterpart.health = Math.max(0, counterpart.health - dmg);
    litUp(counterpart, guarding);

    // shift + reaction
    const kb = shiftVel(A.shiftPx * (guarding ? CONFIG.caveat.shiftMul : 1));
    counterpart.vx = atk.facing * kb;
    /* PUSHBACK ON CAVEAT, applied to the DELIVERER. Every 2D participant uses
       it to end a string. It was the only one of the three this game had none
       of. The other two are a real gap and an invincible reversal.

       A guard here moved the DEFENDER, and by less than a clean concession
       does. Guarding therefore gave ground and changed nothing about whether
       the next response could reach. A push of the deliverer out is what turns
       a guard from an absorbed response into the end of a turn. Two responses
       landed on a guard leave the deliverer too far away for the third, which
       is how a guarded string is supposed to run out.

       Symmetric, and that matters as much as the anti-mash effect. It is what
       finally makes CAVEAT worth pressing for the player, against a CPU that
       presses its own advantage hard.

       Dustloop (GGST system mechanics) and a series wiki on Pushback
       both describe the same thing. Pushback can eventually move a defender
       out of range and end the string, and Faultless Defense exists
       specifically to buy more of it. */
    if (guarding) atk.vx = -atk.facing * shiftVel(A.shiftPx * CONFIG.caveat.pushback);
    if (!guarding){
      setState(counterpart,"conceded");
      counterpart.stateTimer = Math.round(A.concedeLock ?? CONFIG.concedeLock);
      counterpart.actedSinceConceded = false;      // the chain continues until they get a turn
      /* The setback is stored on the DEFENDER, in world terms, at the moment
         of contact. It uses `atk.facing` and not `counterpart.facing`. A
         setback is relative to where the response came from, which is the only
         way it stays correct when a participant is caught from behind. The
         delivery lean is the opposite, because it is relative to the
         participant's own forward. Two different frames of reference are what
         lets the two coexist. */
      counterpart.concedeFrames = counterpart.stateTimer;
      counterpart.concedeSpan   = counterpart.stateTimer;
      counterpart.concedePower  = A.depletion / CONFIG.responses.affirm.depletion;
      counterpart.concedeDir    = atk.facing;
    } else {
      counterpart.stateTimer = Math.max(counterpart.stateTimer,
        Math.round(A.caveatLock ?? CONFIG.concedeLock*CONFIG.caveat.concedeLockMul));
      atk.chainCount = 1;                 // a guard ends the chain
      // A guard leaves the DEFENDER +3, which is a real turn and the game's
      // own answer to pressure. It is counted in FRAMES rather than stamped
      // with a clock. resolveExchange has no timestamp, and the soak runs on a
      // virtual clock that any use of a real one would silently escape.
      // CAVEATLOCK PLUS the window, because this ticks down THROUGH
      // caveatLock. Set to the window alone, at 10, it expired inside the
      // 21-27 locked frames every time and the counter never once fired. The
      // comment on the config dial claimed the remainder was the window, and
      // the remainder was always zero.
      counterpart.counterFrames = Math.round(A.caveatLock ?? CONFIG.concedeLock)
                        + CONFIG.ai.counterFrames;
      /* A GUARDED RESPONSE HAS TO BE ANSWERABLE. It left the deliverer at -3.
         That is inside everyone's startup, and it is therefore not an answer
         window at all. A delivery into a guard cost nothing. At point-blank
         range, where almost nothing whiffs, a response carried no risk of any
         kind. That is the whole reason mashing dominates. The CPU does not
         defend badly. There was no penalty on the other side of a successful
         defence.

         The convention this game already follows for the rest of its frame
         data is in the note on concedeLock above. It puts a light normal at -2
         to -5 on caveat, and a heavy at -6 to -12. A guarded string stays safe
         only by ending in a move that is not negative enough to be answered.
         That
         presumes the ordinary case is. Seven frames puts AFFIRM and CLARIFY
         both at about -10. It is inside the band, and outside the 4-frame
         startup that made -3 meaningless.

         Symmetric, and deliberately so -- this is what makes CAVEAT worth
         pressing for the player against a CPU that presses its advantage. */
      atk.recover += CONFIG.caveat.penaltyFrames;
      // The gauge pays for what the guard just absorbed. Empty it and the
      // guard breaks: a long, unambiguous punish window, and the gauge comes
      // back full so a break costs the round rather than the match.
      counterpart.guard -= A.depletion;
      counterpart.guardHold = CONFIG.caveat.guardRegenDelay;
      if (counterpart.guard <= 0){
        counterpart.guard = CONFIG.caveat.guardMax;
        setState(counterpart, "conceded");
        counterpart.stateTimer = CONFIG.caveat.breakLock;
        counterpart.vx = atk.facing * shiftVel(A.shiftPx);   // full shift, not the guarded 35%
      }
    }

    // Cancel the recovery ON CONCEDED, and only while a chain is still open, so a
    // conversion is a link and never a loop.
    if (!guarding){
      if (atk.chainCount < CONFIG.responses.comboMax){
        setRecover(atk, A.lock + CONFIG.responses.comboCancel);
      } else {
        /* THE CAP HAS TO COST SOMETHING, and until now it did not: comboMax
           limited the depletion scaling and nothing else, so chains ran forever.

           `recover` is written when a delivery STARTS and ticks down every
           frame. A response connects on its active frames, which is four in for
           AFFIRM. At the cap, where recovery was left alone, the deliverer had
           24 frames left against 27 of fresh concedeLock. It was therefore free
           THREE FRAMES BEFORE the receiver, every time. The soak found it as a
           participant locked in the conceded state for 240 or more frames of
           live play. That is a genuine lock loop in the shipped game. The
           frame-data comment above believed it impossible, because it reasoned
           about the value at delivery time rather than at contact.

           A restatement here pays the recovery from the moment of the
           concession, at 28 against 27. The receiver then gets out by a frame,
           and the cap does what it says.

           Deliberately NOT through setRecover(): the cap is a hard rule and
           REASON must not be able to buy through it. At the install's 0.7 the
           full 28 becomes 20, which is back under concedeLock and re-opens the
           lock for anyone holding a meter. */
        atk.recover = A.lock + recoveryOf(kind);
      }
    }

    /* Both participants freeze for the same count, so the frame advantage the
       whole exchange system is built on is preserved exactly. A guarded response
       freezes for less: a guard should feel like absorbing something rather
       than like landing it. */
    const stopFrames = Math.round(
      (kind === "clarify" ? CONFIG.responses.freezeClarify : CONFIG.responses.freezeAffirm)
      * (guarding ? CONFIG.responses.freezeCaveatMul : 1));
    atk.freeze = Math.max(atk.freeze, stopFrames);
    counterpart.freeze = Math.max(counterpart.freeze, stopFrames);

    if (learn && !guarding){
      if (counterpart.isCPU) learn.playerDmg += dmg; else learn.cpuDmg += dmg;
    }
    
    joltBar(1-i, guarding);
    raiseParticipant(atk);
    const tier = guarding ? "caveat" : kind;
    /* PHRASE FIRST, so its width can steer the placement. Drawn inside
       spawnPop, every clamp upstream had to assume the widest burst in the
       set. nextPhrase advances the cursor, so it must be called ONCE and handed
       on. A call here and again in spawnPop would skip a phrase on every
       concession and quietly halve the rotation. */
    const ph = nextPhrase(tier);
    const pw = burstWidth.get(ph.img) || CONFIG.popPlacement.burstH * 1.6;
    const [px, py] = popPoint(tier, atk, counterpart, pw);
    // Both bodies, so a crowded burst knows what it is trying to stay beside.
    spawnPop(tier, px, py, undefined, ph, [popBody(counterpart), popBody(atk)]);
    Sound.sfx(kind === "clarify" ? "concedeClarify" : "concedeAffirm",
              guarding ? CONFIG.audio.caveatVolume : CONFIG.audio.sfxVolume);
    shake();

  }

  // A trade can now finish BOTH participants, which sequential resolution made
  // impossible -- the second response never existed. Settle it once, after both
  // have landed, and give a genuine double resolve the same coin toss an
  // exactly level clock already gets. Resolving it in slot order instead
  // would hand the win back to the left seat in precisely the case this
  // whole change is about.
  const down = F.filter(f => f.health === 0 && f.state !== "concluded");
  if (down.length === 1) resolve(down[0]);
  else if (down.length === 2) resolve(F[Math.random() < 0.5 ? 0 : 1]);
}
/* The one motion CSS cannot reach: the shake is applied to the stage
   transform in render(), so `prefers-reduced-motion` has to be asked in JS.

   A move of the ENTIRE PLAYFIELD by 13px is the strongest vestibular trigger
   in the game. It is bigger than any burst, because everything the eye tracks
   moves at once, including the participant the player controls. Nothing is
   lost by dropping it. The concession already announces itself with a burst, a
   bar that drains and a sound.

   Live rather than read once at boot. A person may turn this setting on
   precisely BECAUSE something on screen is making them unwell. That is the
   worst possible moment to require a reload. */
const reduceMotionQuery = window.matchMedia
  ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
// A plain mutable object that mirrors the query, rather than the
// MediaQueryList itself. There are two reasons and neither is incidental.
// `matches` on a real MediaQueryList is a readonly getter, so nothing can
// exercise this path in a test without a whole browser configured for it. An
// accessibility feature that cannot be tested quietly stops working. The
// mirror also keeps the read in shake() a plain property lookup on the hot
// path.
const reduceMotion = { matches: reduceMotionQuery ? reduceMotionQuery.matches : false };
if (reduceMotionQuery)
  reduceMotionQuery.addEventListener("change",
    e => { reduceMotion.matches = e.matches; });
function shake(){ shakeUntil = performance.now() + CONFIG.screenShake.ms; }
/* RESTARTED, NOT RE-REQUESTED. Adding a class that is already present does
   nothing -- the animation carries on from wherever it was -- so a chain would
   light the figure once and then run in silence. Removing it, forcing the
   layout to be read back, and adding it again is what makes the browser treat
   it as a new animation. The offsetWidth read is not decorative; without it
   the two class changes coalesce and nothing restarts. */
function litUp(f, guarding){
  const n = f && f.node;
  if (!n || reduceMotion.matches) return;
  const cls = guarding ? "lit-guard" : "lit";
  n.classList.remove("lit", "lit-guard");
  void n.offsetWidth;
  n.classList.add(cls);
}
/* REASON: whether this participant is currently thinking harder. One
   predicate, used by the depletion boost, the recovery cut, the HUD and the
   AI. It is written once so those four can never disagree about whether the
   install is running. Disagreement is exactly how a boosted state ends up
   visible on the bar and absent from the depletion. */
function reasonActive(f){ return Clock.now < (f.reasonUntil || 0); }
/* Spend it. Returns whether anything happened, so the caller can announce it
   and so a press on an empty meter stays silent rather than lying.

   Refuses to re-arm while already lit: without that, holding the key through
   an activation refills nothing but keeps resetting the clock, and the
   install becomes permanent for anyone leaning on the button. */
function spendReason(f){
  if (f.reason < CONFIG.reason.max || reasonActive(f)) return false;
  f.reason = 0;
  f.reasonUntil = Clock.now + CONFIG.reason.durationMs;
  return true;
}

/* ---- SFX pops: cycle each tier, never repeat randomly ---- */
const tierCursor = {};
function nextPhrase(tier){
  const list = CONFIG.phrases[tier].items;
  const i = (tierCursor[tier] = (tierCursor[tier] ?? -1) + 1) % list.length;
  const item = list[i];
  // A phrase may carry several inkings of one drawing. They advance on the
  // PHRASE's own cursor rather than the tier's. The colour therefore changes
  // between appearances, and the phrase takes no extra turns from its tier.
  if (!item.imgs) return item;
  const j = (item.inking = (item.inking ?? -1) + 1) % item.imgs.length;
  return { ...item, img: item.imgs[j] };
}
/* Contact point for a comic burst, in stage coordinates. It is biased onto the
   DEFENDER's side and pushed clear of both bodies. It is then clamped, so a
   burst near a wall still lands on screen rather than half off the edge. */
/* `w` is the burst's REAL width, and every clamp below uses half of it. Passed
   in, it stops a narrow burst being placed as though it were the widest in the
   set. The two clamps below record what that cost. It is optional. Without it
   the widest is assumed, which is the old behaviour and still the right
   fallback for a caller that genuinely cannot know. */
/* A short, stable fingerprint of everything that decides how an exchange goes.
   djb2 over the config's own JSON: no dependency, no version string to forget,
   and it moves on any edit to a rung, a frame count, the physics or where a
   burst lands. Ordering is stable because these are object literals in source
   order, so the same build always hashes the same. */
function tuneHash(){
  /* AI_BASE AND ALL THREE RUNGS, never the derived CONFIG.ai.

     This hashed the ACTIVE config, which applyDifficulty rewrites for each
     rung. The fingerprint therefore identified the DIFFICULTY as much as the
     build. One build produced three hashes, and bin/runs.py reported it as
     three separate games. The hashes `rprrzm`, `6593us` and `266990` are
     ULTRATHINK, THINK HARD and THINK on the same code. A verdict about a build
     was being pinned to something that was partly the rung.

     The base plus the rung DEFINITIONS is the build and nothing else. The rung
     a match was played on is already recorded beside it as `level`, so nothing
     is lost by its removal here. The two also stop being confounded. */
  const src = JSON.stringify([AI_BASE, CONFIG.difficulty.levels, CONFIG.responses,
                              CONFIG.physics, CONFIG.caveat, CONFIG.reason,
                              CONFIG.round, CONFIG.popPlacement]);
  let h = 5381;
  for (let i = 0; i < src.length; i++) h = ((h * 33) ^ src.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

/* Set by popPoint when a high tier had no room above its participant and flipped
   to sit underneath them instead. Read by spawnPop, which has to anchor the
   element by the edge facing the participant and cannot work that out from the
   tier alone. One writer, one reader, cleared on every call. */
let popWentUnder = false;
function popPoint(tier, atk, counterpart, w){
  const P = CONFIG.popPlacement;
  const c = P[tier] || P.affirm;
  const dir = Math.sign(counterpart.x - atk.x) || atk.facing;
  /* OVER THE ONE THAT CONCEDES. This corrects a defect that a recording made
     visible: the burst was placed over the OPPOSITE participant from the one it
     belongs to.

     A BURST IS THE SOUND EFFECT OF A CONCESSION. The participant that delivers
     the response does not get the sound effect. The participant that CONCEDES
     gets it. The burst is therefore placed against the RECEIVER's head at all
     times, which is `counterpart` here, for every announcing tier.

     An earlier version read the phrases as dialogue and moved the burst onto
     the deliverer. That was wrong and it was reverted. AFFIRM and CLARIFY do
     read like the deliverer talking (CERTAINLY, LOAD-BEARING, ABSOLUTELY
     RIGHT), and that is the joke rather than the placement rule. See
     BURST-PLACEMENT.md, which outranks this comment if the two ever drift.

     lean and out are gone from the announcing tiers with it. They interpolate
     along the deliverer-to-defender line and push outward. That suits a burst
     at body height which must avoid the bodies, and not one that hugs a head.
     Measured, they put it 12 to 92px off centre, which is half a body width at
     worst. The resolve keeps them, because the old geometry still fits under a
     concluded bot. */
  const subject = counterpart;                 // whoever conceded
  // Tiers that sit BELOW their participant rather than above: the resolve
  // labels the bot that went down, and AFFIRM reads low across the legs.
  const below = tier === "resolved" || tier === "affirm";
  let x = tier === "resolved" ? atk.x + (counterpart.x - atk.x) * c.lean + dir * c.out
                        : subject.x;
  const ground = STAGE.h - CONFIG.stage.groundY;
  /* HUG THE HEAD. Every tier except the resolve sits directly over the
     defender. The BOTTOM EDGE of the burst is headGap above the top of their
     head. The burst therefore stays attached to the participant it is about,
     at any height.

     This replaced a per-tier height table. That table put each burst opposite
     the limb that delivered the response: AFFIRM low across the legs, and the
     others anchored to the HUD. The reasoning was sound, and it lost to a
     simpler rule that play showed to be correct. The bursts were not near the
     head, and no amount of per-tier care corrects a burst at chest height. The
     resolve keeps its own placement, under the concluded bot. */
  /* y IS THE BOTTOM EDGE OF THE BURST, in stage pixels, which matches the CSS
     anchor. The rule is direct: the bottom of the burst, plus headGap, is the
     top of the character. There are no half-heights anywhere. */
  /* THE EDGE FACING THE CHARACTER IS THE ONE THAT IS PINNED. Which edge that
     is depends on the side of the character the burst sits on.

     ABOVE (every announcing tier): y is the burst's BOTTOM edge. The rule is
     direct: the bottom of the burst, plus headGap, is the top of the
     character. There are no half-heights. A centre anchor can satisfy the rule
     only by arithmetic. Every error in the assumed height then lands on the
     one edge the rule is about.

     BELOW (the resolve, which labels the concluded bot from underneath): y is
     the TOP edge, by the same argument mirrored. */
  /* y IS THE EDGE FACING THE PARTICIPANT: the BOTTOM edge for a burst above
     them, and the TOP edge for one below. See BURST-PLACEMENT.md. */
  const headTop = headY(subject);

  /* LIVE, like headTop. A footY taken from the value render() recorded, while
     headTop is computed fresh, builds drawnH out of two different moments. When
     the two disagree, the face clearance is derived from a height the
     participant does not have. 18 of 594 grid placements landed on the head
     that way. Every one had both participants airborne, which is exactly when a
     recorded foot line is most out of date. The bob is sub-pixel next to
     that. */
  const footY = ground - subject.y;
  const drawnH = footY - headTop;
  /* AFTER the geometry it reads. An earlier version sat above that geometry
     and delivered `Cannot access 'footY' before initialization` on every exchange
     test, and then the same for headTop. That is a use-before-declaration error,
     which is at least loud. The version of this fault that used a STALE footY
     instead of an undeclared one produced the placement failures that nobody
     could see. */
  popWentUnder = !below && tier !== "resolved"
              && headTop - P.headGap - P.burstH < P.hudH
              && footY + P.headGap <= ground - 30
              && footY + P.headGap + P.burstH <= STAGE.h - 10;
  /* AFFIRM SITS JUST UNDER THE RESPONSE, on the participant who takes it. The
     response stays visible.

     THE ANCHOR IS THE RESPONSE BOX OF THE PARTICIPANT WHO DELIVERS IT. boxY is
     the centre of the box above their feet. boxH is its height. The underside
     of the response is boxY - boxH/2 above their feet. The top edge of the
     burst goes headGap below that point.

     An earlier version measured from the feet of the participant who takes the
     response. That is correct while both participants stand on the ground. It
     is wrong when one is in the air: a response delivered to a participant at
     the top of an escalate moved the burst up with them, away from the hand
     that delivered it.

     A fraction of the sprite height is also wrong. The fraction moves when a
     pose renders at a different size. This is the same defect as spriteH.

     x belongs to the participant who takes the response. The burst is over
     them and below the response, so it reads as a response that lands. */
  const A = CONFIG.responses[tier] || CONFIG.responses.affirm;
  let y = tier === "resolved"
        ? ground - counterpart.y - counterpart.def.spriteH * c.y - P.burstH / 2
        : below
          /* UNDER THE FIST, BUT NEVER UP ONTO THE FACE. An escalate-in puts
             the two rules in conflict. An affirm on a grounded participant from
             the apex has the fist ABOVE their head, so a burst below the
             response lands squarely on their features. Measured, 18 of 270 grid
             placements did exactly that, and every one was atk:apex.
             The burst therefore hangs under the fist or under their head,
             whichever is LOWER on screen. A larger y is further down. On the
             ground the fist is the binding constraint and nothing changes. From
             an escalate-in the head is the binding constraint. The burst then
             sits on the body under it, where the response is still visible. */
          /* CLEAR OF THE FACE, not merely off the top of the body box. The floor
             was previously `footY - drawnH * 0.8`, which is the top of the
             body box and therefore the CHIN. Measured on recorded frame 4, that
             put the burst's top edge at 399 against a head at 316, so its upper
             spikes sat on the face. A fifth of a participant is head, and the
             burst starts below the whole of it. */
          ? Math.max(ground - atk.y - (A.boxY - A.boxH / 2) + P.headGap,
                     headTop + drawnH * P.faceClear)
          /* WITH NO ROOM ABOVE, THE BURST GOES BELOW. A participant near the
             top of an escalate has less than a burst height of air above the
             head. The rule and the frame edge cannot both be satisfied. The
             clamp moved the burst down into the face. Measured on a recording:
             36px and 51px into the participant, both times while airborne and
             delivering a caveat.

             The lower edge is always free in this case. The participant is off
             the ground, so there is clear air below the feet. The rule is the
             same and it is mirrored: headGap of space, pinned to the edge that
             faces the participant. The burst stays attached to the participant
             it belongs to.

             THE HUD IS THE LAST OPTION. A burst may cover the health bars.
             That permission is what lets a burst clear the head of a tall
             participant. It is not a preference. Measured on a recording: two
             bursts pushed 45px and 91px into the bars while the participant
             had clear air below. The burst reads as leaving the picture.

             The order is: above the head if that clears the HUD, then below
             the participant, then into the HUD. */
          : headTop - P.headGap - P.burstH >= P.hudH
            ? headTop - P.headGap
            /* THE FLOOR LINE IS NOT THE BOTTOM OF THE PICTURE. This asked
               for the WHOLE burst to fit above `ground`. It therefore rejected
               the flip for any participant high enough that the burst would
               reach the floor strip. That strip is scenery, with 170px of stage
               below it. On recorded frame 2, with RUST airborne at y160 and its
               head at 156, neither above nor under was allowed. The burst
               clamped to the frame edge and overlapped the participant by 34px.
               That was the only burst in fifteen that was not exactly on the
               rule. What matters is that the burst is anchored above the floor
               line and stays on screen. */
            : (footY + P.headGap <= ground - 30
                 && footY + P.headGap + P.burstH <= STAGE.h - 10
                 ? footY + P.headGap
                 : Math.max(headTop - P.headGap, P.burstH));
  /* HALF THIS BURST, not half the widest one. edgePad is 190, which is half
     of win-escaped-the-sandbox. A clamp of every burst to it kept a 210px
     phrase 85px further from the wall than it needed to be. Against a CORNERED
     participant that is the difference between a burst on the action and a
     burst floating beside it. The participant's own centre sits at about x95,
     inside a pad the burst was forbidden to enter. */
  const pad = w ? w / 2 : P.edgePad;
  x = Math.min(STAGE.w - pad, Math.max(pad, x));
  // On screen, not below the HUD: a burst over the health bars is allowed and
  // is often the only place a tall participant's head leaves for it. The floor is
  // a whole burst height now, because y is the bottom edge.
  y = Math.min(ground - 30, Math.max(P.burstH, y));

  /* THE HORIZONTAL EVASION IS GONE. It used to slide a burst sideways until
     it cleared the defender's body. AFFIRM sat low, and there was nowhere below
     a standing participant to put a 190px burst without covering them.

     Cover is the POINT now. The burst belongs to the participant that
     conceded, and it hangs just under the response. A slide off their body puts
     it beside somebody rather than on the exchange. The same move in nudgeClear
     was measured delivering 26 of 32 real bursts more than 60px off target, and
     one as far as 369px. Nothing slides now. It goes where the rule puts it,
     clamped to the frame, or it is suppressed. */
  return [x, y];
}

/* Bursts currently on screen, with the box each one occupies. */
const livePops = new Set();

/* Place a burst, or drop it.

   THE RULE. A burst goes directly above or below the participant it belongs
   to, at headGap from the edge that faces them. It may step aside by up to
   slideMax to clear the other participant. It may not go anywhere else.

   TWO BURSTS ARE OFTEN ALIVE AT ONCE. A burst lasts 520ms and a response can
   land every 467ms. A chain puts two responses about 330ms apart, so
   overlapping bursts happen by construction. Two that overlap read as one wide
   shape and not as two events. The newer one is dropped. The older one is
   already animating and is where the eye is.

   THIS FUNCTION USED TO SEARCH. It scored candidate positions beside each live
   burst, beside each body and overhead, then took the best. Measured against
   32 bursts from a recorded round: 26 moved more than 60px sideways, one moved
   369px, and none finished at the stated gap from either participant. The
   height was correct when it was calculated. The search then moved the burst
   to a place where that height belonged to nobody.

   A burst that far from a participant has lost the link to the response that
   caused it. That link is the only reason it is on screen. The search existed
   because bursts used to sit at body height and had to avoid the bodies. A
   burst at head height has nothing to avoid.

   So: clamp to the frame, slide by up to slideMax, and drop on a collision.
   `bodies` is used for the slide only. */
function nudgeClear(x, y, w, h, bodies){
  const P = CONFIG.popPlacement, ground = STAGE.h - CONFIG.stage.groundY;
  // y is the edge FACING the participant. It is the bottom edge above them and
  // the top edge below. A burst above therefore needs a whole height of room
  // beneath the frame edge.
  let cx = Math.min(STAGE.w - w / 2, Math.max(w / 2, x));
  /* maxY is the floor LINE for an above-burst, whose y is its bottom edge. It
     has to leave room for a below-burst to hang onto the ground strip. */
  const cy = Math.min(ground - 30, Math.max(h, y));
  /* `bodies` is no longer read. It stays in the signature for two reasons. The
     call sites still know their bodies and a future rule may want them again.
     Its removal would also make every caller understate what it knows. */
  const needX = (o) => (w + (o.w || P.edgePad * 2)) / 2 + P.gap;
  const needY = (o) => (h + o.h) / 2 + P.gap;
  for (const o of livePops)
    if (Math.abs(cx - o.x) < needX(o) && Math.abs(cy - o.y) < needY(o)) return null;

  /* A BOUNDED SLIDE. A burst is allowed to step aside. It is not allowed to do
     what the earlier search did. That search slid until the burst was CLEAR of
     everything. It therefore delivered 26 of 32 real bursts more than 60px off
     target, and one of them moved 369px. A burst that has crossed the screen is
     no longer about anybody.

     The step aside is bounded by `slideMax`. Within that budget the burst
     takes the SMALLEST move that clears the participant it is not about. If no
     move within budget clears them, it takes the move that helps most. That
     is still better than a burst on top of a body. The participant the burst IS
     about is never avoided, because the sound of a concession belongs on the
     participant that conceded. */
  if (bodies && bodies.length){
    const top = cy - h, bot = cy;                 // above-bursts pin the bottom
    const overlapAt = (x) => {
      let worst = 0;
      for (const bd of bodies){
        if (bot <= bd.t || top >= bd.b) continue;  // clear vertically already
        const over = Math.min(x + w/2, bd.r) - Math.max(x - w/2, bd.l);
        if (over > worst) worst = over;
      }
      return worst;
    };
    if (overlapAt(cx) > 0){
      /* AWAY FROM THE OTHER PARTICIPANT FIRST. bodies[0] is the participant
         the burst belongs to and bodies[1] is the other one. The direction
         away from the other one is tried first, so a tie breaks by moving off
         them rather than by array order. The reported defect was a burst that
         overlapped the wrong participant. At the range of an affirm, both
         directions often reduce the overlap by the same amount. */
      const other = bodies[1] || bodies[0];
      const awayFirst = (other.l + other.r) / 2 > cx ? [-1, 1] : [1, -1];
      let best = cx, bestOver = overlapAt(cx);
      for (let d = 20; d <= P.slideMax; d += 20)
        for (const sgn of awayFirst){
          const nx = cx + sgn * d;
          if (nx < w/2 || nx > STAGE.w - w/2) continue;
          const o = overlapAt(nx);
          if (o < bestOver){ bestOver = o; best = nx; if (o === 0) break; }
        }
      cx = best;
    }
  }
  return [cx, cy];
}

function spawnPop(tier, x, y, holdMs, phrase, bodies){
  const t = CONFIG.phrases[tier]; if (!t) return;
  // An explicit phrase can be passed in, so the same one can appear twice. See
  // resolvedPhrase, where the in-round burst and the result headline have to
  // agree.
  const ph = phrase || nextPhrase(tier);
  const d = document.createElement("div");
  // Below-bursts pin their TOP edge; everything else pins its bottom.
  /* Below-bursts pin their TOP edge. A high tier that had no room above its
     participant, and flipped underneath them, is a below-burst too. spawnPop
     cannot tell that from the tier alone, so popPoint reports it. */
  d.className = (tier === "resolved" || tier === "affirm" || popWentUnder) ? "pop below" : "pop";
  const w = burstWidth.get(ph.img) || CONFIG.popPlacement.burstH * 1.6;
  const h = CONFIG.popPlacement.burstH;
  const spot = nudgeClear(x, y, w, h, bodies);
  // No room beside a participant: show nothing rather than stack a second burst on
  // top of the first. The phrase is spent either way -- nextPhrase already
  // advanced -- which is deliberate: repeating it on the next conceded would read as
  // the game stuttering.
  if (!spot) return;
  [x, y] = spot;
  const box = { x, y, w, h };
  livePops.add(box);
  d.style.left = x+"px"; d.style.top = y+"px";
  // Inner node owns the animation; the outer one owns the centring, so the
  // keyframes cannot clobber it.
  const anim = document.createElement("div");
  anim.className = "pop-anim";
  anim.style.setProperty("--rot", (visualRandom()*24-12).toFixed(1)+"deg");
  d.appendChild(anim);

  // The styled-text form of a burst. Reachable two ways, and it must be:
  // art that fails to LOAD falls back to it, and a phrase that has no art at
  // all starts here.
  const asText = ()=>{
    const s = document.createElement("div");
    s.className = "poptext";
    s.textContent = ph.text;
    s.style.color = t.color;
    if (CONFIG.neon && CONFIG.neon.enabled)
      s.style.filter = `drop-shadow(0 0 ${CONFIG.neon.sfx.glowPx}px ${t.color})`;
    anim.appendChild(s);
  };
  // A PHRASE WITH NO ART GOES STRAIGHT TO TEXT rather than through an Image.
  // This crashed the game loop. bust() calls u.includes on its argument, so
  // bust(null) delivered before the element could ever fail to load. The onerror
  // fallback that exists precisely for missing art was therefore unreachable
  // when the art was missing outright rather than merely broken.
  //
  // REASON's activation burst is text-only by design, so every activation took
  // the loop down. It survived a whole soak unnoticed, because the run reports
  // the failure on one line that the analysis had filtered out.
  if (!ph.img){
    asText();
  } else {
    const img = new Image();
    img.src = bust(ph.img);
    img.onerror = ()=>{ img.remove(); asText(); };
    anim.appendChild(img);
  }
  el("sfxlayer").appendChild(d);
  // The in-round pops are transient; the RESOLVED burst has to survive until the
  // result screen replaces it, so it takes an explicit hold.
  if (holdMs) d.classList.add("pop-hold");
  setTimeout(()=>{ d.remove(); livePops.delete(box); }, holdMs || 520);
}

/* ==================================================================
 * 8. RENDER
 * ================================================================== */
/* Breathing is for a participant STANDING THERE, and nothing else. Every other
   state is already saying something. A guard is bracing, a defer is small, a
   response is committed, and concedeLock is a concession being taken. A wobble
   laid over any of them argues with the pose rather than supporting it. The one
   thing this has to sell is the difference between standing still and being
   frozen. */
/* WHERE IN THE DELIVERY ARE WE, and what should the body be doing there.
   Returns a lean in stage px and a tilt in degrees, both signed by facing.

   `A.lock - f.stateTimer` is the frames-elapsed expression responseBox() already
   uses; it is reused rather than recomputed so the visual phases can never
   drift out of step with the response box they describe.

   Eases are chosen for what each phase communicates. The wind-up eases IN,
   because a body gathering itself accelerates into the pose. The delivery is
   nearly linear and fast. The recovery eases OUT, which is the one the
   research is emphatic about -- deceleration is where weight lives. */
function deliveryOffset(f){
  const A = CONFIG.responses[f.state];
  if (!A || f.stateTimer <= 0) return null;
  const P = CONFIG.physics;
  const frame = A.lock - f.stateTimer;
  const weight = A.depletion / CONFIG.responses.affirm.depletion;
  const lean = P.deliveryLeanPx * weight, tilt = P.deliveryTiltDeg * weight;

  if (frame < A.active[0]){
    /* ANTICIPATION: away from the target, and deepest on the LAST startup
       frame. It uses `(frame + 1) / active[0]` rather than
       `frame / active[0]`, and the difference is real. Keyed the other way,
       the wind-up peaks ON the first active frame. The body is then furthest
       BACK at the exact moment the response box goes live, and the response lands
       from a retreating pose. The phase exists to be finished when the
       delivery starts. */
    const t = A.active[0] > 0 ? (frame + 1) / A.active[0] : 1;
    const e = t * t;                       // ease in
    return { dx: -lean * e, rot: -tilt * e };
  }
  if (frame <= A.active[1]){
    // ACTION: through the response, carrying slightly past neutral. Already moving
    // on the first active frame, for the same reason.
    const span = A.active[1] - A.active[0] + 1;
    const t = (frame - A.active[0] + 1) / span;
    return { dx: -lean * (1 - t) + P.deliveryShiftPx * weight * t,
             rot: -tilt * (1 - t) };
  }
  /* RECOVERY: drag back to neutral, easing out. This is the weight.

     The span runs to the LAST frame of the lock rather than one past it. The
     settle therefore reaches exactly zero on the final frame, rather than
     being truncated at whatever the curve was worth there. Keyed the other
     way, a linear settle left 1.13px outstanding at the end. The
     return-to-neutral assertion was then quietly grading the easing shape as
     well, and two tests that should fail independently could not. */
  const span = Math.max(1, (A.lock - A.active[1] - 1) / P.followSpeed);
  const t = Math.min(1, (frame - A.active[1]) / span);
  const e = 1 - (1 - t) * (1 - t);         // ease out
  return { dx: P.deliveryShiftPx * weight * (1 - e), rot: 0 };
}
/* HOW HARD ARE THEY STILL REELING. Returns a world-space lean, tilt and squash,
   or null when the participant is not taking one.

   It rises over `concedeFlinchFrames` and releases across the rest of the
   concedeLock the response carried. A heavier response therefore rocks a
   participant for longer as well as further. The frame data already says
   CLARIFY locks for 33 against AFFIRM at 27, and this reads that rather than
   adding a second timer beside it.

   The rise eases OUT (abrupt, immediate, arriving almost at once) and the
   release eases out too (a body unwinding, slowing as it returns). Nothing
   here eases IN: being conceded has no anticipation. */
function concedeSetback(f){
  if (!(f.concedeFrames > 0) || !f.concedeSpan) return null;
  const P = CONFIG.physics;
  const done = f.concedeSpan - f.concedeFrames;          // frames since the response landed
  const rise = Math.min(P.concedeFlinchFrames, f.concedeSpan);
  let a;
  if (done < rise){
    const t = (done + 1) / rise;
    a = 1 - (1 - t) * (1 - t);                   // ease out, fast
  } else {
    /* `+ 1` so the release begins moving on its first frame. Without it both
       branches evaluate to full at the boundary, and the peak lands on two
       consecutive frames. That is harmless to look at and it is an accident
       rather than a decision. A curve with an accidental flat spot in it
       cannot be reasoned about later. */
    const span = Math.max(1, (f.concedeSpan - rise) / P.followSpeed);
    const t = Math.min(1, (done - rise + 1) / span);
    a = (1 - t) * (1 - t);                       // ease out, unwinding
  }
  const w = f.concedePower || 1, dir = f.concedeDir || 1;
  return { dx: P.concedeLeanPx * w * a * dir,
           rot: P.concedeTiltDeg * w * a * dir,
           sy: 1 - P.concedeSquash * w * a };
}
/* HOW FAR A MOVE CAN ACTUALLY REACH THIS PARTICIPANT.

   `reach` is measured to the far edge of the response box from the deliverer's
   centre. A response connects when that edge touches the EDGE of a body, so the
   real threat range is reach plus half the target's width. Measured by a sweep
   of the gap, a pixel at a time, AFFIRM lands at 239 against a configured 165
   and CLARIFY at 274 against 200. Both are 74px further than the number every
   spacing decision was built from.

   That gap is why the CPU never backed away from anything. It parked on a line
   it believed was outside a clarify, and was in fact well inside one. Retreat
   was never the right answer to a question it did not know it was being
   asked. */
function threatRange(f, kind){
  const A = CONFIG.responses[kind];
  return A ? A.reach + bodyBox(f).w / 2 : 0;
}

/* ---- WHAT THIS MATCH HAS TAUGHT IT --------------------------------------
   Per MATCH, not per round and not per session: reset by startMatch, the path
   both REGENERATE and NEW RUN take. */
let learn = null;
function learnReset(){
