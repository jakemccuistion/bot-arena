    // somebody always wins, and with none there is nobody to have lost.
    let headline, verdict;
    if (cause === "resolved"){
      const tier = endTier(winnerIdx, matchOver);
      const ph = (tier === "resolved" && resolvedPhrase) ? resolvedPhrase : nextPhrase(tier);
      headline = `<img id="resolved" class="resolvedart" src="${bust(ph.img)}" alt=""
        onerror="this.remove();document.getElementById('resolvedText').style.display='caveat'">
        <div id="resolvedText" class="bigtitle resolvedart" style="display:none;color:${
          CONFIG.phrases[tier].color};font-size:${headlinePx(ph.text)}px">
        ${ph.text}</div>`;
      verdict = `${F[winnerIdx].def.name} WINS ${matchOver?"THE BENCHMARK":"EVAL "+roundNum}`;
    } else {
      const tp = nextPhrase("time");
      headline = `<img id="resolved" class="resolvedart" src="${bust(tp.img)}" alt=""
        onerror="this.remove();document.getElementById('resolvedText').style.display='caveat'">
        <div id="resolvedText" class="bigtitle resolvedart" style="display:none;color:${
          CONFIG.phrases.time.color};font-size:${headlinePx(tp.text)}px">
        ${tp.text}</div>
        <div class="timeup">TIME UP</div>`;
      verdict  = cause === "coin"
        // STATISTICAL TIE, not EXACTLY EVEN. Same meaning, and it is the better
        // phrase regardless: this game is scored in evals and benchmarks, and
        // a statistical tie is what that world calls two results it cannot
        // separate. It also keeps the copy on the safe side of the register,
        // the same call that retired STOLE THE ANSWER KEY and END OF LIFE.
        ? `STATISTICAL TIE &mdash; ${F[winnerIdx].def.name} WON THE COIN TOSS`
        : `${F[winnerIdx].def.name} WINS ${matchOver?"THE BENCHMARK":"EVAL "+roundNum} ON HEALTH`;
    }
    // The record is submitted BEFORE the screen is built, so the screen can
    // say whether it was cleared. Only a benchmark the human actually won
    // counts -- losing 0-2 is not a personal best of anything.
    let recordLine = "";
    if (matchOver && players === 1){
      const level = CONFIG.difficulty.levels[difficulty].name;
      const humanWon = winnerIdx === humanSide;
      const prev = Records.get(level);
      if (humanWon){
        const me = F[humanSide];
        const rec = { won: wins[humanSide], lost: wins[1-humanSide],
                      health: Math.max(0, me.health / me.def.maxHealth * 100) };
        const isBest = Records.submit(level, rec);
        /* THIS RUN'S SCORE, because it was not on the screen anywhere. The
           verdict says who won and not by how much, so the only numbers here
           belonged to the RECORD, which is a different match entirely. Play
           reported a 2-0 on the screen during eval three of a 2-1 run. A 2-1
           win displayed under a 2-0 record reads as a wrong score, and the
           game had given no way to tell the two apart.

           When the run IS the record there is only one line. The same numbers
           printed twice under two labels are their own kind of confusing. */
        recordLine = scoreBlock(level, rec, prev, isBest);
      } else if (prev){
        recordLine = scoreBlock(level, null, prev, false);
      }
    }
    overlayHTML(`
      ${headline}
      <div class="sub">${verdict}</div>
      ${recordLine}
      ${matchOver ? `
        <div class="choices endchoices">${END_CHOICES.map((c,i)=>
          `<button class="choice ${i===endIdx?"sel":""}" data-e="${i}" type="button">${c.text}</button>`
          ).join("")}</div>
        <div class="sub blink" style="font-size:20px;margin-top:18px">${
          prompt2("&larr; &rarr; &nbsp; THEN SPACE","TAP TO CHOOSE")}</div>`
      : `<div class="sub blink" style="font-size:26px">${
          prompt2("PRESS SPACE FOR NEXT EVAL","TAP FOR NEXT EVAL")}</div>`}`);
    // phase was set in endRound itself — see the note there. This caveat draws.
    if (matchOver){
      // Always opens on REGENERATE: finishing a benchmark and wanting another
      // of the same is the common case, and it keeps SPACE meaning what it
      // meant before these buttons existed.
      endIdx = 0; renderEndChoices();
      for (const b of document.querySelectorAll(".endchoices .choice"))
        b.addEventListener("click", e=>{
          e.stopPropagation();
          endIdx = +e.currentTarget.dataset.e;
          confirmEnd();
        });
    }
  });
}
function advance(){
  if (phase==="matchover") startMatch();
  else { roundNum++; renderPips(); startRound(); }
}

/* ==================================================================
 * 10b. ATTRACT MODE — the cabinet demo
 *
 * Runs as its own phase, which is the whole safety story:
 *   - the loop's active branch is `phase==="active"`, so the round timer,
 *     readControls and the RESOLVED backstop never see the demo;
 *   - endRound() opens with `if (phase !== "active") return`, so a demo
 *     resolve cannot bank a win, advance roundNum, raise the result overlay
 *     or fire a sting. resolve() still lays the loser out and pops the
 *     RESOLVED phrase, which is the part worth watching.
 * The demo reuses the ONE ticker started at boot and never schedules a frame
 * of its own. It also reuses updateAI for both participants, rather than
 * introducing a second decision path.
 * ================================================================== */
function startDemoBout(){
  spawnPair(true, true);              // both sides CPU: same AI, both ways
  attractTimeLeft = CONFIG.round.seconds;
  attractResetAt = 0;
}
function enterAttract(){
  if (!CONFIG.attract.enabled || phase !== "title") return;
  const A = CONFIG.attract;
  setPhase("attract"); paused = true;
  startDemoBout();
  attractEndAt = performance.now() + A.demoMs;
  // After any overlayHTML call, never before — that helper now clears these.
  el("overlay").classList.add("attract");
  el("overlay").classList.toggle("nohints", !!A.hideHints);
  el("overlay").style.setProperty("--scrim-a", A.scrimOpacity);
  el("overlay").style.setProperty("--attract-lift", A.liftPx+"px");
  el("overlay").style.setProperty("--attract-scale", A.titleScale);
  if (A.music === "eval"){ Sound.stopAll(); Sound.play("attract"); applyStage(); }
  else if (A.music === "none") Sound.stopAll();
  // "title": leave the theme alone. Restarting it every demo loop is the
  // thing that makes a cabinet sound broken.
}
// toSelect=true when a human woke it. It does NOT hand straight over to a
// real match. That was the behaviour, and it was the reported defect. This
// comment went on describing it as the design long after the parameter stopped
// being called startReal. The reasoning is on the branch below.
function exitAttract(toSelect){
  if (phase !== "attract") return;
  attractEndAt = attractResetAt = 0;
  attractTimeLeft = 0;
  el("overlay").classList.remove("attract","nohints");
  el("overlay").style.removeProperty("--scrim-a");
  el("overlay").style.removeProperty("--attract-lift");
  el("overlay").style.removeProperty("--attract-scale");
  el("sfxlayer").innerHTML = ""; livePops.clear();       // drop any pop still animating
  el("announce").innerHTML = "";
  shakeUntil = 0;
  held.clear();
  setPhase("title");
  if (toSelect){
    // The SELECT screen, and not straight into a match. A direct start
    // skipped the menus entirely. It silently reused whatever `players`,
    // `humanSide` and `difficulty` were left over from the last run. Nothing
    // is stored anywhere. A module variable that outlives the match it was
    // chosen for still behaves exactly like saved state to the person pressing
    // the button.
    //
    // It also happened only after seven idle seconds. From the outside, SPACE
    // therefore appeared to skip the menus sometimes and not others. A woken
    // cabinet goes to select on real hardware too.
    selectScreen();
  } else {
    spawnPair(...cpuFlags());     // back to a fresh, full-health title pair
    lastInputAt = performance.now();
    if (CONFIG.attract.music !== "title"){ Sound.stopAll(); Sound.play("title"); }
    // The demo hands to the RECORDS card, which hands to the title. That is
    // the loop an arcade cabinet runs, and the middle step was the missing one.
    recordsCard();
  }
}
// One tick of the demo. Mirrors the active branch minus the round timer,
// minus readControls, minus the round-over backstop.
function stepAttract(ts, dt){
  const A = CONFIG.attract;
  const holding = attractResetAt > 0;
  if (!holding){
    attractTimeLeft = Math.max(0, attractTimeLeft - dt/1000);
    updateAI(F[0], F[1], ts);
    updateAI(F[1], F[0], ts);
  }
  // Physics keeps running through the hold so a concluded bot settles
  // instead of freezing mid-setback.
  Clock.now = ts;          // the demo steps the same simulation
  stepPhysics();
  if (!holding){
    resolveExchange();
    if (F.some(f=>f.health<=0) || attractTimeLeft<=0)
      attractResetAt = ts + A.resolvedHoldMs;
    else if (ts >= attractEndAt) exitAttract(false);
  } else if (ts >= attractResetAt){
    if (ts >= attractEndAt) exitAttract(false);
    else startDemoBout();
  }
}

/* ==================================================================
 * 11. MAIN LOOP
 * ================================================================== */
/* Give the cabinet back to nobody. Clears the match rather than leaving the
   score standing, because the next person to walk up should not inherit a
   half-finished benchmark. */
function abandonToTitle(){
  wins = [0,0]; roundNum = 1; resolvedPhrase = null;
  Sound.stopAll();
  el("sfxlayer").innerHTML = ""; livePops.clear();
  spawnPair(false, true);
  renderPips();
  titleScreen();          // which starts the theme if it is not already up
  lastInputAt = performance.now();
}

/* THE SIMULATION RUNS AT A FIXED 60Hz, whatever the display manages.

   Every frame number in CONFIG is quoted at 60fps: an 18-frame affirm, 27
   frames of concedeLock, 7 frames of freeze. The loop used to advance the
   simulation exactly once for each animation frame. The game therefore did not
   run at a speed. It ran at whatever rate the browser could paint. Measured on
   one machine, rAF was delivering 29fps, with gaps clustered at 32ms against a
   16.6ms minimum. That is a 60Hz display that drops most of its frames. Every
   duration in the game was therefore taking TWICE as long as it was tuned for.

   That is what the slow motion was. It is also why three passes of
   redistributing frames between poses never touched it. They reallocated
   frames inside a clock that ran at half rate.

   The catch-up is capped. After a long stall, such as a background tab or a
   garbage collection, the backlog is dropped rather than fast-forwarded. The
   game therefore never lurches to catch up on time nobody was watching.

   The soak is unaffected by construction. It drives loop(vt) with vt advancing
   exactly 1000/60 for each call, which yields exactly one step for each frame.
   That is what it did before, so every ladder number ever measured still
   holds. */
const SIM_HZ = 60, SIM_STEP = 1000 / SIM_HZ, SIM_MAX_CATCHUP = 5;
let simAcc = 0, simClock = 0;

function loop(ts){
  requestAnimationFrame(loop);
  /* CLAMPED AT BOTH ENDS. The upper bound has always been there, so a stalled
     tab does not resume with one enormous frame. The lower bound matters now
     that dt drives a step accumulator. A NEGATIVE delta is the clock appearing
     to run backwards. It happens whenever something hands loop() a timestamp
     older than the last one. It would drain the accumulator and stall the
     simulation for however long it takes to climb back, without erroring. Zero
     is the only honest reading of time that did not pass. */
  /* THE FIRST FRAME HAS NO PREVIOUS TIMESTAMP, so it is seeded from this one
     and dt is zero. It used to clamp to the 50ms ceiling. That was harmless
     while the loop advanced the match exactly once for each frame. With a step
     accumulator, a 50ms first frame fires THREE steps instead of one. The soak
     seeds Math.random for determinism, so two extra steps shift every roll for
     the rest of the run. A frame that has not happened yet is worth no time at
     all. */
  if (!lastTs) lastTs = ts - SIM_STEP;   // the first frame is worth EXACTLY one step
  const dt = Math.max(0, Math.min(50, ts - lastTs)); lastTs = ts;
  if (!simClock) simClock = ts;

  /* The records card hands back to the title on its own. It is checked BEFORE
     the idle test below, so the card is never what the idle countdown
     measures. titleScreen() restamps lastInputAt, which gives the title its
     full dwell before the demo comes round again, rather than the
     remainder. */
  if (phase==="title" && cardUntil && ts >= cardUntil) titleScreen();

  // Idle cabinet: hand the screen to the demo after CONFIG.attract.idleMs.
  if (phase==="title" && CONFIG.attract.enabled && !cardUntil
      && ts - lastInputAt >= CONFIG.attract.idleMs) enterAttract();

  // An ABANDONED result screen goes home. Every other screen either advances
  // on its own or hands over to the demo. A result screen waits for SPACE and
  // waits forever. A cabinet nobody came back to therefore stayed on somebody
  // else's resolve until the next person pressed a key. A return to the title
  // picks up the ordinary idle path and starts the demo.
  if ((phase==="roundover" || phase==="matchover") && CONFIG.attract.enabled
      && ts - lastInputAt >= CONFIG.attract.resultIdleMs){
    abandonToTitle();
  }

  if (phase==="attract"){
    stepAttract(ts, dt);
  } else if (phase==="roundover" || phase==="matchover"){
    // Keep the bodies falling after the round ends. endRound sets paused
    // immediately. If that stops stepPhysics too, a bot shifted INTO THE AIR
    // hangs there for the whole resolvedHoldMs, and the result screen comes up
    // with it hovering. That presents as a mispositioned prone sprite. It is
    // actually a live participant with height and no gravity. Nothing else
    // runs here: no input, no AI, no exchange and no clock. Only gravity and
    // the ground.
    stepPhysics();
  } else if (!paused && phase==="active"){
    // THE FIXED-STEP CATCH-UP. Everything below runs whole 60Hz steps, as
    // many as the elapsed time is owed. The match therefore advances at the
    // same speed on a machine painting 30fps as on one painting 60.
    /* THE COMPARISON NEEDS A TOLERANCE, because dt is never exactly SIM_STEP.
       A timestamp near 1e6 has float spacing around 1e-10. A clock advancing by
       1000/60 therefore lands a hair either side of the step every frame. Those
       epsilons accumulate in simAcc until they cross the threshold and fire a
       DOUBLE step, roughly every 1,400 frames.

       Measured before this: 7,230 steps across 7,225 active frames, which is
       1.0007 for each frame. Five extra steps sounds like nothing and is not.
       It advances the match ahead of the replay driver's wall-clock inputs, and
       it shifts the seeded RNG. The CPU went from 29 deliveries to 54 in the
       same three matches. The participants spent twice as long at close range.
       The recorded human's win rate fell 11-18 points across the ladder.

       A frame that is within a microsecond of owing a step owes exactly
       one. */
    simAcc += dt;
    let steps = 0;
    while (simAcc >= SIM_STEP - 1e-6 && steps < SIM_MAX_CATCHUP){
      simAcc -= SIM_STEP; steps++;
      simStep(ts, SIM_STEP);
      if (phase !== "active") break;      // a resolve ends the round mid-catch-up
    }
    // Dropped rather than fast-forwarded: a backlog this large is a stall
    // nobody watched, and replaying it would lurch.
    if (steps >= SIM_MAX_CATCHUP) simAcc = 0;
    if (Math.abs(simAcc) < 1e-6) simAcc = 0;   // do not let residue build up
  }
  render(ts);
}

/* ONE 60Hz TICK of the exchange. `now` is the SIMULATION clock and not the
   wall clock. It advances by exactly one step per call. The AI's reaction
   timers are stamped in milliseconds, and they therefore stay in the same time
   base as the frames they count. A bot gets the same number of decisions per
   simulated second whatever the display is doing. A pass of ts here instead
   would quietly halve the CPU's reaction count at 30fps. */
/* ONE CLOCK FOR THE SIMULATION, set at the boundary and read below it.

   Two defects came from the absence of this. applyAI wrote its deadlines from
   performance.now() while updateAI compared them against the clock it was
   passed. In a browser those agree. The soak drives virtual time from 1e6.
   Every deadline therefore landed a million milliseconds in the past, and the
   CPU took NO post-response rest in any simulated match. reasonActive then did
   the same on
   its own terms. It was set and tested from wall time, and read by setState and
   resolveExchange to decide RECOVERY and DEPLETION. Thousands of virtual frames
   pass in a couple of wall seconds. A 5-second REASON therefore stayed lit for
   most of a match, and every ladder number carried a permanent advantage.

   Both were invisible in play and wrong in every measurement, which is the
   worst combination available. `Clock.now` is whatever the stepper was handed.
   Presentation may still read the wall directly, because that is what it draws
   against. A test holds the line, named for the rule that the simulation never
   reads the wall clock. */
const Clock = { now: 0 };

function simStep(now, dt){
  Clock.now = now;
  {
    // round timer
    timerAcc += dt;
    while (timerAcc >= 1000){ timerAcc -= 1000; timeLeft--; }
    if (timeLeft <= 0){
      timeLeft = 0;
      // Health can land EXACTLY level. The old expression quietly handed every
      // such tie to F[0] and announced a win for it. That is a coin flip
      // wearing a real win's clothes. There are no half-wins here. An exactly
      // level split is settled by a real coin toss, and it is SAID OUT LOUD on
      // the result screen. Only an exact tie gets this. Any margin at all is
      // decided on health.
      /* DECIDED ON THE BAR, not on raw health. The participants do not share a
         maximum, because RUST carries 112 against VOLT at 100. The HUD draws
         `health / maxHealth`, so a comparison of the raw numbers settled the
         round on a quantity the game never displays. RUST at 101 shows a 90%
         bar and won against VOLT at 100 showing a full one.

         It was not a rounding-level difference either. A driver that holds
         guard and never delivers takes zero deliveries, deals zero depletion,
         and runs every round to the clock. It took 44% of its matches off
         ULTRATHINK. The split says exactly where that came from: 78% as RUST
         and 0% as VOLT. The +8 health RUST was given to level the character
         matchup was silently also handing it every even round.

         Whatever the genre convention, a round has to be decided on what the
         player is looking at. */
      const share = f => f.health / f.def.maxHealth;
      if (share(F[0]) === share(F[1])) endRound(Math.random() < 0.5 ? 0 : 1, "coin");
      else endRound(share(F[0]) > share(F[1]) ? 0 : 1, "time");
    }

    // THE MUSIC CHANGES WHEN IT GETS SERIOUS. The first time either health bar
    // goes critical, the stage track gives way to a tension track and stays
    // there for the rest of the round.
    //
    // Latched, because this is tested every frame. A repeated call to play()
    // would restart the track from zero sixty times a second, which reads as
    // the music jamming rather than changing. The latch clears in startRound,
    // so it is per round rather than per match.
    if (!tensionSwapped && F.length === 2 &&
        F.some(f => f.health > 0 && f.health / f.def.maxHealth <= CONFIG.audio.tensionAt)){
      tensionSwapped = true;
      Sound.stop("eval"); Sound.stop("boss");
      Sound.play("tension", (roundNum - 1) % (Sound.variants.tension || [1]).length);
    }

    for (let i=0;i<2;i++){
      // THE decision point, and the only place a participant genuinely gets a
      // turn. It is recorded here rather than inside updateAI or readControls,
      // because both of those bail early while locked. A turn has to be
      // recorded for the participant who did NOT act, as much as for the one
      // who did. resolveExchange reads this to decide whether a response
      // continues a chain or starts one.
      if (!isLocked(F[i]) && F[i].state !== "conceded" && F[i].state !== "concluded")
        F[i].actedSinceConceded = true;
      if (F[i].isCPU) updateAI(F[i], F[1-i], now);
      else readControls(F[i], F[i].scheme);
    }

    stepPhysics();
    resolveExchange();

    // Backstop: if either participant is at zero and the round is somehow
    // still live, end it now. resolveExchange already calls resolve() on the
    // response that resolves, so this should never fire. It guarantees that
    // the round timer can never run on past a concluded participant.
    if (phase === "active"){
      const down = F.findIndex(f => f.health <= 0);
      // Route through resolve() rather than reimplement it. The old inline
      // version set the pose and ended the round. It never spawned the RESOLVED
      // burst and never fixed the draw order, so a resolve that arrived down
      // this path looked different from every other one.
      if (down !== -1) resolve(F[down]);
    }
  }
}

/* ==================================================================
 * 12. BOOT
 * ================================================================== */
(function boot(){
  // CONFIG is the single source of truth: publish the ground line to CSS
  // so the stylesheet and the physics can never drift apart.
  document.documentElement.style.setProperty("--groundY", CONFIG.stage.groundY+"px");
  (function applyShadowVars(){
    const S = CONFIG.shadow, root = document.documentElement.style;
    root.setProperty("--sh-w",       S.w + "px");
    root.setProperty("--sh-h",       S.h + "px");
    root.setProperty("--sh-drop",    S.drop + "px");
    root.setProperty("--sh-core",    S.core);
    root.setProperty("--sh-mid",     S.mid);
    root.setProperty("--sh-midstop", S.midStop);
  })();
  (function applyCRT(){
    const C = CONFIG.crt, el = document.getElementById("crt");
    if (!C || !C.enabled){ el.classList.add("off"); return; }
    const set = (k,v) => el.style.setProperty(k, v);
    set("--scan-pitch",  C.scanPitch + "px");
    set("--scan-thick",  C.scanThickness + "px");
    set("--scan-dark",   C.scanDarkness);
    set("--grille",      C.grille);
    set("--vignette",    C.vignette);
    set("--crt-opacity", C.opacity);
  })();
  // Publish the wordmark's CONFIG to CSS so the marquee is tunable from the
  // same one place as everything else. The extrusion is generated here: `depth`
  // stepped shadows in the side colour, then the two glow passes.
  (function applyWordmark(){
    const W = CONFIG.art.wordmark, r = document.documentElement.style;
    r.setProperty("--mq-size-1", W.size1+"px");
    r.setProperty("--mq-size-2", W.size2+"px");
    r.setProperty("--mq-track-1", W.track1+"px");
    r.setProperty("--mq-track-2", W.track2+"px");
    r.setProperty("--mq-tilt", W.tilt+"deg");
    r.setProperty("--mq-skew", W.skew+"deg");
    r.setProperty("--mq-ink", W.ink);
    r.setProperty("--mq-outline", W.outline+"px");
    r.setProperty("--mq-rim", W.rim);
    r.setProperty("--mq-rimw", W.rimWidth+"px");
    r.setProperty("--mq-glow", W.glow);
    const steps = [];
    for (let i=1;i<=W.depth;i++) steps.push(`${i*2}px ${i*2}px 0 ${W.extrude}`);
    steps.push(`0 0 34px ${W.glow}`, `0 0 78px ${W.glow}`);
    r.setProperty("--mq-shadow", steps.join(","));
  })();
  preloadStages();
  preloadBursts();
  applyStage();
  el("backdrop").addEventListener("error", function(){ this.style.display="none"; }, {once:true});
  Sound.init();
  // Build a disposable pair so the title screen has something behind it.
  spawnPair(false, true);
  renderPips();
  fit();
  titleScreen();
  // Boot. Same reasoning as the restart in startRound: this is the wall
  // timestamp the first frame is measured from, and the boundary hands it down
  // as Clock.now from there on.
  running = true; lastTs = performance.now(); requestAnimationFrame(loop); // CLOCK-OK
})();
</script>
</body>
</html>
