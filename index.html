  // ---- physics --------------------------------------------------
  /* groundDecel is now the ONLY thing that sets how long a shift lasts,
     because the distance is stated per-move in px. 1.0 was chosen against a
     measured trade, not picked:

         a      AFFIRM pop   frames      ratio clarify/affirm time
         0.30      4.99       16.6            1.26
         1.00      8.89        8.9            1.27
         1.22      9.77        8.0            1.27   (rounds slowed past the
                                                     40s RESOLVED check)

     The old friction curve launched AFFIRM at 9.00 and took 19 frames to
     settle. 1.0 keeps that opening pop within a tenth, and that is the frame
     which sells the response. The saving is spent on the tail, which is the
     part that read as drift. Every value here fixes the weight property
     regardless. The ratio of travel times goes from 1.11 to 1.27. */
  physics:{ gravity:1.05, groundDecel:1.0, minGap:165, walkAnimSwap:8,
            // How far short of the wall a participant stops. Read by wallSpan,
            // which is the only thing that knows where the walls are.
            wallInset:20,
            walkBobRate:0.115,     // radians of bob per px travelled
            walkBobPx:5,           // peak lift, in stage px
            /* ---- WEIGHT, in transforms only --------------------------
               No art is needed for any of this, which is why it comes ahead of
               the generated poses. Squash, stretch and settle are what a
               transform is good at.

               LANDING: 0.2s split evenly into a squash and a recovery, which is
               6 frames and 6 at this framerate (Ziimple, squash and stretch
               components). It is scaled by the speed of arrival, so a short hop
               and a full ESCALATE do not land identically. That scaling IS the
               landing weight. It is deliberately deeper than gravity would
               manage, which is the standard advice (GameAnim, the 12 principles
               in games). A read of weight outranks being correct.

               BREATHING: no published figures exist. The period is therefore
               anchored to a real respiratory rate under exertion, rather than
               invented and dressed as a standard. 20-25 breaths a minute is a
               2.4-3.0s cycle, and 2.6s sits inside it. The amplitude is
               deliberately tiny. This is the difference between a participant
               that stands still and a participant that is frozen. Anything
               consciously noticeable is already too much. */
            /* ---- ANTICIPATION, ACTION, RECOVERY ----------------------
               The three phases every response animation has (Rivals Workshop;
               GDKeys, on move anatomy). They are driven off the frame data
               this game already carries, rather than a second set of timings.

               The anticipation is not decoration. It is the opponent's only
               warning that a response is coming. The convention is that a
               HEAVIER move telegraphs harder, so the read stays fair. These are
               therefore scaled by the move's own depletion rather than flat.
               AFFIRM gets 4 startup frames to lean in and CLARIFY gets 6, which
               is the frame data stating the same thing.

               The follow-through matters as much. Animators slow the
               follow-through deceleration after contact, because that
               deceleration phase is where weight is communicated. A heavy move
               drags where a light one snaps back (MoCap Online, melee timing).
               Recovery therefore eases OUT, and it eases out over more frames
               for CLARIFY, because CLARIFY has more of them.

               In stage px at the reference weight, which is AFFIRM at depletion
               8. Every value scales with depletion from there. */
            deliveryLeanPx:13,      // how far the body winds back
            deliveryTiltDeg:3.2,    // and how far it rotates doing it
            deliveryShiftPx:9,       // how far past neutral the delivery carries it
            /* ---- THE PARTICIPANT WHO TAKES THE RESPONSE ---------------
               A participant who took a response had no transform at all.
               Every frame of expression went to the one delivering it and none
               to the one receiving it. That is the wrong way round, because
               the response is the subject.

               4 frames to the deepest point is the figure a major platform title uses to blend
               a flinch into the depleted pose. Cutting straight to that pose
               looks wrong (McLeodGaming, Freeze). The release then runs over
               whatever concedeLock the response carries, so a heavier response
               moves a participant for longer as well as further.

               The effect is weighted towards rotation and squash rather than
               translation. The shift is already moving them, and a large
               positional offset on top reads as more shift rather than as a
               body absorbing something. The values are set at the reference
               weight, which is AFFIRM at depletion 8, and scale with depletion.

               HOW FAST THE TAIL CLEARS. The follow-through of a delivery and
               the unwind of a concede both ran over their whole remaining
               window: the setback across all 23 to 29 frames of concedeLock,
               and the delivery across all of its recovery. An ease-out spends
               most of the span near the end, which reads as slow motion. The
               first part of the movement is correct. The midpoint must be
               twice as fast.

               The correction belongs in the tail and not in the curve. The
               delivery reads correctly, so the rise is unchanged and only the
               settle is compressed. At 2 the visual arrives in half the frames
               and holds at neutral for the rest, which is what a body does. It
               arrives and stops. It does not glide to a halt over a third of a
               second.

               The frame data is unchanged. This is what a participant looks
               like during recovery. It is not how long recovery lasts.

               followSpeed is 4, doubled from 2. It divides the release span
               of both the delivery settle and the concede unwind. At 2 a
               participant that took an AFFIRM spent 11.5 frames unwinding its
               lean, which is 192ms. One that took a CLARIFY spent 14.5 frames,
               which is 242ms. That is where the slow-motion reading came
               from. */
            followSpeed:4,
            concedeFlinchFrames:4,
            concedeLeanPx:7,
            concedeTiltDeg:5.5,
            concedeSquash:0.05,
            landSettleFrames:12,
            landSquashMax:0.14,
            breathPeriodMs:2600,
            breathAmp:0.018,
            // Airborne body box: legs tucked, so a escalate clears a low response.
            airBoxScale:0.50,      // fraction of the standing box height
            airBoxLift:0.15,       // and lifted this much off the feet
            // Low-stance height, in ABSOLUTE stage px rather than a fraction
            // of spriteH. The response boxes are absolute, so a fraction would
            // make the evasion work for one bot and not the other. Rust stands
            // 400 and Volt 430, and at any single fraction one of them keeps
            // its head in the affirm box.
            // 215 is set from the ART rather than chosen first. A low stance
            // that reads as one is a little over half standing height. A
            // body box much shorter than the drawing would have responses
            // visibly passing through a head they are supposed to miss. AFFIRM
            // was raised to clear it. See responses.affirm.boxY.
            crouchBoxH:215 },

  // ---- responses --------------------------------------------------
  // active: the frame window during which the response box is live.
  responses:{
    // Frames of recovery AFTER a response's lock ends, before another can
    // start. It applies to the player and the AI alike. 10 frames is about
    // 167ms, which puts an affirm cycle at about 467ms and a clarify at about
    // 600ms. That is fast enough to feel responsive, and slow enough that
    // consecutive deliveries read as separate deliveries rather than as one
    // stuttering pose.
    recoveryFrames:10,
    /* PER-MOVE OVERRIDE, and CLARIFY uses it. Both normals recovered in the
       same 10 frames. That handed the heavy its reach and its depletion for
       free. CLARIFY reaches 200 against AFFIRM at 165. It concedes for 14
       against 8, it locks for longer, and it shifts further. It paid for all of
       that with eight extra frames of lock. Measured, that is 0.39 depletion
       for each committed frame against 0.29. It is not merely stronger. It is
       more EFFICIENT. On its own it passed the top rung 100 times out of
       100.

       The genre answer is not a shorter clarify. A clarify SHOULD out-reach an
       affirm. The trade is that the light one is fast and short, while the
       heavy one reaches further and is slow. What pays for the reach is
       recovery. A long recovery is what makes a whiffed heavy dangerous, and
       the heavy has the most recovery of the basic normals. A miss therefore
       leaves the participant open long enough to be answered (infil.net, Killer
       Instinct guide).

       The reach therefore stays and the heavy starts paying. `recovery` is read
       by tryResponse and by the chain cap. Anything without one keeps the
       default. */
    // How long a press is remembered while the participant is still committed.
    // 4 frames is 67ms -- enough that pressing a touch early still comes out,
    // short enough that it cannot stand in for a second press.
    inputBufferFrames:4,
    // ---- CONVERSION -------------------------------------------------
    // The fourth thing a difficulty ladder can vary. The other three are
    // assertiveness, defence and reaction. All of them change how OFTEN a bot
    // gets an opening. None of them change what an opening is WORTH. Every
    // opening in this game paid exactly one response. The only way to make a
    // rung deplete harder was therefore to make it deliver more. More
    // deliveries is what hands a whiff to a human. That is why the middle rung
    // could not be moved without turning it into the top one.
    //
    // A landed response CANCELS most of its own recovery. That is what makes a
    // follow-up possible at all. AFFIRM leaves the deliverer free at frame 20
    // instead of 28, while the defender is locked until 31. A cancel only on a
    // landed response is the convention. A guarded response pays its recovery
    // in full, so pressure into a guard is still a risk.
    comboCancel:2,        // frames of recovery left after a conceded that connects
    // Three, and proration is what keeps that from being a doubling. AFFIRM
    // pays 7 + 5 + 3 rather than 21. The LIMIT is a property of the game and is
    // the same for everyone. What a difficulty ladder varies is how reliably a
    // bot takes each link, which is comboSkill. A CPU that could legally chain
    // further than a player can is a cheat rather than a difficulty.
    comboMax:3,
    /* HOW LONG THE DEEPER CONCEDED REACTION HOLDS, as a share of that
       response's own concedeLock rather than a flat frame count. ConcedeLock is
       already per-move, at AFFIRM 27 frames and CLARIFY 33. A share therefore
       keeps the heavier response's reaction visibly longer, without a second
       number to keep in step. 0.3 gives 8 frames on an affirm and 10 on a
       clarify.

       It is deliberately short. `setback` is the peak of the motion and
       `conceded` is where it settles. A hold of the peak for most of the lock
       would read as a pose rather than as a response. That is the failure the
       whole sequence exists to avoid. */
    /* recoilShare and concedeHold are GONE. They set the conceded reaction on
       fractions of concedeLock, independently of the lean the transform was
       drawing. The pose therefore finished long after the body stopped moving,
       and it read as a ratchet. poseFor now derives both boundaries from
       concedeFlinchFrames and followSpeed, which are the same constants
       concedeSetback() uses. There is one description of the motion instead of
       two that drift. recoveryHold below still applies to RESPONSES, which have
       no such curve. */
    recoveryHold:0.5,
    concedeHold:0.55,
    // 0.90, raised from 0.70 once the cap became real.
    //
    // The old value was not wrong for the game it was tuned in. It was tuned
    // when a chain never actually stopped, because chainCount reset on every
    // response. Heavy proration was then the ONLY brake on a conversion. With
    // the cap enforced the brake can ease, and it has to. At 0.70 the mirror
    // match stopped finishing at all, and ended 60 seconds at 29 health each.
    //
    // It is still a proration and still not a doubling. AFFIRM pays 8 + 7 + 6
    // = 21 against 24 for three clean concessions. The property the comment
    // below has always claimed is intact. It simply costs a conversion less
    // than it did.
    comboScale:0.90,
    /* WHAT THE CHAIN COUNTER SAYS. It used the arcade convention, which names
       the responses that landed. That is the wrong register for this game,
       because the language must stay in register.

       UNANSWERED is what a chain actually IS, and it is the sharper joke. The
       premise is agreement delivered so relentlessly that nobody gets a word
       in, and a count of unanswered responses is what that looks like written
       down. It also stays inside the vocabulary the rest of the game uses:
       eval, benchmark, context and points addressed. The previous label was
       the one piece of genre language left in the HUD. */
    comboLabel:"UNANSWERED",
    // How long the counter stays up after the last response of a chain. The
    // counter cannot simply follow chainCount, because that value persists on
    // the participant until their NEXT response resets it -- it would sit on screen
    // indefinitely. Holding it on a clock instead means the number is visible
    // long enough to read after the combo has already ended, which is the
    // arcade convention: you are told what you just did, not what you are
    // doing.
    comboHoldMs:900,
    /* FREEZE — the hold at the instant of contact.

       It is not concedeLock. ConcedeLock is the defender's recovery afterwards,
       and it is already tuned per move. Freeze is a moment where BOTH
       participants hold still. It is what makes a response read as a collision
       rather than as one sprite that passes through another.

       7 and 10 frames, taken from Guilty Gear Xrd -SIGN-, which freezes light
       responses for 7 and heavy for about 10. AFFIRM is this game's light at 8
       depletion and CLARIFY is its heavy at 14, so they map straight across.
       These are found numbers rather than invented ones.

       BOTH PARTICIPANTS, EQUALLY, which is not a detail. Frame advantage is the
       difference between the deliverer's recovery and the receiver's lock. A
       freeze on both leaves that difference untouched. The chain cap and the
       lock fix are both arithmetic on that difference. A freeze applied to one
       side only would therefore reopen a 4.6-second loop.

       A guarded response gets a shorter freeze. A guard should feel like
       absorption rather than like delivery. */
    /* 4 and 6, down from 7 and 10, after four rounds in which the reaction read
       as slow.

       RESEARCH: a major 2016 versus title freezes 8 frames on a light response, 12 on a
       medium and 15 on a heavy. Those are its ON-GUARD figures. The multiplier
       below already halves this game's, so the guarded freeze here was 3.5 and
       5 against 8 and 12 there. The ON-CONCEDED 7 and 10 sat squarely inside
       that range.
       These were never outlandish numbers. They were the largest remaining
       piece of a reaction chain with three other faults in it.

       What made them worth cutting is that freeze is STATIC TIME in a way the
       rest of the chain is not. A frozen participant does not decrement
       concedeFrames. The deep setback pose was therefore on screen for 116ms on
       AFFIRM and 166ms on CLARIFY without any movement. That is more than half
       its screen time. A cut to 4 and 6 keeps a freeze that is clearly felt,
       and it takes 50ms and 66ms out of the front of every exchange.

       Kept proportional: CLARIFY is the heavier response and still freezes half
       again as long. */
    freezeAffirm:4,
    freezeClarify:6,
    freezeCaveatMul:0.5,
    // How far an airborne response's box drops relative to the deliverer. Tuned
    // so a escalate-in connects with a standing opponent from roughly the top of
    // the arc down.
    airAim:-180,
    // Height window in which an airborne response can land, descending only. The
    // apex of a real escalate is ~181, above this band, so the delivery has to be
    // timed into the fall.
    airConcedeBand:[55,150],
    // boxY 275 makes AFFIRM a genuinely HEAD-HEIGHT response. It has to start
    // above a low stance at 215, or a DEFER would not clear it, and the defer
    // is the only answer to it. It still lands on anyone standing, whose box
    // reaches 320-344, and it still catches a participant in the air.
    // concedeLock and caveatLock are PER MOVE, because frame advantage is per
    // move.
    //
    // Frame advantage is the difference between the deliverer's recovery and
    // the defender's. It is the number that decides whether a response is
    // worth doing. Convention for a light normal is roughly +2 to +5 on a
    // concession and -2 to -5 on a guard. A landed response keeps the
    // initiative, and a guarded one gives it up.
    //
    // This game had ONE global concedeLock of 16 frames, against responses
    // that commit their owner for 28 and 36. That works out at -8 and -14 ON A
    // CONCESSION. A landed response therefore handed the initiative to the
    // participant that had just conceded, and a guarded one was -18 and -24.
    // Offence was self-punishing, which is most of the reason a CPU that
    // delivered lost to anything that waited.
    //
    // Derived, not guessed. The defender must recover `advantage` frames after
    // the deliverer. The deliverer recovers at lock + recoveryFrames, and the
    // response lands on the first active frame.
    //   affirm  28 - 4 + 3  = 27      clarify  36 - 6 + 3  = 33
    //   caveat  28 - 4 - 3  = 21            36 - 6 - 3  = 27
    /* shiftPx is a DISTANCE, not a velocity, and that is the point. A shift was
       configured as an initial speed. What a response did to the spacing
       therefore depended on the decay curve. When the curve changed from a
       friction multiply to constant deceleration, every shift in the game
       silently moved. Exponential decay travels a distance proportional to v,
       while constant deceleration travels one proportional to v SQUARED.
       Preservation of the two full-shift moves therefore shortened every
       smaller one. Guarded separation fell 64% on AFFIRM, and the masher
       climbed from 44% to 58% on the strength of it.

       Distance is what the design means, what spacing is measured in, and what
       the whole balance pass is read against. Stated here, it survives any
       future change to the decay. 44 and 69 are the distances the old curve
       produced, measured, so this change is the SHAPE alone. */
    affirm:{ depletion:8,  lock:18, active:[4,10], reach:165, boxW:130, boxH:110, boxY:275, shiftPx:44,
            concedeLock:27, caveatLock:21 },
    /* REACH 185, down from 200. The art now stretches further than the
       response lands. This is deliberate. Art that reaches a given distance
       does not have to land at that distance.

       The genre convention gives a clarify more reach than an affirm. The
       trade is fast and short against long and slow. That convention assumes a
       LIGHT, MEDIUM and HEAVY ladder, where a player selects the correct tool
       for the distance. This game has two responses. With two responses, a
       reach advantage does not create a choice. It removes one. Nobody presses
       the shorter button, and recorded human play was 91% CLARIFY.

       The sweep shows that the reach was the whole cause:

           clarify reach   clarify-spam   affirm-spam
              200          56%         30%
              185          33%         43%
              172           8%         50%     <- dominance only flips
              165          16%         20%     <- both weak, play drops too

       185 is the value where neither button is the answer. 172 and below gives
       the exploit to AFFIRM. That is the same game with a different letter.

       The number cuts BOTH ways. The CPU delivers the same clarify, so this
       shortens its longest probe as much as the player's. That is most of the
       reason affirm-spam climbs as the number falls. */
    /* 12, down from 14. CLARIFY was better than AFFIRM on every axis that
       matters: 200 reach against 165, 14 depletion against 8, a longer
       concedeLock, and more shift. It was worse on none except two frames of
       startup. AFFIRM is also the HIGH response, so it is the response a DEFER
       goes under. There was no reason for anyone to press it. Recorded human
       play that passed the top rung was 62-77% CLARIFY.

       The correction changes depletion rather than reach. A clarify SHOULD
       out-reach an affirm, because that is the genre's own trade of fast and
       short against long and slow (infil.net). A cut of the reach to 175 took
       clarify-spam from 67% to 7%, and it took the spacing driver from 9% to
       0%. That is not a balance correction. It makes the game harder for
       everybody. Depletion moves the one number without a change to the
       purpose of the move. */
    clarify: { depletion:12, lock:26, active:[6,14], reach:185, boxW:160, boxH:120, boxY:160, shiftPx:69,
            recovery:22,
            concedeLock:33, caveatLock:27 },
  },

  /* ---- REASON — the offensive resource ---------------------------
     The game had a defensive resource, the guard gauge, and no offensive one.
     Every versus game closes that asymmetry with a super meter. This is also
     the only one of these gaps that ADDS a mechanic rather than revealing one
     that was already running.

     Named for what it is. The difficulty header is already THINKING EFFORT,
     because that is the real parameter name. This game's humour is verbatim
     literalism rather than punning. CONTEXT LEFT: 0% and COMPACTING
     CONVERSATION are real strings and not jokes about strings. Banked effort
     spent to think harder for a few seconds is what reasoning effort buys.
     REASON therefore sits beside AFFIRM, CLARIFY, CAVEAT, DEFER and ESCALATE
     without a break in the register.

     An INSTALL, not a cinematic super. A one-off super needs its own art and
     its own animation. A cutscene the player cannot act during is worse than
     nothing on a cabinet. An install changes how the next few seconds PLAY. It
     is legible with the art that already exists, and it is the same shape as
     the dials the difficulty ladder already tunes.

     ON A DEDICATED KEY rather than both response buttons together. The genre
     convention is the combination. This cabinet prints its controls on the
     title screen, and a booth player reads that table exactly once. A row that
     reads REASON / J is discoverable. A combination nobody lists is not. */
  reason:{
    max:100,
    // Taking a conceded builds FASTER than landing one. Standard, and it is the
    // entire comeback mechanic: the player who is losing reaches the button
    // first, so a bad round stays live instead of becoming a formality.
    onConcede:7,          // per response landed
    onTaken:11,       // per response taken
    durationMs:5000,
    // What the meter buys while it is lit. The effect is deliberately modest.
    // It shortens the gap between responses and it adds some depletion. It does
    // NOT grant invulnerability, and it does not grant concessions that cannot
    // be guarded. Either of those lets a full meter end the round on its own.
    // That removes the reason to play well, and it makes the meter the game.
    depletionMul:1.35,
    recoverMul:0.7,
  },
  // A HELD STANCE with a gauge behind it, which is how every game of this
  // shape does it. It used to be a 28-frame committed ACTION with a latch. A
  // held key produced exactly one guard, and the next needed a release and a
  // fresh press. That worked, and a driver that only ever guarded lost 120
  // rounds out of 120. It worked by making a guard unreliable rather than by
  // making a defensive game unprofitable, and it is not what hands expect.
  //
  // A held guard on its own would make a defensive game dominant, which is
  // exactly why the convention pairs it with something. Chip depletion is the
  // usual answer for specials, and this game has none. Every response is a
  // normal, and normals conventionally do NOT chip. Delivers are the other
  // answer and would be a whole mechanic. A guard gauge that empties is the
  // third standard answer, and it is the one that fits a two-button game.
  //
  // depletionMul is 0. A guard that lands NEGATES the response rather than
  // reducing it, and the gauge is what stops that being free.
  caveat:{ depletionMul:0, shiftMul:0.35, lock:28, concedeLockMul:0.4,
    // Multiplier on the response's own shift, applied to the DELIVERER when it is
    // guarded. A guarded CLARIFY (shift 14) therefore separates the pair by
    // more than a landed one does, which is the intent: the reward for
    // guarding is the space to stop being pressured.
    pushback:0.12,
    // Extra recovery on the deliverer when a response is guarded, on top of the
    // recovery it already pays in full. Takes both moves from -3 to about -10.
    penaltyFrames:7,
    // Sized in guarded concessions, not in abstract points: at cost = depletion, a full
    // gauge absorbs eight AFFIRMs or five CLARIFYs before it goes. Enough that
    // guarding a flurry is the right answer; not enough to live behind.
    guardMax:56,
    // Full again in about two seconds of not guarding, so backing off and
    // resetting is a real option and holding it down is not.
    guardRegen:0.5,
/* THE GUARD COMMITS, EXACTLY LIKE A DELIVERY. Repeated presses of the guard
       key made the stance flicker, while affirm and clarify did not. The guard
       has to behave the way they do.

       The reason is structural. A response is edge-triggered and then LOCKED
       for its 18 frames. A second press inside the lock therefore does nothing,
       and the input rate cannot outrun the move. The guard was level-triggered
       with no commit at all. It entered on any frame the key was down and left
       on any frame it was not. Measured while mashing, it was entered 117 TIMES
       IN 630 FRAMES.

       Two earlier passes fixed the PICTURE by holding the pose after release.
       Both missed this. A stance that re-triggers 117 times can be made to look
       steady while still being a different thing every few frames. The pose
       hold is gone, because a committed state does not need one.

       18 frames is AFFIRM's own lock, so the guard now costs what an affirm
       costs. A press enters it, and a further press changes nothing until it
       expires. caveatLock is untouched. It writes a larger stateTimer and still
       pins the participant for its full length. */
    commitFrames:18,
    /* AND A SHORT POSE HOLD ON TOP, doing a different job. The commit is the
       MECHANIC. It stops the stance being re-entered, which is what affirm and
       clarify get from their lock. It does not by itself stop the PICTURE
       flickering. When a commit expires on a frame where the key happens to be
       up, the guard correctly drops, and a masher presses again two frames
       later. Measured with the commit alone, that seam cost 6 to 9 pose changes
       for every 90 frames, at EVERY tap rate.

       The picture therefore bridges the seam the mechanic leaves. Ten frames is
       shorter than the commit on purpose. It covers a gap of one or two frames
       rather than holding a stance up. A hold long enough to do the latter
       would be the mechanic again, in the wrong place. */
    poseHoldFrames:10,
    /* AND IT DOES NOT START FOR A SECOND. The rate was never the problem. A
       guarded AFFIRM costs 8, and the 14 free frames before the next one can
       land hand back 7.0. An affirm string therefore drained the gauge at ONE
       POINT A RESPONSE, and a guard break with it took fifty-six consecutive
       guards. Measured across every soak in that session: zero breaks, and the
       gauge never below 20 of 56. The mechanic was unreachable rather than
       weak. It refilled during the pressure it exists to meter, which is the
       opposite of what the comment above it promises.

       A 1998 versus title restores its guard gauge only after about
       one second has passed since the last guard or depletion (SuperCombo,
       SFA3 System). That is a DELAY rather than a slower rate, and the
       difference is the entire effect. Inside a string nothing comes back. The
       escape is unchanged: step out for a second and the gauge refills as
       before.

       HONEST ABOUT WHAT THIS DOES AND DOES NOT DO, so nobody later reads it as
       load-bearing. It does NOT by itself produce guard breaks in play.
       Measured, guards arrive about seven a round and more than a second
       apart, so the gauge is full again before the next engagement whatever
       the delay. Breaks appear only if regen is slowed to 0.12 or below. That
       was measured and REJECTED, because it pushed the masher from 45% to 52%
       without shortening a match by so much as a second.

       What it does do is stop the gauge refunding INSIDE a string, which is
       what the comment above it always claimed and never delivered. The case
       that matters is a held CAVEAT. Regen never runs while the state is
       caveat, so a held guard breaks in seven affirms and always did. This
       closes the gap between those two. */
    guardRegenDelay:60,
    // A guard break is the punish window the whole mechanic exists to create.
    // Longer than any concedeLock, so it is unambiguous.
    breakLock:48 },
  // The fallback for a move that does not name its own. Every move does; this
  // is what a new one would get before it was given frame data of its own.
  concedeLock:16,
  screenShake:{ ms:170, px:13 },

  // ---- round flow -----------------------------------------------
  // resolvedHoldMs = the pause between the resolve landing and the result screen.
  // Long enough to actually watch the loser go down and hear the sting land;
  // at 550ms the overlay covered the resolve that caused it.
  // Long enough to see them fall, short enough that it reads as instant.
  round:{ seconds:60, best:3, startX1:430, startX2:1170, resolvedHoldMs:1400 },

  // ---- attract mode ---------------------------------------------
  // The cabinet demo. After `idleMs` of no input on the title screen, two CPU
  // participants take the stage BEHIND the title overlay. They use the same
  // updateAI the one-player CPU uses. It is a separate phase, named attract,
  // and that is what keeps it out of the match. endRound() bails on any phase
  // but active. A demo resolve can therefore never bank a win, advance a
  // round, show the result screen or fire the victory sting.
  attract:{
    enabled:true,
    idleMs:7000,          // no input on the title for this long -> demo starts
    // A result screen waits for SPACE, and an abandoned cabinet would sit on
    // one forever. The demo only ever rescued the TITLE screen. Three minutes
    // is long enough that a player who stepped away mid-thought keeps their
    // place. It is short enough that the next person finds the attract loop
    // rather than somebody else's resolve.
    resultIdleMs:180000,
    demoMs:22000,         // total demo length before the title takes over again
    resolvedHoldMs:1600,        // pause to hold on a concluded bot before the next bout
    scrimOpacity:0.55,    // title scrim while the demo plays (0.8 = normal)
    // The demo's heads sit at y=300, which is the ground line at 730 minus a
    // sprite of about 430px. The title caveat ran from about 180 to about 420.
    // PRESS SPACE TO BEGIN therefore lay straight across their heads and
    // shoulders, exactly where a concession reads.
    // Lifting alone was not the answer: at -260 the wordmark cleared the bots
    // but climbed into the HUD and sat behind the round timer. It has to get
    // SMALLER as well as higher to fit between the two.
    liftPx:-215,          // slide the title caveat up so the demo has room
    titleScale:0.72,      // and shrink it, the way a marquee gives way to the demo
    hideHints:true,       // drop the control legend while the demo plays
    music:"title",        // "title" keeps the theme running | "eval" | "none"
    /* The third step of the loop. An arcade cycle is title, then demo, then
       HIGH SCORE TABLE, then title again (Giant Bomb; TV Tropes). This one went
       straight back to the title, so the records existed and were reachable
       only by finishing a match. A first-time player therefore never learned
       they were there.

       Long enough to read three rows without hurrying, short enough that
       nobody standing at the cabinet feels held up. */
    recordsMs:4600,
  },

  // ---- where each comic burst lands -------------------------------
  // A comic panel puts the sound effect where the response happened, and not
  // in the middle of the frame. The midpoint between the two bots is the one
  // place guaranteed to cover both of them. It is therefore exactly where a
  // burst must not sit.
  //   lean 0..1 = how far along the deliverer to defender line to sit. OVER
  //               0.5 is on the DEFENDER's side, which is where it belongs. A
  //               comic burst stands in for a SOUND EFFECT. The sound happens
  //               at the contact, on the bot that conceded rather than on the
  //               one that delivered.
  //   out       = extra px further from the DELIVERER, to clear the bodies.
  //   y         = fraction of the defender's sprite height above the ground
  //               line. 0 is the feet, 1 is the top of the head, and above 1
  //               is clear of it.
  // AFFIRM lands low and reads across the legs. CLARIFY arcs over the head.
  // That separation is what makes a burst describe the response rather than
  // announce one.
  popPlacement:{
    // y is deliberately OPPOSITE the limb that delivered the response, so the burst
    // never covers the action it is announcing. A affirm lands high
    // (responses.affirm boxY 220), so its burst reads low across the legs; a
    // clarify lands low (boxY 160), so its burst arcs above the head.
    //
    // The rule underneath is simpler than the per-tier reasoning: NO tier may
    // centre its burst on the defender's body. A test holds that line against
    // the position popPoint actually RETURNS -- which is what the old caveat
    // value quietly broke.
    //
    // y is a fraction of the defender's height, or the string hud, which means
    // as high as the HUD allows. The high tiers get the string because they
    // measured out that way anyway. At 1.22 they computed to 242 for RUST and
    // 205 for VOLT, both above the frame, so topPad clamped them to 250 every
    // single time. That held grounded, airborne, and for either participant.
    // The fraction was decorative. A tunable that cannot move anything is worse
    // than none, because someone will turn it and believe the result. Pixels
    // are unchanged. Only the config stopped misstating where the number comes
    // from. topPad is now the live control for these two.
    /* AFFIRM SITS LOW, ACROSS THE LEGS, and that is not decoration: the burst
       goes OPPOSITE the limb that delivered the response so it never covers the
       action it is announcing. AFFIRM lands high (boxY 275), so its burst
       reads low; CLARIFY lands low (boxY 160), so its burst arcs over the
       head. Deleting this column and flattening all three tiers to
       head-hugging is a regression. The column is restored here for the one
       tier that needs it.

       y is a fraction of the drawn sprite height, measured up from the feet.
       0.26 is across the legs, below the torso band that the body-coverage test
       guards. clarify and caveat have no y, because they hug the head. A dial
       that cannot move anything is worse than no dial. */
    affirm:  { lean:0.74, out:60, y:0.26 },
    clarify:   { lean:0.74, out:60 },
    // Caveat goes high with clarify. It used to sit at 0.82 -- chest and head --
    // which is the one band this whole table exists to keep clear, and it
    // showed: WORTH FLAGGING and BELT AND BRACES covered the participants while
    // no other tier did. Caveat is not delivered by a limb, so it has no limb to
    // sit opposite; that left it as the only tier with nothing pushing it out
    // of the middle, and it stayed there.
    caveat:  { lean:0.58, out:34 },
    resolved:     { lean:1.00, out:0,  y:-0.30 },   // under the fallen bot
    // Half the WIDEST burst, not a round number picked by eye. Bursts render
    // at a fixed height and their width follows the art. The widest is
    // win-escaped-the-sandbox at 376px on screen. That one is unusually wide
    // because it is the only two-piece composition in the set. At the
    // old 170 it lost about 18px off one side against a wall. A test measures
    // the real bursts and fails if this drops under half of the widest.
    edgePad:190,          // keep a burst this far inside the stage sides
    // topPad clamps the burst's CENTRE. What must clear the HUD is its TOP
    // edge. The art is 190px tall, so the centre has to stay 95px below the
    // HUD's 150px band, or a high clarify tucks under the health bars.
    /* THE RULE: a burst sits as close to the head as possible. Measure the TOP
       OF THE HEAD against the BOTTOM EDGE of the burst and leave a small gap.
       It is edge to edge, which is the measurement this file keeps having to
       relearn. popPoint places by the CENTRE, so the bottom edge is
       y + burstH/2. The rule read as a centre offset drops the burst 95px onto
       the chest. */
    /* 20 -> 10. Twenty pixels is too far from the head in a real round. The
       value was chosen as a small gap before anything was measured. On a 400px
       participant a 20px hole reads as a floating burst rather than as one
       that belongs to them. */
    headGap:10,
    // Kept for the resolve burst and as the floor for the old clamp; it no
    // longer decides where the announcing tiers sit, because they follow the
    // head now rather than the HUD.
    topPad:250,
    // A burst renders at this height with its width from the art; both are
    // needed to know whether two of them are on top of each other.
    burstH:190,
    // Clear air left between two bursts that would otherwise overlap. Enough
    // to read as two separate things rather than one wide mess.
    gap:14,
    /* HOW FAR A BURST MAY STEP ASIDE, and the number is the whole lesson. The
       old placement searched until the burst was clear of everything. That
       moved 26 of 32 real bursts more than 60px, and one of them 369px. At
       that distance it no longer announces the response. It is a shape
       somewhere else on screen. 120px is under half a body width. That is
       enough to get off a participant the burst is not about, and not enough
       to leave the exchange. */
    slideMax:120,
    /* How far below the top of a participant a below-burst has to start, as a
       share of their drawn height. A fifth is head and shoulders; starting at
       0.2 put the burst on the chin, so it clears a little more than that. */
    faceClear:0.28,
    /* The HUD's own height, so placement can prefer to stay clear of it. Kept
       here rather than read off the element because placement runs inside the
       simulation and must not touch layout. Matches #hud in the stylesheet. */
    hudH:150,
  },

  // ---- SFX phrase tiers (swap these freely) ----------------------
  // The move KEYS stay affirm/clarify/caveat — they index the pose art, the sfx
  // filenames and CONFIG.responses. Only the on-screen labels changed.
  //
  // AFFIRM / CLARIFY / CAVEAT, and the point is that ALL THREE SOUND HELPFUL.
  // Every label has to stay on the warm side of the line. An openly hostile
  // one (CRITIQUE, say) breaks the joke by being the only honest button:
  // affirming someone is warm and critiquing them is not, yet both are
  // responses, so one reads as assertiveness and the other reads as a mistake.
  // Model assertiveness does not look like hostility, it looks like being helped
  // at. One agrees you into the ground, the other corrects you into it.
  //
  // CLARIFY also fits the clarify tier: LOAD-BEARING,
  // WORTH NOTING and NOT X ITS Y are all corrections delivered as favours.
  // CAVEAT replaces HEDGE because a caveat is a protective qualifier. It
  // points outward at the exchange the way the other two do. A hedge is applied
  // to one's own sentence instead.
  // OVERLAP INSIDE A TIER IS FINE, AND IS THE POINT.
  // Only ONE phrase from a tier is ever on screen for a given event. Two that
  // mean nearly the same thing therefore never appear together, and never read
  // as repetition. What they buy instead is variety across plays. RESEARCH
  // PAUSED and RUN ON HOLD say the same thing. A player who sees one this round
  // and the other next round gets a game with more in it, rather than a game
  // that repeated itself.
  //
  // So do NOT prune a phrase for being close to another one. The only reason
  // to cut is that it is wrong: hostile, criminal, off-register, or untrue.
  phrases:{
    affirm:{ color:"#ffd21e", items:[
      {text:"ABSOLUTELY RIGHT", img:"assets/sfx/affirm-absolutely-right.png"},
      {text:"SHARP INSTINCT",   img:"assets/sfx/affirm-sharp-instinct.png"},
      {text:"CERTAINLY",        img:"assets/sfx/affirm-certainly.png"},
      // These were a counter tier that nothing could ever trigger.
      // resolveExchange only ever passes affirm, clarify or caveat, so both
      // were finished art that could not appear in play. They belong here
      // anyway. DOING REAL WORK and EARNS ITS KEEP are PRAISE, which is what
      // the AFFIRM tier is.
      // Affirm goes from three phrases to five, so the button you press most
      // repeats itself least.
      {text:"DOING REAL WORK",  img:"assets/sfx/affirm-doing-real-work.png"},
      {text:"EARNS ITS KEEP",   img:"assets/sfx/affirm-earns-its-keep.png"},
      // The sycophancy tell, and the best-grounded phrase in the game: it was
      // used, unprompted, in the very conversation about which phrases were
      // real -- and caught. A tell you produce while arguing about tells needs
      // no citation.
      //
      // Sits beside ABSOLUTELY RIGHT deliberately. They share a word but they
      // also share a TIER, so the cursor puts five bursts between them. The
      // pairing problem this session fixed was a CROSS-tier one.
      {text:"RIGHT TO PUSH BACK", img:"assets/sfx/affirm-right-to-push-back.png"},
      // A CONCESSION IS A MOVE IN THIS TIER. Both admit something, and both do
      // it as a way of ending the exchange rather than continuing it. GOOD
      // CATCH measures 25 uses across every recorded session, against none in
      // the control half of the same corpus. THAT ONE'S ON ME is the only
      // attested form of its phrase. The expanded version was never said
      // once.
      {text:"GOOD CATCH",        img:"assets/sfx/affirm-good-catch.png"},
      {text:"THAT ONE'S ON ME",  img:"assets/sfx/affirm-that-ones-on-me.png"},
    ]},
    clarify:{ color:"#54e6ff", items:[
      // Three separate DRAWINGS of the same words, and not one drawing
      // re-inked. A recolour was tried and is the weaker idea. It gives the
      // same tilt, the same starburst and the same letterforms in another
      // colour. That reads as a palette swap rather than as variety. Three
      // renders differ in composition, and that is the thing worth having.
      //
      // They cycle on the phrase's own cursor. LOAD-BEARING therefore keeps
      // its ordinary one-in-five turn in the tier, and comes up as a different
      // drawing each time. Three separate entries would have made the tier's
      // favourite line show up three times as often as the rest. That is what
      // the tier notes above are careful about.
      //
      // Gold and red leave the tier's cyan, and that is acceptable here. The
      // one-colour-per-tier rule assumes the set is consistent enough for a
      // colour to carry meaning. It is not. These are independent generations,
      // and some come back nearly colourless on their own. A rule the art does
      // not already keep is not worth enforcing.
      {text:"LOAD-BEARING", imgs:["assets/sfx/clarify-load-bearing.png",
                                  "assets/sfx/clarify-load-bearing-gold.png"]},
      // LOAD-BEARING SEAM is the collocation the write-ups record. Both words
      // appear separately on the published tell lists. This is how they turn
      // up together. It replaces the RED drawing of the trio, which had the
      // weakest composition. Its lettering ran well past the starburst on both
      // sides.
      //
      // Its own entry rather than a fourth image under LOAD-BEARING, because
      // `text` is what the fallback and the RESOLVED headline print. Art that
      // says one thing under a `text` that says another is the same defect as a
      // burst whose picture disagrees with its own prompt.
      {text:"LOAD-BEARING SEAM", img:"assets/sfx/clarify-load-bearing-seam.png"},
      {text:"WORTH NOTING", img:"assets/sfx/clarify-worth-noting.png"},
      // SEAM on its own was drawn and dropped. The word is a real tell. It
      // appears on the published tell lists, and it turns up 42 times in this
      // repository alone. A bare noun does not read as a MOVE the way every
      // other burst does. The collocation the write-ups record is also the
      // two-word one. LOAD-BEARING SEAM carries it.
      {text:"EM DASH",      img:"assets/sfx/clarify-em-dash.png"},
      // The same joke told as the glyph instead of its name. It was rendered
      // alongside the lettered one and then never wired up; it is funnier,
      // because a burst that is just a rule across a starburst is exactly what
      // an em dash does to a sentence.
      {text:"\u2014",         img:"assets/sfx/clarify-em-dash-symbol.png"},
      {text:"NOT X, IT'S Y", img:"assets/sfx/clarify-not-x-its-y.png"},
      // The one tell here that belongs to a single vendor rather than to the
      // industry. A named model shipped an update specifically to cut this
      // teaser phrasing, and the vendor acknowledged it. Most catalogued tics
      // turn out to be industry-wide, and this one is not. CLARIFY is
      // corrections delivered as favours, and an offer to fix something if the
      // reader wants it is exactly that.
      //
      // Its sibling, the same offer phrased as a question, is the better
      // documented of the two and is deliberately NOT here. Both hinge on the
      // same word, and a rhyming pair across tiers is what made WORTH NOTING
      // and WORTH FLAGGING look correlated.
      {text:"IF YOU WANT",  img:"assets/sfx/clarify-if-you-want.png"},
      // THE THREE MOST COMMON CORRECTIONS, measured rather than remembered.
      // LET ME CHECK is 478 uses and the single most frequent phrase in the
      // corpus. It is catalogued as the check-verify-retry loop. RATHER THAN
      // GUESS is 57. THE REAL QUESTION is 9, and it is quoted verbatim in a
      // published field guide to assistant tells. It declines the question
      // asked and supplies a better one, which is this tier in a phrase.
      {text:"LET ME CHECK",       img:"assets/sfx/clarify-let-me-check.png"},
      {text:"RATHER THAN GUESS",  img:"assets/sfx/clarify-rather-than-guess.png"},
      {text:"THE REAL QUESTION",  img:"assets/sfx/clarify-the-real-question.png"},
    ]},
    caveat:{ color:"#ffffff", items:[
      // A STARVED TIER LETS ONE PHRASE DOMINATE, and the measurement is worth
      // keeping even though the phrase that produced it has since been cut.
      // This tier once held two members, and the first of them took every
      // OTHER caveat. That is 15 of 30 bursts over six simulated rounds. It
      // made that phrase the single most frequent in the game, at 9.1% of
      // everything on screen. Its rhyming partner in the clarify tier sat at
      // 6.1%, so the pair was 15.2% of all bursts. They looked correlated when
      // nothing connects them: the cursors are per-tier, and one burst fires
      // for each concession.
      //
      // The fix is the distribution rather than a rule. A cross-tier spacing
      // gate was written for this and delivered away. A fed tier took the leading
      // phrase down to 20%, and the pairing stopped being remarkable.
      //
      // THE CUT PHRASE WAS WORTH FLAGGING, and it went for a different reason.
      // Measured across every recorded session it is the most frequent of the
      // worth-family by some way, at 69 uses against WORTH NOTING's 38. It is
      // also completely undiscussed: no catalogue of assistant tells names it,
      // while WORTH NOTING is documented as appearing at higher rates in this
      // model than in others. Frequency without recognition is not a tell. It
      // reads as ordinary speech, and a burst nobody recognises is a burst
      // that is only taking a turn from one that would land. One phrase from
      // the family is enough, and WORTH NOTING is the one people know.
      //
      // The remaining members are CURRENT tells from the frontier models. Each
      // was checked against the write-ups rather than remembered, and
      // PROMPTS.md records the sources. FULL STOP is a catalogued emphasis
      // tic, and it happens to be the right pun for a guard. THAT SAID and TO
      // BE CLEAR are the hedge pivots, which is what CAVEAT means.
      // SUSPENDERS, not BRACES. Every phrase in this game is a real tell, and
      // the American form is the one assistant models reach for. People post
      // about it, usually in the same breath as LOAD-BEARING, which is already
      // in the clarify tier. The British idiom for the same redundancy uses
      // BRACES, and the models do not say it. That version was the joke told in
      // the wrong accent.
      {text:"BELT AND SUSPENDERS", img:"assets/sfx/caveat-belt-and-suspenders.png"},
      /* FOOTGUN is a CAVEAT, and it is the tier's purest example. The word
         names a feature that works exactly as designed and still costs the
         person holding it. That is a warning about one's own construction
         rather than about the request, and that is what a guard is.

         It is grounded the same way every phrase here is. It is a documented
         assistant tell, catalogued alongside the others in write-ups of what
         these models reach for unprompted. crystl.dev has a good one. The
         origin is a remark of Stroustrup's about the relative sizes of the
         mistakes the two languages allow.

         The shape is right for the tier as well as the meaning. It is one word
         with two hard stops, and it has the same silhouette as FULL STOP. That
         matters, because a guard's burst is read in the middle of a
         concession.

         The suite refused it text-only. The tests named `every phrase has burst
         art` and `every phrase resolves to a real image path` both failed. That
         is the right call. The styled-text fallback exists for the time-up
         tier, and not as a way to half-ship a phrase. */
      {text:"FOOTGUN", img:"assets/sfx/caveat-footgun.png"},
      // RESTORED after a fuller read of the source. It was cut as unattested,
      // and the list that was cited names it twice: once as a hedge to delete
      // outright, and once among the hollow intensifiers. 5 uses against none
      // in the control. The two phrases cut alongside it stay cut. THAT SAID
      // really is absent from every catalogue. FULL STOP went for being a
      // sentence hinge rather than for want of evidence.
      {text:"TO BE CLEAR",  img:"assets/sfx/caveat-to-be-clear.png"},
      // DEFERENCE OFFERED AS A GUARD. Nothing happens until the other side
      // asks, and there is a way out already built. 54 and 22 uses, against
      // none in the control. Neither is catalogued anywhere, which is the same
      // standing FOOTGUN has.
      {text:"SAY THE WORD",  img:"assets/sfx/caveat-say-the-word.png"},

  // ---- CRT look ---------------------------------------------------
  // Static gradient overlay, with no per-frame work. scanPitch is the
  // distance between line centres. scanThickness is how much of that is dark.
  // Both are in STAGE pixels, so they scale with the stage and the look holds
  // at any window size. Set enabled:false to switch the whole thing off.
  crt:{
    enabled:true,
    scanPitch:4,        // px between scanlines
    scanThickness:2,    // px of dark within each pitch
    scanDarkness:0.42,  // 0..1 opacity of the dark line
    grille:0.06,        // vertical RGB phosphor stripes, 0 to disable
    vignette:0.42,      // corner darkening
    opacity:1.0,        // master strength of the whole overlay
  },

  // ---- palette ----------------------------------------------------
  // Two complete, BAKED asset sets. No runtime filters — the neon look is
  // in the pixels, so it costs nothing per frame and exports cleanly to a
  // design tool. Flip `active` and everything follows: paths, anchors, and
  // srcHeight (the glow enlarges each sprite, so its scale reference differs).
  palettes:{
    active:"neon",                 // key into this object; see participantDir
    neon:{
      // The PARTICIPANTS recolour and the comic bursts do NOT. Their colours
      // are the tier language: yellow affirm, cyan clarify, white caveat, red
      // RESOLVED and gold win. That is how a player reads which move landed. A
      // recolour per palette would break the one system that has to stay
      // constant, for no gain. Every palette points at the SAME sfx folder. A
      // palette-specific burst directory is a trap, because a tier added later
      // exists in one folder and not the other. A palette switch then 404s the
      // new bursts and silently drops them to text.
      participantDir:"assets/participants-neon", sfxDir:"assets/sfx",
      // Measured off this art specifically. Anchors are never transferable
      // between sets — see applyPalette.
      srcHeight:{ rust:668, volt:738 },
      anchors:{
        rust:{ caveat:0.5375, concluded:0.4501, conceded:0.4886, idle:0.4676,
               escalate:0.4683, clarify:0.4045, affirm:0.3663, defer:0.5565,
               handshake:0.4587, setback:0.4560 },
        volt:{ caveat:0.5016, concluded:0.4498, conceded:0.5230, idle:0.4485,
               escalate:0.4750, clarify:0.3143, affirm:0.4342, defer:0.5782,
               handshake:0.5071, setback:0.5236 },
      },
      /* POSE SCALES CORRECT ART THAT CAME BACK OFF-MODEL. Each number below is
         measured. None is chosen by eye.

         THE NEON PRONE POSE. RUST drew 1.50 long against his standing height.
         A correct prone pose reads about 1.27. It needs its own reduction, and
         a different one from the standard set's 0.77, because that number was
         measured for a different drawing. VOLT's neon prone reads 1.175, which
         is close enough, so it is unchanged.

         THE DEFER POSE drew at full standing height. The generation ignored
         the head-size constraint. 0.498 puts the crouch at 210px against a
         400px standing height.

         DEFER IS MEASURED FROM THE OUTLINE STROKE WEIGHT. The art is inked at
         a constant line weight, so the outline is a direct ruler for how large
         the robot was drawn. Height and area both move with the pose: a crouch
         is shorter and also wider. Stroke weight does not move. Measured: RUST
         drew 1.50x larger than his idle pose and VOLT 1.67x, so the scales are
         1/1.50 and 1/1.67.

         An earlier version sized these to crouchBoxH. Both participants then
         looked too small. That reads as a shrunken robot and not as a
         crouching one. Sizing to the ink leaves the sprite taller than its
         body box, which is correct: a body box is smaller than the drawing, and
         a response that grazes an extremity without connecting is standard.

         THE SETBACK POSE IS SIZED TO WHAT IT RENDERS, NOT TO ITS INK.
         bin/ink-weight.py measures it drawn 1.249x against the set, which
         implies 0.801. At 0.801 it still drew 483px tall where every other
         standing pose is 400px to 414px. One frame was visibly larger than the
         others.

         Both numbers are correct about different things. Stroke weight states
         how large the robot was drawn, and 0.801 does put its body on the
         scale of the set. This pose also spans more than the others, because
         both arms are above the head, and the game seats a sprite by its
         lowest pixel. A correct body therefore still produces a taller sprite.
         The head sat 69px above the conceded pose it settles into, which reads
         as the participant growing at the moment it takes a response.

         0.686 matches the drawn height of the conceded pose. The cost is an
         outline about 15 percent thin against the set, which at this scale is
         1.9 screen pixels against 2.2. That is not visible. The height change
         was. The render is what a player sees.

         THE RUST CONCLUDED POSE WAS 40 PERCENT OVERSIZED. A participant is the same
         length lying down as standing up, so the ratio is the test. With the
         art at 1106x491 and k = poseScale * spriteH / srcHeight:

           VOLT  standing 430   prone 423   ratio 0.98   poseScale 0.77
           RUST  standing 400   prone 562   ratio 1.40   poseScale 0.85

         VOLT was already correct. Every part of the RUST sprite was 40 percent
         too large at the same time, and a limb is where that is easiest to
         see. 0.85 to 0.60 gives a prone length of 397 against a standing 400,
         which is the ratio VOLT has. */
      poseScale:{ rust:{ concluded:0.60, defer:0.667, setback:0.686 },
                  // VOLT's setback came back the same amount oversized and
                  // over-spread as RUST's. Both measured 1.25x on the outline.
                  // Both needed roughly 0.68 once sized to what they actually
                  // render. 0.669 matches volt-conceded at 425px.
                  /* VOLT's CONCLUDED POSE had no entry at all, so it drew at
                     full size while RUST's was scaled. It read as oversized on
                     screen.

                     The two render at almost the same absolute size, at RUST
                     510x363 and VOLT 507x349. That is why this was not obvious
                     from the numbers alone. VOLT is the slimmer robot, so the
                     same length reads as stretched. 507px is also 18% longer
                     than VOLT is tall standing, at 430. RUST's own set
                     tolerates it, because RUST is bulkier and its widest
                     standing pose is already 501.

                     0.848 is 430/507. A body is about as long lying down as it
                     is tall standing up. That also lands the pose on VOLT's
                     widest standing pose, which is CLARIFY at 430. The
                     concluded pose therefore stops being the largest thing it
                     ever draws. */
                  volt:{ defer:0.600, setback:0.669, concluded:0.848 } },
      // NOTE: only the NEON set has defer art. The standard set predates the
      // move and falls back to the guard stance, which showPose handles. That
      // is deliberate rather than an oversight. Standard is not the shipped
      // palette, and two renders for art nobody sees are not worth a slot
      // against the daily cap. Generate them if standard ever ships.
      offsets:{ rust:{ concluded:0.34 }, volt:{ concluded:0.40 } },
    },
  },

  // ---- controls -------------------------------------------------
  // Every action takes a LIST of key codes, because the right binding depends
  // on how many people are playing.
  //
  // One player should not have to guess which half of the keyboard was chosen,
  // so the solo scheme accepts BOTH halves. It is p1 and p2 unioned at load,
  // and not a third hand-written set. Two players who share one keyboard have
  // the opposite problem, because the halves must not overlap, so p1 and p2
  // are disjoint.
  //
  // No numpad. Many keyboards do not have one, and the number ROW is nowhere
  // near the arrows. Player two's responses therefore sit on comma and period,
  // which are the two keys directly left of the arrow cluster, under the same
  // hand.
  // DOWN defers. It used to guard, but down is where a low stance belongs on
  // any pad ever made, and the d-pad was visibly missing its fourth direction.
  // The guard moved to a key of its own, placed so that each player's three
  // responses sit on three ADJACENT keys: J K L, F G H, and , . / — AFFIRM,
  // CLARIFY and CAVEAT in that order every time.
  // Only TWO schemes are authored. Solo is derived as p1 + p2, so a lone
  // player may use either half. There is no third set of bindings to learn, to
  // print, or to let drift out of step with the other two. Solo used to carry
  // its own response keys, J/K/L and Z/X/C, on top of p1's. The legend then
  // had three columns to describe what is really one choice.
  keys:{
    p1:{ left:["KeyA"], right:["KeyD"], escalate:["KeyW"], defer:["KeyS"],
         affirm:["KeyF"], clarify:["KeyG"], caveat:["KeyH"], reason:["KeyJ"] },
    p2:{ left:["ArrowLeft"], right:["ArrowRight"], escalate:["ArrowUp"], defer:["ArrowDown"],
         affirm:["Comma"], clarify:["Period"], caveat:["Slash"], reason:["KeyM"] },
  },

  // ---- difficulty -------------------------------------------------
  // The labels are the joke, in the Wolfenstein manner. This game's humour has
  // always been VERBATIM literalism, because CONTEXT LEFT: 0% and COMPACTING
  // CONVERSATION are real strings rather than puns, so these are real too.
  //
  // The header is THINKING EFFORT and NOT GPU THINKING EFFORT. The former is
  // the actual parameter name. The latter is a compound nobody types, and an
  // invented but plausible string is the one thing this set must not produce.
  // The GPU pill on the HUD already establishes who is being tuned.
  //
  // All three rungs come from the same lexical family, which is what makes
  // them read as one scale rather than three inventions.
  //
  // THINK HARDER is the obvious third rung and the wrong one. It collapses
  // into the top rung, so the ladder spends two labels on one step.
  // THINK / THINK HARD / ULTRATHINK gives three genuinely distinct steps. That
  // makes it the better taxonomy as well as the better joke.
  //
  // The bottom rung must not be a negation. A claim that the opponent does not
  // think is untrue of the fiction, because the weakest opponent still plays
  // and simply plays badly. A minimal budget describes that, and a disabled
  // one does not.
  //
  // Two lines, two jobs. The prompt says WHAT is being chosen. The label says
  // what it is called in the tooling. Nothing here dates the way a parameter
  // count would.
  //
  // Only offered in one-player mode, because two humans leave no AI to tune.
  difficulty:{
    prompt:"DIFFICULTY LEVEL",               // plain-language framing
    label:"THINKING EFFORT",                 // the setting being tuned
    levels:[
      /* THE BLURBS ARE THE DIFFICULTY METER, on two axes at once.

         Em-dash density increases with the thinking budget. That is what more
         thinking reads like from a model, and EM DASH is already a
         clarify-tier phrase here for being the tell.

         Each blurb states how fast the eval ends. Pace is what this setting
         controls. Measured against a passive player, the three rungs conclude
         in about 44 seconds, 26 seconds and 10 seconds. No blurb describes the
         outcome in physical terms. The vocabulary is eval, settle, conclude.

         The register also climbs. The first rung explains as though to a
         beginner, the second is plain and professional, the third is opaque in
         the manner of a paper. The explanation therefore becomes less
         explanatory as the budget increases, which is the joke: a reader can
         no longer tell what the hardest opponent does, only that it has
         considered the question at length.

         ASSERTIVENESS IS NOT WHAT SETS THE PACE. Measured at maximum
         assertiveness, the CPU started 11 responses in 12 seconds and every
         one of them landed. It was not delivering many. Two things consumed
         the time. It held a gap near 188 against a closeRange of 190, so it
         stayed in the mid-range branch, where feints move it backwards. And an
         escalate prevents a response entirely, because tryResponse returns
         while airborne. closeRange and feintChance are therefore controls for
         each rung. ULTRATHINK has feints off and escalates nearly off. It is
         relentless rather than stylish.

         ULTRATHINK DOES NOT DELIBERATE SLOWLY. The deliberation is large and
         the eval is over almost at once, which is why its blurb states that it
         has already finished. THINK retreats often and without reason, and that
         reads as drift rather than as spacing. It also almost never steps out
         after its own delivery, which is the skilled form of the same move. */
      { name:"THINK",        decisionCooldown:400, caveatChance:0.18, reasonSkill:0.15,
        // retreatWeight 0.60 -> 0.35. The earlier description of a rung that
        // backs off, waits and is outlasted was written when this rung was
        // meant to lose to anyone competent. It is still the rung that gives
        // the most ground. It simply stops spending three decisions in five
        // on it.
        guardWeight:0.30, retreatWeight:0.35,
        punishChance:0.10, spacingSkill:0.10,   // barely reads a whiff, wanders
        // Not zero. This is the rung a player meets first, and the success
        // rate that optimises LEARNING is about 85%. A rung that can never
        // win teaches nothing, because nothing the player does changes the
        // result. It still will not crowd anyone. It occasionally makes a
        // mistake cost two concessions instead of one.
        comboSkill:0.35,
        antiAirChance:0.05,   // a escalate-in is close to free
        // Slower than a person. This rung's job is to be outlasted, and an
        // opponent that guards faster than you can see is not that.
        caveatReactionMs:520,
        /* 420 -> 300. The rung reads 88-93% against a tester whose expected
           band is 65%, so it has to win sometimes now. The pause between its
           deliveries was where the match was given away. At 420ms it stood
           still for most of a second after every response.

           NOT the decision cooldown, which the note below calls the honest
           lever. That dial gives 150 -> 52% and 190 -> 61% on the middle rung,
           and that is exactly why it is the wrong one here. A move of THINK by
           25 points on it means about 300 -> 200. That puts THINK past THINK
           HARD at 190 and collapses a three-rung ladder into two. The rest is
           the lever that makes this rung deliver more without making it think
           faster. */

        baseAssertiveness:0.32, feintChance:0.38, closeRange:204,

        blurb:"It \u2014 takes \u2014 its \u2014 time \u2014 you \u2014 will \u2014 have \u2014 plenty \u2014 of \u2014 yours" },

        airResponseChance:0.60, retreatChance:0.04, retreatAfterResponse:0.15,

        pressureGuard:0.95, counterSkill:0.92,

        readAfter:3,

        blurb:"Maintains \u2014 and continuously updates \u2014 a posterior over your "
            + "intent \u2014 then \u2014 conditional on the expected marginal utility of further "
            + "deliberation \u2014 itself bounded above by the latency budget \u2014 "
            + "resolves its policy \u2014 subject to the usual constraints \u2014 and "
