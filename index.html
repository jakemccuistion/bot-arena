<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<!-- FULL SCREEN ON A PHONE IS ADD-TO-HOME-SCREEN, not the Fullscreen API.
     Safari on iPhone does not implement requestFullscreen for anything but a
     video element, so a fullscreen button there is a control that does
     nothing. Launched from the home screen these tags run it with no browser
     chrome at all, which is the real thing rather than an approximation of it.
     Harmless everywhere else: an engine that does not use them ignores them. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BOT ARENA">
<meta name="theme-color" content="#0a0510">
<title>BOT ARENA</title>
<style>
/* ============================================================ *
 * BOT ARENA — layout is fixed 16:9 internal coords, scaled by a
 * single CSS transform. Nothing inside the stage ever reflows.
 * ============================================================ */
:root{
  --stage-w:1600; --stage-h:900;
  --ink:#0a0510;
  /* Health reads in the game's OWN colours, not a traffic light. Green was the
     only green in the build and belonged to nothing; these three are the comic
     tiers — cyan is the clarify burst, gold is the win burst, red is the RESOLVED burst.
     The last one earns its place twice over: the bar turns the exact colour of
     the thing about to happen to you. --hud-chip is the depletion trail. */
  --hud-hi:#2fe6ff; --hud-mid:#ffd93a; --hud-lo:#ff3b30;
  --hud-chip:#fff2fb;
}
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;background:var(--ink);overflow:hidden;
  font-family:"Arial Black",Impact,system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;touch-action:none;overscroll-behavior:none;
}
img{-webkit-user-drag:none;user-drag:none;pointer-events:none}

/* No grid centering here. place-items:center centres the stage by its LAYOUT
   box (1600x900) and only THEN is the transform applied, so on any window
   shorter than 900px the browser clamped the overflow to the top edge and the
   scaled stage hung 29px off the bottom — the ground line and the cabinet
   buttons were being cut off. fit() now computes the offset itself. */
#viewport{position:fixed;inset:0;overflow:hidden}

/* The stage: fixed internal pixel size, scaled via transform. */
#stage{
  position:absolute;left:0;top:0;
  /* NO FONT INFLATION. Safari on a phone enlarges text it judges too small for
     the viewport, per block. Every measurement in this design is against a
     fixed 1600x900 stage that is then scaled to fit, so text growing
     independently of that scale makes a block taller than the layout it was
     measured for -- which is why a description can be taller here than in any
     desktop engine. The design is already scaled to the screen; it does not
     want a second, uninvited scale on the type alone. */
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
  width:1600px;height:900px;
  transform-origin:0 0;      /* fit() supplies the centring translate */
  background:#120a1c;
  overflow:hidden;
  pointer-events:none;
}

/* The IRIS -- a circular wipe with a soft edge, and the cover for a stage
   change: the swap happens while the screen is shut, so the arena is never
   seen cutting.

   This is a full-screen BLACK panel with a radial-gradient MASK cut
   through it, and the only thing that animates is the mask's radius. It is
   deliberately not the obvious construction, which was tried first and
   measured: a transparent disc carrying `box-shadow: 0 0 90px 3000px #000`,
   scaled with a transform. That reads as correct and is ruinous -- a
   3000px-spread, 90px-blurred shadow has to be re-rasterised at every scale
   step, and a bare iris with an EMPTY callback dropped twelve frames with a
   266ms worst frame. The hitch people saw mid-transition was that, not the
   work being done behind the black.

   --iris-r is registered with @property so it has a type. An unregistered
   custom property is just a string and does not interpolate at all: the
   transition would snap from one radius to the other and there would be no
   animation to be smooth. */
@property --iris-r { syntax:"<length>"; inherits:false; initial-value:0px }
#iris{position:absolute;inset:0;z-index:60;pointer-events:none;background:#000;
  --iris-r:0px;
  -webkit-mask-image:radial-gradient(circle at 50% 50%,
      #0000 0, #0000 var(--iris-r), #000 calc(var(--iris-r) + var(--iris-soft)));
  mask-image:radial-gradient(circle at 50% 50%,
      #0000 0, #0000 var(--iris-r), #000 calc(var(--iris-r) + var(--iris-soft)));
  transition:--iris-r var(--iris-ms) cubic-bezier(.55,0,.45,1);
  visibility:hidden}
#iris.on{visibility:visible}

/* ---------- layer 1: backdrop ---------- */
#backdrop{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
#backdrop-fallback{position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 70% 50% at 50% 62%, #c0339b55, transparent 70%),
    linear-gradient(#2a1140 0%, #43155e 55%, #1a0a26 100%);}
/* ground line, drawn so the stage reads correctly with no art */
#ground{position:absolute;left:0;right:0;top:calc(900px - var(--groundY));
  height:var(--groundY);z-index:2;
  background:linear-gradient(#00000000,#00000088);
  border-top:3px solid #ffffff22}

/* A contact shadow lives in its OWN layer rather than inside the participant,
   because the participant's node is translated upward to escalate and a shadow
   parented to it would climb along — which is precisely the thing a shadow
   must not do. Sitting on the floor plane, it is what stops the bots reading
   as stickers hovering a few pixels off the ground. */
#shadows{position:absolute;left:0;right:0;bottom:var(--groundY);height:0;z-index:9;
  pointer-events:none}
/* Every number here comes from CONFIG.shadow at boot -- see applyShadowVars.
   They were literals in two places, the CSS and the per-frame update, which is
   exactly the split that lets a tuned value drift from its other half. */
.shadow{
  position:absolute;left:0;bottom:var(--sh-drop);
  width:var(--sh-w);height:var(--sh-h);margin-left:calc(var(--sh-w) / -2);
  background:radial-gradient(ellipse 50% 50% at 50% 50%,
    rgba(0,0,0,var(--sh-core)) 0%,
    rgba(0,0,0,var(--sh-mid)) var(--sh-midstop),
    rgba(0,0,0,0) 100%);
  will-change:transform,opacity;
}

/* ---------- layer 2: participants ---------- */
.participant{
  position:absolute;
  bottom:var(--groundY);     /* set from CONFIG.stage.groundY at boot */
  width:260px;height:300px;
  z-index:10;
  will-change:transform;
  /* THE FEET. Every scale on this node -- the landing settle, the breath --
     happens about the bottom edge, which is where the participant meets the floor.
     Left at the default 50% 50% a squash lifts them off it by half of what it
     compresses, and the whole thing reads as the sprite shrinking rather than
     as weight arriving. A test asserts the bottom edge never moves. */
  transform-origin:50% 100%;
}
.participant .poses{position:absolute;inset:0}
/* Every pose image is present from load. Only one is ever visible. */
.participant .pose{
  position:absolute;
  left:50%;
  /* --anchor is the MEDIAN x of the sprite's opaque pixels, as a fraction
     of its width. Shifting by that instead of a flat -50% keeps the body
     put when a pose delivers a limb out and widens the bounding box.
     A median is used, not a centroid: a centroid chases the extended limb.
     Measured feet-centroid first and it was 3x worse on Rust's clarify, which
     stands on one leg (spread 0.341 vs 0.105). */
  --anchor:50%;
  /* --offsetY pushes a pose DOWN past the ground line. Upright poses stand
     on their lowest pixel (0). A prone pose seen from a high three-quarter
     angle must sink so its GROUNDED limbs sit on the floor plane and the
     near-camera limb hangs below it — otherwise the body reads as floating. */
  --offsetY:0px;
  bottom:var(--offsetY);
  transform:translateX(calc(-1 * var(--anchor)));
  max-width:none;
  /* Height is set per-image in buildParticipant as naturalHeight x k, where
     k = spriteH / srcHeight. Every pose therefore shares ONE scale factor
     instead of being stretched to the container height — otherwise a prone
     'concluded' sprite (wide and short) gets blown up to full standing
     height. Upright-only rosters never expose this. */
  display:none;
  image-rendering:auto;
  /* --neon is a filter chain set from CONFIG.neon; falls back to none.
     Composed BEFORE the ground shadow so the shadow stays black. */
  filter: drop-shadow(0 6px 10px #00000099);
}
.participant .pose.on{display:block}
/* fallback block used when art is missing */
.participant .fallback{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:150px;height:100%;display:none;border-radius:10px 10px 4px 4px;
  border:4px solid #00000066;
}
.participant .fallback.on{display:block}
.participant .fallback::after{
  content:attr(data-pose);position:absolute;left:0;right:0;top:8px;
  text-align:center;font-size:20px;color:#000a;letter-spacing:1px;
}

/* ---------- layer 3: SFX pops ---------- */
/* ABOVE THE HUD (30). Placement is allowed to put a burst across the health
   bars so it can clear a tall participant's head -- and a burst sliding UNDER
   the bars reads as a rendering fault, which is worse than the overlap it
   was meant to buy. Still below announce (35) and the result overlay (40):
   those replace the screen rather than share it, and a starburst that rises
   through ROUND 1 would be the same mistake in the other direction. */
#sfxlayer{position:absolute;inset:0;z-index:31;pointer-events:none}
/* Positioning and animation live on SEPARATE elements, and must keep living
   on separate elements. Centring a burst on its impact point needs an inline
   translate(-50%,-50%); `popin` animates `transform`. Put both on one node and
   every keyframe REPLACES the centring translate, so the art renders with its
   top-left corner on the impact point instead of its middle — an offset of
   half its own width, roughly 225px, which reads as most of a participant.
   The outer node positions; the inner node is free to animate transform
   however it likes without ever knowing about the centring. */
/* ANCHORED BY ITS BOTTOM EDGE, not its centre. The rule this has to satisfy
   is "bottom of the burst, plus 20px, is the top of the character", and a
   centre anchor can only satisfy that by ARITHMETIC -- centre = top - gap -
   height/2 -- which is exact only while the rendered height is exactly the
   height the maths assumed. Every error in that assumption lands on the one
   edge the rule is about. Anchoring the bottom makes the gap true by
   construction and leaves nothing to get wrong. */
.pop{position:absolute;transform:translate(-50%,-100%)}
/* A burst that sits BELOW its participant is anchored by its TOP edge, for the
   same reason the ones above are anchored by their bottom: the edge facing
   the character is the edge the rule is about, so that is the edge that gets
   pinned. Only the resolve burst is below anything -- it labels the bot that
   went down from underneath. */
.pop.below{transform:translate(-50%,0)}
.pop .pop-anim{transform-origin:center center;will-change:transform,opacity;
  animation:popin 480ms cubic-bezier(.2,1.5,.4,1) forwards}
/* popin ends at opacity 0. A burst that has to stay put needs the entrance
   without the fade, then the same breathing loop the result screen uses. */
.pop.pop-hold .pop-anim{animation:resolvedIn 420ms cubic-bezier(.2,1.5,.4,1) both,
                        resolvedPulse 1700ms ease-in-out 420ms infinite}
.pop img{height:190px;width:auto;display:block}
.pop .poptext{
  font-size:64px;font-style:italic;font-weight:900;letter-spacing:1px;
  white-space:nowrap;-webkit-text-stroke:7px #000;paint-order:stroke fill;
  text-shadow:0 6px 0 #000;
}
/* The result-screen comic STAYS on screen, so unlike the in-round bursts it
   cannot rely on a one-shot entrance for its energy — it just sat there.
   Two animations on one element: resolvedIn plays once, then resolvedPulse starts after
   it and breathes forever. resolvedPulse carries a delay and no fill mode, so it is
   simply not applied while resolvedIn is still running and the two never contend over
   `transform`. */
@keyframes resolvedIn{
  0%  {transform:scale(.2) rotate(-6deg);opacity:0}
  60% {transform:scale(1.12) rotate(2deg);opacity:1}
  100%{transform:scale(1) rotate(0deg);opacity:1}
}
@keyframes resolvedPulse{
  0%  {transform:scale(1)    rotate(-1.1deg)}
  50% {transform:scale(1.075) rotate(1.1deg)}
  100%{transform:scale(1)    rotate(-1.1deg)}
}
.resolvedart{
  animation:resolvedIn 420ms cubic-bezier(.2,1.5,.4,1) both,
            resolvedPulse 1700ms ease-in-out 420ms infinite;
  transform-origin:center center;will-change:transform;
}
/* REDUCED MOTION -- the whole surface of it, not one element.
   This block used to gate exactly ONE animation, the result-screen pulse, and
   even that only half: it dropped resolvedPulse and kept resolvedIn, which is still a
   scale from 0.2 with a rotation. Meanwhile the screen shook 13px on every
   response, every comic burst flew in from scale 0, the health bars jolted 9px,
   and EVAL/READY/BEGIN zoomed in from 2.4x. A player who asks their operating
   system for less motion was getting essentially all of it.

   THE RULE: remove the MOVEMENT, keep the INFORMATION. Every element below
   still appears, still says what it said and still leaves when it left -- it
   arrives by fading rather than by flying. Nothing here hides anything, which
   is what separates this from simply switching effects off.

   Note the two envelopes. In-round bursts fade OUT again, because popin ends
   at opacity 0 and their node is removed on a timer rather than on
   animationend -- a fade-in-only replacement would leave them lit until the
   timer caught up. Bursts that HOLD end at opacity 1 and stay. */
@keyframes popfade{0%{opacity:0}18%{opacity:1}70%{opacity:1}100%{opacity:0}}
@keyframes holdfade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  /* The most frequent motion in the game: one per landed conceded. */
  .pop .pop-anim{animation:popfade 480ms ease-out forwards}
  /* Entrance only, then hold -- no infinite breathing loop. */
  .pop.pop-hold .pop-anim,
  .resolvedart,
  #resolved{animation:holdfade 380ms ease-out both}
  /* The bar's WIDTH and COLOUR already carry the whole message. The 9px jolt
     is decoration on top of information that is already there. */
  .barouter.jolt,
  .barouter.jolt-soft{animation:none}
  /* The words are the point, not the zoom. */
  #announce .word{animation:popfade 700ms ease-out forwards}
  /* A 1Hz hard on/off step. That is under the three-per-second
     photosensitivity threshold and so was never a violation, but a steady
     prompt costs nothing: "PRESS SPACE" says the same thing unblinking. */
  .blink{animation:none;opacity:1}
  /* The low-clock pulse IS information -- it means the round is nearly gone --
     so this one is pinned at the BRIGHT end of its own cycle rather than
     switched off. Stopping it in the dark half would have quietly removed a
     warning instead of calming it. */
  #timer.low{animation:none;
    filter:drop-shadow(0 2px 0 #0c0512) drop-shadow(0 4px 0 #0c0512)
           drop-shadow(0 0 28px rgba(255,59,48,1))}
}

@keyframes popin{
  0%{transform:scale(0) rotate(var(--rot));opacity:1}
  55%{transform:scale(1.06) rotate(var(--rot));opacity:1}
  70%{transform:scale(1) rotate(var(--rot));opacity:1}
  100%{transform:scale(1.02) rotate(var(--rot));opacity:0}
}

/* ---------- layer 4: HUD (pure CSS, no images) ---------- */
/* The HUD is round furniture, so it is hidden on the screens that are not a
   round. It used to sit behind the title showing a stale eval number and
   half-drained bars from whatever was played last. Attract keeps it, because
   the demo is a round and it has its own clock to show. */
#hud{position:absolute;left:0;right:0;top:0;height:150px;z-index:30;
  transition:opacity 220ms ease}
#hud.off{opacity:0;pointer-events:none}
.hudside{position:absolute;top:26px;width:600px}
.hudside.left{left:36px}
.hudside.right{right:36px}
/* The END NEAREST THE CENTRE is sheared, so the two bars lean toward each other
   and away from the screen edges. Square-cornered rounded rectangles were the
   giveaway that the HUD came from a different design language than the logo,
   which is all hard angles and bevels. The shear is on the clip, so the border
   is cut with it and reads as a mitred end rather than a rectangle with a
   corner missing. */
.barouter{
  position:relative;height:44px;border:5px solid #0c0512;background:#160a24;
  overflow:hidden;
  box-shadow:0 4px 0 #0006,
             inset 0 4px 0 rgba(255,255,255,.10),
             inset 0 -5px 0 rgba(0,0,0,.45);
}
.hudside.left  .barouter{clip-path:polygon(0 0,100% 0,calc(100% - 20px) 100%,0 100%)}
.hudside.right .barouter{clip-path:polygon(20px 0,100% 0,100% 100%,0 100%)}
/* Fills are ABSOLUTE, not flexed: two of them now stack in the same well and a
   flex row would sit them side by side. Each anchors to its own outer edge so
   both bars drain toward the centre. */
.barinner,.barchip{position:absolute;top:0;bottom:0;left:0;width:100%}
.hudside.right .barinner,.hudside.right .barchip{left:auto;right:0}
.barinner{
  background:linear-gradient(180deg,
    rgba(255,255,255,.55) 0%, rgba(255,255,255,.12) 34%,
    rgba(0,0,0,.06) 52%, rgba(0,0,0,.28) 100%), var(--hud-hi);
  background-blend-mode:overlay,normal;
  transition:width 140ms linear, background-color 200ms linear}
/* The CHIP trail sits behind the fill and is the whole point of the pair: it
   holds the OLD health for a moment, then catches up. Depletion stops being "the
   number is lower now" and becomes a visible quantity — you see how much the
   response was worth, which a single bar can never show. The delay is in the
   transition, so it costs no JS and no per-frame work. */
.barchip{background:var(--hud-chip);opacity:.85;
  transition:width 420ms 260ms cubic-bezier(.4,0,.2,1)}
/* A conceded rocks the bar so the impact registers at the top of the screen too.
   Deliberately wider than it is tall — a bar is a horizontal object and a
   mostly-vertical shake reads as a glitch rather than a response. The NAME does
   not move: it is a label, and labels that escalate look broken. Only the frame
   rocks, and the fill rides along inside it. */
@keyframes barhit{
  0%  {transform:translate(0,0)}
  14% {transform:translate(-9px,3px)}
  30% {transform:translate(8px,-2px)}
  46% {transform:translate(-6px,2px)}
  62% {transform:translate(4px,-1px)}
  80% {transform:translate(-2px,1px)}
  100%{transform:translate(0,0)}
}
@keyframes barhitsoft{
  0%  {transform:translate(0,0)}
  22% {transform:translate(-4px,1px)}
  52% {transform:translate(3px,-1px)}
  78% {transform:translate(-2px,0)}
  100%{transform:translate(0,0)}
}
.barouter.jolt{animation:barhit 300ms cubic-bezier(.25,.9,.3,1)}
.barouter.jolt-soft{animation:barhitsoft 220ms ease-out}

/* The names align to the GREEN, not to the bar's outer edge. The bar carries a
   5px black border, so the green starts 5px inboard — and a name flush to the
   container sat 5px outside it, which is exactly the misalignment the border
   creates and hides.
   The two sides need DIFFERENT numbers. On the left, R begins at the box edge,
   so the correction is the whole border width. On the right, letter-spacing
   adds 3px of empty track AFTER the T that no glyph occupies, so the
   correction is the border minus that track. Measured: green spans 41..1559,
   and the names now start and end on those exact values. */
/* The wordmark's treatment, reduced to something that survives at 23px:
   black stroke UNDER the fill (paint-order), a brushed-chrome gradient clipped
   to the glyphs, and the neon delivered as a drop-shadow because a text-shadow
   would paint through glyphs whose fill is transparent.
   This is the single change that ties the HUD to the title screen — the two
   were speaking different visual languages, and the type is where that showed
   most. */
.chrome{
  background:linear-gradient(180deg,
    #ffffff 0%, #ffeafb 26%, #d8b0ec 48%, #fff6ff 56%, #f2bef9 76%, #ffffff 100%);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  /* The outline is drop-shadows, NOT -webkit-text-stroke. A stroke paints over
     the fill unless paint-order is honoured, and at HUD sizes a 3px stroke on
     23px type simply swallows the glyph — the names came out solid black.
     drop-shadow works off the rendered alpha, so it still describes glyphs
     whose fill is transparent, which is exactly the case here. Two stacked
     offsets read as the wordmark's extrusion rather than as an outline. */
  filter:drop-shadow(0 2px 0 #0c0512) drop-shadow(0 4px 0 #0c0512)
         drop-shadow(0 0 13px rgba(255,84,216,.8));
  /* Defensive, and load-bearing: any text-shadow reaching these glyphs floods
     them dark, because the fill is transparent and the shadow shows straight
     through it. Inheriting one from a parent is the easy way to break this. */
  text-shadow:none;
}
/* NO text-shadow here. A parent's text-shadow bleeds through a child painted
   with background-clip:text and floods the glyphs dark — even when the child
   sets text-shadow:none on itself, which is what made this take a while to
   find. The chrome class carries its own extrusion and glow as drop-shadows,
   which is also why it must not be re-added here later. */
/* 13px, not 9. The meter was added under the bar and ends exactly where the
   name began, so the name sat hard against it with nothing between -- RUST
   crowded by a bar that had not existed when this spacing was chosen. */
.name{margin-top:13px;font-size:23px;line-height:1;letter-spacing:3px;color:#fff;
  display:flex;align-items:flex-end;gap:14px;
  --bar-border:5px; --name-track:3px}
.hudside.left  .name{padding-left:var(--bar-border)}
.hudside.right .name{justify-content:flex-end;
  padding-right:calc(var(--bar-border) - var(--name-track))}
/* The REASON meter: a thin strip ATTACHED to the health bar rather than a
   second bar competing with it. It occupies the gap the layout already had --
   the health bar ends at 44 inside .hudside and the name begins at 53 -- so
   it costs no vertical space and moves nothing. Read that as a constraint:
   this is 7px because that is what was free, and the numbers either side are
   measured, not decorative.

   Full is a colour change, not a flash. The bar going gold is the cue, and it
   stays gold until spent -- a pulsing "ready" indicator would be one more
   thing moving on a screen that already had to be taught to hold still. */
.meter{
  position:absolute;top:44px;height:9px;width:100%;
  /* The SAME WELL as the health bar, not a translucent stripe. It was
     rgba(255,255,255,.10) on no background, which is why it read as pasted on
     rather than built in. */
  background:#160a24;
  /* THE SAME 5px SIDE BORDERS AS THE BAR. Without them the meter's fill began
     at the outer edge while the health fill began 5px in, and was scaled
     against 600px where the health was scaled against 590 -- so the two bars
     disagreed on both where zero is and how long full is. At a glance that
     reads as "no alignment", which is exactly what it was. */
  border:5px solid #0c0512;
  border-top-width:2px;
  border-bottom-width:0;
  overflow:hidden;
  box-shadow:0 3px 0 #0006, inset 0 -2px 0 rgba(0,0,0,.45);
}
/* CONTINUES THE BAR'S DIAGONAL rather than ending square under it. The bar
   shears its inner end 20px across 44px of height, and the meter picks that
   line up where the bar leaves it -- 20px at its top, 24px at its bottom, the
   same slope carried another 9px down. Without this the two shapes disagree
   by a full 20px exactly where they meet, which is the whole reason the HUD
   looked like two design languages stacked. */
.hudside.left  .meter{left:0;
  clip-path:polygon(0 0, calc(100% - 20px) 0, calc(100% - 24px) 100%, 0 100%)}
.hudside.right .meter{right:0;
  clip-path:polygon(20px 0, 100% 0, 100% 100%, 24px 100%)}
/* Absolute and anchored to its OWN outer edge, like .barinner -- so the meter
   fills from the screen edge toward the centre and drains back the same way
   the health above it does. margin-left:auto only looked right when full. */
.meterfill{position:absolute;top:0;bottom:0;left:0;width:0;
  background:linear-gradient(180deg,
    rgba(255,255,255,.45) 0%, rgba(255,255,255,.10) 40%,
    rgba(0,0,0,.25) 100%), #54e6ff;
  background-blend-mode:overlay,normal;
  transition:width 140ms linear, background-color 200ms linear}
.hudside.right .meterfill{left:auto;right:0}
.meterfill.full{background:linear-gradient(180deg,
    rgba(255,255,255,.5) 0%, rgba(255,255,255,.12) 40%,
    rgba(0,0,0,.22) 100%), #ffd93a;
  background-blend-mode:overlay,normal;
  box-shadow:inset 0 0 10px rgba(255,255,255,.35)}
/* While the install is running the strip reads as spent-and-working rather
   than empty: it drains to zero, so without this the most powerful state in
   the game is indistinguishable from having nothing. */
.meterfill.lit{width:100% !important;
  background:linear-gradient(180deg,
    rgba(255,255,255,.5) 0%, rgba(255,255,255,.12) 40%,
    rgba(0,0,0,.22) 100%), #ff2fd0;
  background-blend-mode:overlay,normal;
  box-shadow:inset 0 0 10px rgba(255,255,255,.4)}
/* The combo counter. ABSOLUTE, so it cannot push the name line or #rounds
   around when it appears -- the same reason the GPU pill is kept shorter than
   its line box. It appears and disappears constantly during a round, and a
   HUD that reflows on every conversion would be worse than no counter.

   Sits on the DELIVERER's side, which is the arcade convention and also the
   only unambiguous reading: a number over the bar that is draining would be
   telling you who is being conceded, not who is doing it. */
.combo{
  /* 82px is MEASURED against the furniture above it, not chosen by eye -- at
     56px it ran straight through the participant's name. Inside .hudside the bar
     occupies 0-44 and the name 53-76, so the counter starts 6px clear of the
     name and ends at 108, which is 134 into the HUD's own 150px band. Anything
     that changes the bar height or the name size moves this. */
  position:absolute; top:82px; font-size:26px; line-height:1; letter-spacing:3px;
  font-weight:700; color:#ffd93a; white-space:nowrap;
  text-shadow:0 2px 0 #7a3f12, 0 0 14px rgba(255,217,58,.6);
  opacity:0; transition:opacity 140ms ease;
  pointer-events:none;
}
.combo.on{opacity:1}
.hudside.left  .combo{left:5px}
.hudside.right .combo{right:5px}
/* The pill must stay SHORTER than the 23px name line box, or adding it grows
   the line and shifts the name baseline -- and #rounds is positioned against
   that baseline with a measured offset.
   
   The old sum was 14px text + 2x4px padding = 22px, and it FORGOT THE BORDER:
   2px a side makes 26, three px OVER the line box, so the pill had been
   quietly growing the very line this comment promised it would not. Measured
   on the right-hand side it made that name 24.3px against the left's 21.5.
   
   Pinned to an explicit 22px instead of summed from its parts, because a
   height derived by addition is a height that goes wrong the next time
   somebody adds a border to it. box-sizing is border-box, so 22 is 22. */
.cpu{
  display:none;font-size:14px;line-height:1;letter-spacing:2px;
  height:22px;align-items:center;justify-content:center;
  padding:0 9px;border-radius:999px;
  color:#0a0510;background:#ffd93a;border:2px solid #fff;
  /* 4px, not 12. A 12px halo on a 22px pill reached y=42 while the REASON
     meter sits at 41-49, so the pill glowed onto the bar above it. The meter
     is information and the halo is decoration; decoration yields. */
  text-shadow:none;box-shadow:0 0 4px rgba(255,217,58,.55);
}
/* inline-FLEX, not inline-block: the pill now has a pinned height, and text
   inside a fixed-height inline-block sits on the baseline rather than in the
   middle of it. Flex is what centres it. */
.cpu.on{display:inline-flex}
/* Bottom edge of the DIGITS sits on the bottom edge of the health bars.
   Aligned on ink, not on the line box: with line-height:1 a box still keeps
   a few px of descender space below the numerals, so --timer-ink-fix pushes
   the box down by that amount. Measured, not guessed. */
#timer{
  position:absolute;left:50%;transform:translateX(-50%);
  --timer-ink-fix:6px;
  top:calc(70px - 66px + var(--timer-ink-fix));
  font-size:66px;line-height:1;
  min-width:130px;text-align:center}
/* NO plate behind the clock. One was built and removed: `filter` on the timer
   (the chrome treatment) opens a stacking context, and inside it a
   z-index:-1 pseudo-element paints OVER the glyphs rather than under them, so
   the plate hid the number it was meant to frame. It was not worth rescuing —
   the bars already frame the top of the screen, and the numerals read better
   floating in chrome than boxed. */
/* Under ten seconds the clock stops being a readout and starts being a
   warning. The pulse is on the FILTER glow, not on scale — a number that
   changes size is harder to read, and this is the one element you most need to
   read while something else has your attention. */
/* The low-time pulse REPLACES the chrome filter while it runs, so it has to
   restate the extrusion or the numerals lose their dark edge exactly when they
   most need to stay legible. */
#timer.low{animation:clocklow 620ms ease-in-out infinite}
@keyframes clocklow{
  0%,100%{filter:drop-shadow(0 2px 0 #0c0512) drop-shadow(0 4px 0 #0c0512)
                 drop-shadow(0 0 10px rgba(255,59,48,.7))}
  50%    {filter:drop-shadow(0 2px 0 #0c0512) drop-shadow(0 4px 0 #0c0512)
                 drop-shadow(0 0 28px rgba(255,59,48,1))}
}
/* EVAL n + the four pips sit on the same line as the participant names:
   their ink bottom matches the name ink bottom. */
#rounds{position:absolute;left:50%;transform:translateX(-50%);
  --rounds-ink-fix:2px;
  /* Follows the name. The offset is measured against the NAME'S INK BOTTOM,
     so the 4px the name gained for the meter has to be given here too or EVAL
     and the pips quietly stop sharing its line. */
  top:calc(100px - 16px + var(--rounds-ink-fix));
  display:flex;align-items:baseline;gap:26px;
  font-size:20px;line-height:1;color:#fff;letter-spacing:2px}
/* Diamonds, not circles. The comic bursts are all points and angles and the
   bars are now mitred; a row of soft dots was the last round thing left up
   there. clip-path rather than rotate(45deg) so the element keeps its own
   layout box and the row's baseline alignment is undisturbed. */
.pip{width:17px;height:17px;background:rgba(255,255,255,.16);
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
  display:inline-block;align-self:center;flex:0 0 auto;
  transition:background-color 200ms linear}
.pip.win{background:#ffd93a;filter:drop-shadow(0 0 9px #ffd93a)}

/* ---------- layer 5: overlays ---------- */
#overlay{position:absolute;inset:0;z-index:40;display:grid;place-items:center;
  text-align:center;color:#fff}
#overlay.hidden{display:none}
/* --scrim-a is turned DOWN while attract mode plays so the demo round reads
   through it; the default is the opaque title scrim. */
#overlay .scrim{position:absolute;inset:0;background:rgba(10,5,16,var(--scrim-a,.8))}
#overlay .inner{position:relative}
/* Behind the wordmark during attract only: a soft plate that keeps the logo
   and the prompt legible over a moving round. Static gradient, no filter. */
#overlay .inner::before{content:"";position:absolute;inset:-70px -140px;z-index:-1;
  display:none;border-radius:50%;
  background:radial-gradient(ellipse 58% 54% at 50% 46%,
    rgba(10,5,16,.86) 0%, rgba(10,5,16,.62) 55%, rgba(10,5,16,0) 100%)}
#overlay.attract .inner::before{display:block}
/* Attract mode lifts the title block and drops the control legend, so the
   the demo has the lower half of the screen to itself instead of playing behind
   three lines of small text. Both come from CONFIG.attract. */
#overlay.attract .inner{transform:translateY(var(--attract-lift,0px)) scale(var(--attract-scale,1))}
#overlay.attract.nohints .hint{display:none}
/* Once the marquee lifts, the prompt sits at head height — so during attract it
   gets its own plate instead of relying on the thinned scrim. */
/* Legibility over the demo round comes from a heavy outline and glow, not a
   pill. A boxed label reads as a web UI; an arcade screen just burns the text
   brighter than whatever is behind it. */
#overlay.attract .sub{
  text-shadow:
    0 3px 0 #000, 0 0 6px #000, 0 0 14px #000,
    0 0 26px rgba(0,0,0,.95), 0 0 40px rgba(255,47,208,.55)}
#logo{max-width:900px;max-height:300px;display:block;margin:0 auto 10px}
.bigtitle{font-size:132px;letter-spacing:10px;color:#fff;
  text-shadow:0 8px 0 #000, 0 0 40px #ff2fd0, 0 0 80px #7a2fff}
/* The headline falls back to styled text whenever a phrase has no starburst
   art yet. At a flat 132px a long phrase runs clean off a 1600px stage —
   RECURSIVE SELF-IMPROVEMENT is 26 characters, roughly 2300px — so the
   fallback wraps and is sized against its own length. Art, when it exists,
   is unaffected: this only styles the text stand-in. */
#resolvedText{max-width:1380px;line-height:1.02;white-space:normal;
  margin-left:auto;margin-right:auto}

/* ---------- the CSS wordmark (cabinet marquee) ----------
   Shown only when CONFIG.art.logo fails to load — but built to be the real
   thing, not a placeholder. Four stacked copies of the same string paint as
   four separate layers that register exactly:
     extrude  black-stroked slab + a stepped 3D side delivered down-right
     rim      neon edge, narrower stroke so it sits inside the black
     face     brushed-chrome gradient clipped to the glyphs
     gloss    a top-half highlight, also clipped
   Every colour/size/angle comes from CONFIG.art.wordmark via CSS vars, and
   --mq-shadow (the extrusion) is generated at boot from `depth`.
   All static: no animation and no filter, so it costs one paint and nothing
   per frame. */
.marquee{
  display:none;                 /* the img's onerror flips this to block */
  transform:perspective(1400px) rotateX(var(--mq-tilt,13deg)) translateZ(0);
  transform-origin:50% 100%;
  padding:22px 0 0;
}
.mqrow{
  position:relative;text-align:center;line-height:.92;
  font-family:"Arial Black",Impact,system-ui,sans-serif;
  transform:skewX(var(--mq-skew,-7deg));
}
.mqrow.r1{font-size:var(--mq-size-1,112px);letter-spacing:var(--mq-track-1,26px);
  padding-left:var(--mq-track-1,26px)}   /* offset the trailing letter-space */
.mqrow.r2{font-size:var(--mq-size-2,178px);letter-spacing:var(--mq-track-2,8px);
  padding-left:var(--mq-track-2,8px);margin-top:-6px}
.mql{display:block;white-space:nowrap}
.mql:not(.extrude){position:absolute;left:0;right:0;top:0}
.mql.extrude{
  color:var(--mq-ink,#07030c);
  -webkit-text-stroke:var(--mq-outline,18px) var(--mq-ink,#07030c);
  paint-order:stroke fill;
  text-shadow:var(--mq-shadow, 4px 4px 0 #3a0f57);
}
.mql.rim{
  color:transparent;
  -webkit-text-stroke:var(--mq-rimw,9px) var(--mq-rim,#ff2fd0);
  paint-order:stroke fill;
}
.mql.face{
  color:transparent;
  background:linear-gradient(180deg,
    #ffffff 0%, #ffe3fb 13%, #ff86e4 33%, #a638ff 49.5%,
    #40167d 50.5%, #ff5ad0 62%, #ffd0f2 80%, #ffffff 100%);
  -webkit-background-clip:text;background-clip:text;
}
.mql.gloss{
  color:transparent;
  background:linear-gradient(180deg,
    rgba(255,255,255,.92) 0%, rgba(255,255,255,.42) 26%,
    rgba(255,255,255,0) 44%);
  -webkit-background-clip:text;background-clip:text;
}
/* the marquee's underlighting strip */
.mqbar{
  height:9px;width:64%;margin:26px auto 0;border-radius:9px;
  background:linear-gradient(90deg,
    transparent 0%, var(--mq-rim,#ff2fd0) 18%, #ffffff 50%,
    var(--mq-rim,#ff2fd0) 82%, transparent 100%);
  box-shadow:0 0 22px var(--mq-glow,#ff2fd0);
}

.timeup{font-size:30px;letter-spacing:12px;color:#fff;margin-top:6px;
  text-shadow:0 3px 0 #000,0 0 26px #ff2fd0}
.sub{font-size:34px;letter-spacing:5px;margin-top:26px;color:#ffe9fb}
.blink{animation:blink 1s steps(2,end) infinite}
@keyframes blink{50%{opacity:.15}}
.hint{font-size:20px;letter-spacing:2px;color:#c9a8dd;margin-top:34px;line-height:1.9;
  font-family:ui-monospace,Menlo,monospace;font-weight:700}
/* A key map is a TABLE — action down the side, who is playing across the top.
   It used to be four run-on lines of comma-separated pairs, which is the one
   shape this information should never take: nothing lines up, so comparing
   "what does P2 press for CAVEAT" means reading a sentence.
   inline-grid so the block stays centred in the overlay while its columns
   align to each other. */
.keygrid{display:inline-grid;grid-template-columns:repeat(4,auto);
  gap:7px 30px;align-items:baseline;text-align:left;margin-top:6px}
.keygrid.two{grid-template-columns:repeat(3,auto)}
.keygrid .kh{font-size:15px;letter-spacing:3px;opacity:.5;text-transform:uppercase}
.keygrid .ka{color:#ffbdf0;letter-spacing:3px}
.keygrid .kk{color:#fff;font-size:18px}
.keygrid .kk i{font-style:normal;opacity:.4;padding:0 4px;letter-spacing:1px}
.keyfoot{margin-top:16px;font-size:17px;opacity:.62;letter-spacing:3px}
.keyfoot + .keyfoot{margin-top:6px;opacity:.45}
/* The quietest line on the card, and deliberately the same shape as the two
   above it -- caps, tracked, centred -- so it reads as the last item of the
   small print rather than as debug text someone forgot to remove. */
.keyfoot.build{margin-top:14px;font-size:14px;opacity:.3;letter-spacing:4px}
/* THE BYLINE READS AS THE SAME SMALL PRINT AS THE BUILD LINE, and its link is
   not supposed to announce itself -- no colour of its own, no underline, no
   visited state. `color:inherit` covers :visited too, which is the one that
   would otherwise change weeks later on somebody else's machine and never on
   mine. It sits directly under the fingerprint, so the margin is tightened
   from the 14px that separates the build line from the table above it. */
.keyfoot.byline{margin-top:4px}
.keyfoot.byline a{
  color:inherit;text-decoration:none;font:inherit;letter-spacing:inherit;
  -webkit-tap-highlight-color:transparent;
}
/* The record line. Quieter than the verdict above it by design -- it is a
   footnote to the result, not a second headline competing with WINS THE
   BENCHMARK. NEW RECORD is the one that earns the gold. */
/* ---- the attract loop's records card ----
   A TABLE, on the same reasoning as the key map above: rung down the side,
   result across. Two columns in one grid with the rows as display:contents,
   so every value aligns to the same vertical however long the rung name is --
   which is the entire reason this is not three centred lines of text. */
.reclist{display:inline-grid;grid-template-columns:auto auto;
  gap:15px 54px;align-items:baseline;text-align:left;margin-top:34px}
.recrow{display:contents}
/* ON THE SELECT SCREEN'S TYPE RAMP, deliberately, because it is the same kind
   of screen: a heading over a list. The game's screen headings are all
   .bigtitle (SELECT 76px, PAUSED 104px, the RESOLVED word 132px) and the first
   draft of this card invented a 40px one, which sat below even .sub at 34px
   and read as a caption rather than as a screen. Row type matches .choice at
   30px for the same reason -- there is one list style here already. */
.reclvl{font-size:30px;letter-spacing:5px;color:#ffbdf0}
.recval{font-size:30px;letter-spacing:4px;color:#ffe9fb;
  font-family:ui-monospace,Menlo,monospace;font-weight:700;
  text-shadow:0 3px 0 #000}
/* An unbeaten rung stays legible but recedes -- the table should read as
   waiting to be filled, not as broken. */
.recval.none{color:#c9a8dd;opacity:.42;font-weight:400;text-shadow:none}
/* The closing prompt gets MORE air than the rhythm inside the table, not less.
   Measured, the default put it 11.9px under the list while the heading sat
   15.6px above it -- so the one element that is not part of the table was the
   one bound most tightly to it. The heading-to-list gap matches the SELECT
   screen's 13.8px; this clears both. */
.reclist + .sub{margin-top:44px}
/* THE SCORE BLOCK. THIS RUN and BEST are PEERS -- one measurement read twice,
   this match against the best -- so they are a two-column table with the
   values aligned, exactly like .keygrid and .reclist above and for the reason
   already stated there: a column that can be scanned outranks two sentences you
   have to compare word by word. 34% against 71% is the whole point of showing
   both, and it was previously impossible to see without reading.

   Measured off the old render: 34 / 34 / 20px, with a 26.0px gap under the
   verdict and 10.0px between the score lines. THIS RUN was set at EXACTLY the
   verdict's size, so the card had two headlines and no hierarchy; and the two
   halves of one comparison were 34px and 20px, which makes the second read as
   a caption on the first rather than as the other half.

   Proximity does the grouping and it is measurable rather than a taste call:
   34px away from the verdict, 9px between the rows, so the pair is bound to
   itself nearly four times more tightly than to the line above it. The old
   card's ratio was 2.6:1 and was working against a size mismatch at the same time. */
.scoreboard{display:inline-grid;grid-template-columns:auto auto;
  gap:9px 34px;align-items:baseline;text-align:left;margin-top:34px}
.scorerow{display:contents}
.scorelbl{font-size:22px;letter-spacing:3px;color:#c9a8dd}
.scoreval{font-size:22px;letter-spacing:3px;color:#ffe9fb;
  font-family:ui-monospace,Menlo,monospace;font-weight:700;text-shadow:0 3px 0 #000}
/* The best is the reference, this run is the news -- so the record recedes a
   little rather than competing with the line above it. */
.scorerow.prev .scorelbl,.scorerow.prev .scoreval{opacity:.7}
.scorerow.best .scorelbl,.scorerow.best .scoreval{
  color:#ffd93a;text-shadow:0 0 16px rgba(255,217,58,.55)}
#announce{position:absolute;inset:0;z-index:35;display:grid;place-items:center;
  pointer-events:none}
#announce .word{font-size:150px;letter-spacing:12px;color:#fff;
  text-shadow:0 8px 0 #000,0 0 44px #ff2fd0;
  animation:announce 700ms ease-out forwards}
@keyframes announce{
  0%{transform:scale(2.4);opacity:0}
  25%{transform:scale(1);opacity:1}
  75%{transform:scale(1);opacity:1}
  100%{transform:scale(1.35);opacity:0}}
#resolved{max-width:900px;width:70%;display:block;margin:0 auto 6px;
  animation:resolvedIn 460ms cubic-bezier(.2,1.5,.4,1) both}
@keyframes resolvedIn{
  0%{transform:scale(0) rotate(-8deg);opacity:0}
  60%{transform:scale(1.08) rotate(2deg);opacity:1}
  100%{transform:scale(1) rotate(0);opacity:1}}

/* ---------- CRT overlay ----------
   Scanlines + a vignette + a faint aperture-grille tint, painted as static
   gradients on ONE composited layer. Deliberately not a per-frame filter:
   this costs nothing to animate because it never changes.
   Sits above the HUD because a real tube scans the whole screen, and inside
   #stage so it is confined to the play area and scales with it. */
/* NO mix-blend-mode. A full-screen blended layer forces the compositor to
   re-blend the whole stage every frame even though the layer never changes —
   measured 21fps with `mix-blend-mode:multiply` against 37fps without it, and
   hiding the gradients individually changed nothing, so the blend was the
   entire cost. The darkening is baked into the gradient alphas instead, which
   composites normally and is free. */
/* ---------- select screen ----------
   #stage is pointer-events:none, so the overlay has to opt back in or the
   choice buttons are unclickable. */
#overlay .inner{pointer-events:auto}
.choices{display:flex;gap:30px;justify-content:center;margin-top:34px}
.steplabel{font-size:26px;letter-spacing:6px;color:#c9a8dd;margin-top:30px}
/* The confirm affordance is the prompt line itself, not an extra button —
   same shape as "TAP FOR NEXT EVAL" on the result screen. */
.go{cursor:pointer}
/* The jargon half of the step label. Dimmer on purpose: it is a gloss on the
   plain word, not a second heading, and the weight difference is what makes
   the em dash read as "which we insist on calling" rather than as a list. */
.gloss{color:#7d5f92}
/* The blurb changes with the selection, and the options are wildly different
   lengths, so it gets a FIXED height. Without one, moving the cursor onto
   ULTRATHINK reflows everything below it and the row of buttons jumps under
   the player's eye mid-choice. 136px is MEASURED, not guessed: with the
   reservation removed, the three blurbs come out 22 / 22 / 128 stage px, so
   the ULTRATHINK wrap is what the row has to be sized for. Guessing produced
   78px and then 100px, which drifted the buttons 3px and then 26px. */
/* EVERY blurb is rendered, stacked into one grid cell, with all but the
   selected one hidden. The cell therefore sizes to the TALLEST of them and the
   box never changes height, so moving between difficulties cannot shuffle the
   buttons above it — the overlay is centred, so anything that grows here
   pushes the whole screen around.

   Stacked rather than given a min-height, because a fixed number is a promise
   about text somebody will edit later. `visibility` rather than `display:none`
   so the hidden ones still occupy the cell and still count toward its height. */
.blurb{
  display:grid;margin:26px auto 0;max-width:900px;
  font-family:ui-monospace,Menlo,monospace;
  font-size:19px;line-height:1.55;letter-spacing:1px;color:#9d84b4;
}
/* The end screen's two buttons are the select screen's, scaled down: the
   headline art above them is already the loud thing, so these sit under it
   rather than competing with it. */
.endchoices{margin-top:22px}
.endchoices .choice{font-size:22px;letter-spacing:4px;padding:14px 32px}
/* BIGGER TYPE IN A WIDER BOX ON TOUCH -- but not the widest that fits. 19px
   is small on a phone, and a line stretched toward the full stage is hard to
   track back to the start of, so the two settings are chosen together instead
   of either being pushed to its limit.
   Measured across both at once, against the real strings. At 24px the longest
   description wraps to six lines at 1150px AND at 1250px -- the same block
   height either way -- so the narrower measure costs nothing and reads better.
   Below that it turns over: 1050px goes to seven. For reference the original
   was 1 / 2 / 6 lines at 19px in 900px.
   The block is 223px against 118px at 19px/1380px, affordable because the
   overlay reserves the cabinet band below it; a stress run stayed clear at
   324px.
   Touch only. A pointer screen keeps 19px at 900px, where the type is read
   from further off and nothing is being pushed around. */
body.touch .blurb{max-width:1150px;font-size:24px}
/* AND KEEP THE OVERLAY OUT OF THE CABINET BUTTONS. On touch the SOUND/PAUSE
   pair is centred along the bottom rather than anchored to a corner, and the
   overlay centres its own content in the full stage -- so the two share the
   same middle column, and the last line of any screen tall enough to reach the
   bottom lands underneath them. Seen on a phone: TAP TO CONTINUE printed
   through the sound button.
   Reserving the band the buttons occupy (56px tall on a 24px inset) means the
   centred content is centred in what is actually free, so the collision cannot
   come back the next time a description grows. */
body.touch #overlay{padding-bottom:96px}
.blurb > *{grid-area:1/1;visibility:hidden}
.blurb > .on{visibility:visible}
/* Lit brighter than the prose so the DENSITY reads at a glance — you can see
   how much thinking each level does before you have finished the sentence. */
.blurb .dash{color:#ff2fd0;font-weight:700}
/* LIT ON A CONCESSION. A brightness pass over the whole participant, which
   reads at a glance and is the one cue that lands ON the figure rather than
   beside it -- the burst is off to the side, the bar is at the top of the
   screen and the sound is not visual at all.
   filter rather than an overlay element: it follows the sprite's own alpha
   exactly, so it lights the figure and not a box around it, and it needs no
   second copy of the art kept in sync with the pose.
   It desaturates as it peaks, which is what makes it read as light falling on
   the figure rather than as the figure changing colour. A guarded response gets a
   weaker, shorter one -- absorbing something should not look the same as
   taking it. */
@keyframes lit{
  0%   {filter:brightness(2.8) saturate(.30) contrast(1.05)}
  45%  {filter:brightness(1.8) saturate(.65)}
  100% {filter:none}
}
@keyframes lit-guard{
  0%   {filter:brightness(1.7) saturate(.75)}
  100% {filter:none}
}
.participant.lit{animation:lit 170ms ease-out}
.participant.lit-guard{animation:lit-guard 110ms ease-out}
/* A flash is not a vestibular effect, but a rapid one is a photosensitivity
   concern, and a chain delivers several in a row. Same call as the screen
   shake: the concession still announces itself with a burst, a bar and a
   sound, so dropping it costs a cue rather than the information. */
@media (prefers-reduced-motion: reduce){
  .participant.lit, .participant.lit-guard{animation:none}
}
.choice{
  position:relative;
  font-family:ui-monospace,Menlo,monospace;font-weight:700;
  font-size:30px;letter-spacing:5px;padding:20px 44px;border-radius:10px;
  cursor:pointer;color:#ffe9fb;background:rgba(10,5,16,.72);
  border:3px solid rgba(255,47,208,.5);text-shadow:0 3px 0 #000;
  transition:background .12s,border-color .12s,color .12s,transform .12s;
}
/* Hover and selected must NOT look alike. They shared one rule, so whichever
   button the mouse happened to rest on read as chosen and the actual
   selection was indistinguishable. Hover is now a hint — the border lifts —
   while the selection is a full colour inversion. */
.choice:hover{border-color:#ff2fd0;background:rgba(46,8,56,.92);color:#fff}
.choice.sel{
  background:#ff2fd0;border-color:#fff;color:#0a0510;
  text-shadow:none;transform:translateY(-3px);
  box-shadow:0 0 26px rgba(255,47,208,.6);
}
/* BUT NOT ON TOUCH. The lift is an affordance for a selection that moves under
   arrow keys, where the button is never beneath the hand. A tap is different:
   the control shifts 3px at the moment the thumb is on it, and every change of
   selection drops the old button as it raises the new one, so the whole row
   twitches on a screen where the row is what you are aiming at. Steady targets
   matter more here than the lift is worth.
   Nothing is lost by dropping it. The selection is already carried by a full
   colour inversion and by the caret below, either of which reads on its own. */
body.touch .choice.sel{transform:none}
/* A caret as well as the colour, so the selection does not depend on hue
   alone — it survives a colour-blind player and a washed-out TV. */
.choice.sel::before{
  content:"";position:absolute;left:-2px;top:50%;
  transform:translate(-100%,-50%);
  border:9px solid transparent;border-left-color:#ff2fd0;
}

/* ---------- cabinet controls ----------
   Live INSIDE #stage so the one stage transform scales them with everything
   else, and sit above the CRT so they stay clickable — the CRT is
   pointer-events:none but it still covers them. */
#cabbar{position:absolute;right:30px;bottom:24px;z-index:55;display:flex;gap:12px}
/* Small enough to ignore while playing, big enough to read in a screenshot --
   which is the only time anyone needs it. */

/* PAUSE is hidden wherever there is no round to pause — the title, the select
   screens and the attract demo. It did nothing on any of them, and a control
   that is present but inert teaches people the button is broken.
   `visibility` rather than `display` so the bar does not reflow: SOUND stays
   exactly where it was, which matters most on touch where the pair is centred
   rather than anchored to an edge. */
#cabbar.nopause #pauseBtn{visibility:hidden;pointer-events:none}
.cabbtn{
  pointer-events:auto;        /* #stage is pointer-events:none */
  width:56px;height:56px;padding:0;border-radius:10px;cursor:pointer;
  display:grid;place-items:center;
  color:#ffe9fb;background:rgba(10,5,16,.72);
  border:2px solid rgba(255,47,208,.55);
  box-shadow:0 0 18px rgba(255,47,208,.30), inset 0 0 22px rgba(255,47,208,.10);
  transition:background .12s, border-color .12s, color .12s;
}
.cabbtn:hover{background:rgba(46,8,56,.92);border-color:#ff2fd0;color:#fff}
.cabbtn:active{transform:translateY(2px)}
.ico{width:28px;height:28px;fill:currentColor;grid-area:1/1;display:none}
/* Each button owns two glyphs and shows exactly one, so the icon states the
   CURRENT state rather than the action — a speaker with a slash means sound
   is off, which is what a player scanning the screen reads. */
#pauseBtn .ico-pause{display:block}
#pauseBtn.on .ico-pause{display:none}
#pauseBtn.on .ico-play{display:block}
#muteBtn .ico-soundoff{display:block}
#muteBtn.on .ico-soundoff{display:none}
#muteBtn.on .ico-soundon{display:block}
/* Sound ON is the lit state; off is the resting one, since off is the default
   and a permanently-lit button would imply audio is playing when it is not. */
#muteBtn.on{color:#0a0510;background:#ff2fd0;border-color:#ff8ae6}

#crt{position:absolute;inset:0;z-index:50;pointer-events:none;
  opacity:var(--crt-opacity,1)}
#crt.off{display:none}
#crt .lines{position:absolute;inset:0;
  background:repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,var(--scan-dark,.34)) 0px,
    rgba(0,0,0,var(--scan-dark,.34)) var(--scan-thick,2px),
    rgba(255,255,255,0)              var(--scan-thick,2px),
    rgba(255,255,255,0)              var(--scan-pitch,4px))}
/* vertical phosphor stripes — very faint, adds the grille texture */
#crt .grille{position:absolute;inset:0;
  background:repeating-linear-gradient(
    to right,
    rgba(255,0,0,var(--grille,.05)) 0px, rgba(255,0,0,var(--grille,.05)) 1px,
    rgba(0,255,0,var(--grille,.05)) 1px, rgba(0,255,0,var(--grille,.05)) 2px,
    rgba(0,0,255,var(--grille,.05)) 2px, rgba(0,0,255,var(--grille,.05)) 3px)}
#crt .vignette{position:absolute;inset:0;mix-blend-mode:normal;
  background:radial-gradient(ellipse 78% 74% at 50% 50%,
    rgba(0,0,0,0) 55%, rgba(0,0,0,var(--vignette,.42)) 100%)}

/* ---------- touch controls ---------- */
/* Sits below the cabinet buttons in z-order so PAUSE and SOUND stay on top,
   and is pointer-events:none at the container level so the empty middle of
   the layer never eats a tap meant for the game. */
#touch{position:absolute;inset:0;z-index:52;display:none;pointer-events:none;
  --tbtn:116px; --tgap:11px; --trow:96px; --tedge:24px}
#touch.on{display:block}
.tpad,.tdiamond{position:absolute;pointer-events:auto}
.tdiamond{bottom:var(--trow)}
/* A full four-way cross. It used to be three buttons with no DOWN, which is
   also why the pad needed a hand-derived vertical offset to line its one row
   of directions up with the middle of the face cluster.
   With the fourth direction in place both clusters are three rows of the same
   button on the same gap, so they align by simply sharing a bottom edge and
   the offset is gone. Row for row: ESCALATE with AFFIRM, the two directions with
   CAVEAT, DEFER with CLARIFY. */
.tpad{left:var(--tedge);display:grid;gap:var(--tgap);
  grid-template-columns:repeat(3,var(--tbtn));
  grid-template-rows:repeat(3,var(--tbtn));
  bottom:var(--trow)}
.p-up   {grid-area:1/2}
.p-left {grid-area:2/1}
.p-right{grid-area:2/3}
.p-down {grid-area:3/2}
/* The diamond is 3x3 with the corners empty. Laying it out on a grid rather
   than with absolute offsets means the gap between opposite buttons is one
   number, so it stays a diamond at any button size. */
/* Three buttons, not four: a triangle with its flat side outboard and its
   point toward the screen, which is the shape a right thumb actually sweeps.
   AFFIRM still sits above CLARIFY — affirm above clarify is the rule that
   survives every rearrangement. */
.tdiamond{
  right:var(--tedge);display:grid;gap:var(--tgap);
  grid-template-columns:repeat(2,var(--tbtn));
  grid-template-rows:repeat(3,var(--tbtn));
}
.d-up   {grid-area:1/2}
.d-left {grid-area:2/1}
.d-down {grid-area:3/2}
.tbtn{
  width:var(--tbtn);height:var(--tbtn);border-radius:50%;
  background:#150b20cc;border:3px solid #ffffff77;color:#fff;
  /* CRITIQUE, the longest label at the time, was overflowing its circle by
     3px (it has since become CLARIFY, which is shorter).
     Sized from that worst case, with both levers used: a bigger button and a
     slightly smaller face. Text that merely FITS a circle still reads as
     cramped, because the rim curves away either side of the line — so this is
     set for real clearance, not for zero overflow. */
  font-size:16px;font-weight:900;letter-spacing:0.5px;
  display:grid;place-items:center;touch-action:none;
  text-shadow:0 2px 0 #000;
}
.tbtn.pressed{background:#ff2fd0cc;border-color:#fff;transform:scale(.93)}
/* PAUSE and SOUND move to the bottom CENTRE on touch. They live in the
   bottom-right corner on desktop, which is exactly where the face buttons
   have to go on a phone — and two stacks of buttons competing for one corner
   is how a player mis-taps. The middle of the floor is unused space. */
/* SOUND IS THE ANCHOR, AND IT IS CENTRED ON ITSELF. The bar is centred as a
   PAIR, and PAUSE keeps its space while hidden, so on every screen with no
   round to pause the one visible button sat half a button plus a gap right of
   centre -- conspicuous on a select screen where everything else is centred.
   Taking PAUSE out of flow and hanging it off the left is better than making it
   display:none, which would centre SOUND only while PAUSE is absent and then
   shove it sideways the moment a round starts. This way the bar is exactly as
   wide as SOUND, so SOUND is exactly centred always AND never moves -- which is
   what the visibility rule was reaching for to begin with. */
body.touch #cabbar{left:50%;right:auto;transform:translateX(-50%)}
body.touch #pauseBtn{position:absolute;right:calc(100% + 12px);top:0}
</style>
</head>
<body>

<div id="viewport">
  <div id="stage">
    <div id="iris"></div>
    <div id="backdrop-fallback"></div>
    <img id="backdrop" alt="">
    <div id="ground"></div>

    <!-- participants injected here -->
    <div id="shadows"></div>
    <div id="participants"></div>

    <div id="sfxlayer"></div>

    <!-- Touch controls live INSIDE the stage so they scale with it and sit
         over the game itself. Two separate layers of buttons — one on the
         game, one in a band below it — read as two different interfaces. -->
    <div id="touch">
      <!-- Escalate lives here, not on the face cluster: it is the only literal
           physical action among three conceptual ones, and every versus game
           puts it on the movement control. An arrow rather than the word,
           because it is a DIRECTION now and belongs to the same family as the
           two beside it. -->
      <div class="tpad">
        <div class="tbtn p-up"    data-key="ArrowUp">▲</div>
        <div class="tbtn p-left"  data-key="ArrowLeft">◀</div>
        <div class="tbtn p-right" data-key="ArrowRight">▶</div>
        <div class="tbtn p-down"  data-key="ArrowDown">▼</div>
      </div>
      <!-- Laid out to versus-game convention, not to spatial intuition.
           AFFIRM SITS ABOVE CLARIFY. That is the one binding rule across the
           genre — light, medium and heavy on the top row, the second family on the
           bottom, identical on arcade sticks, arcade pads and controllers — so
           AFFIRM (the affirm tier) goes top and CLARIFY (the clarify tier) goes
           bottom. The first layout had them side by side on the horizontal,
           which reads as two equivalent buttons rather than as an response
           column.
           CAVEAT takes the LEFT slot because guard is reactive and has to be
           the fastest reach: a right thumb anchored on this cluster arcs most
           easily to the left and bottom buttons, and bottom is spoken for.
           ESCALATE takes the remaining slot, and stays a FACE button rather than
           moving to an up-arrow on the pad. Console participants put escalate on the
           stick because a physical d-pad registers diagonals — two separate
           virtual circles do not, so jumping forward there would mean pressing
           two adjacent buttons with one thumb. On the face cluster it is one
           thumb each and escalate-forward actually works. -->
      <div class="tdiamond">
        <div class="tbtn d-up"    data-key="KeyF">AFFIRM</div>
        <!-- KeyH, not KeyS. KeyS is DEFER; this button says CAVEAT. It sent
             the defer code, so on a phone the labelled guard button deferred,
             there were two defer controls, and guarding could not be done at
             all. Caught by the first test ever to boot the touch build. -->
        <div class="tbtn d-left"  data-key="KeyH">CAVEAT</div>
        <div class="tbtn d-down"  data-key="KeyG">CLARIFY</div>
      </div>
    </div>

    <!-- Both cabinet controls in ONE corner so the screen carries a single
         piece of furniture instead of two. Icons are inline SVG rather than
         generated PNGs: at 44px painted art turns to mush, and vector stays
         crisp at every stage scale with nothing to load. -->
    <div id="cabbar">
      <button id="pauseBtn" class="cabbtn" type="button" aria-label="Pause">
        <svg viewBox="0 0 24 24" class="ico ico-pause"><rect x="6" y="4" width="4.5" height="16" rx="1.2"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.2"/></svg>
        <svg viewBox="0 0 24 24" class="ico ico-play"><path d="M7 4.5 L19 12 L7 19.5 Z"/></svg>
      </button>
      <button id="muteBtn" class="cabbtn" type="button" aria-label="Sound">
        <svg viewBox="0 0 24 24" class="ico ico-soundoff"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" fill="none"/></svg>
        <svg viewBox="0 0 24 24" class="ico ico-soundon"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.4 8.6a4.8 4.8 0 0 1 0 6.8M19.2 6.2a8.6 8.6 0 0 1 0 11.6" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>

    <div id="hud">
      <div class="hudside left">
        <div class="barouter" id="bar1"><div class="barchip" id="chip1"></div><div class="barinner" id="hp1"></div></div>
        <!-- Pill order is DOM order: inboard of each name, so both pills sit
             toward the centre of the screen rather than the outer edges.
             It reads GPU, not CPU — these two run inference. The internal
             flag stays isCPU; it is the arcade convention, not the joke. -->
        <div class="name"><span class="chrome" id="name1">RUST</span><span class="cpu" id="cpu1">GPU</span></div>
        <div class="meter"><div class="meterfill" id="meter1"></div></div>
        <div class="combo" id="combo1"></div>
      </div>
      <div class="hudside right">
        <div class="barouter" id="bar2"><div class="barchip" id="chip2"></div><div class="barinner" id="hp2"></div></div>
        <div class="name"><span class="cpu" id="cpu2">GPU</span><span class="chrome" id="name2">VOLT</span></div>
        <div class="meter"><div class="meterfill" id="meter2"></div></div>
        <div class="combo" id="combo2"></div>
      </div>
      <div id="timer" class="chrome">60</div>
      <div id="rounds"></div>
    </div>

    <div id="crt"><div class="lines"></div><div class="grille"></div><div class="vignette"></div></div>

    <div id="announce"></div>

    <div id="overlay">
      <div class="scrim"></div>
      <div class="inner" id="overlayInner"></div>
    </div>

  </div>
</div>


<script>
"use strict";
/* THE BUILD, hashed from this file's own source at boot.

   There is no build step to stamp a version into, and that is a feature worth
   keeping -- so the game fingerprints ITSELF: djb2 over the text of this very
   script tag, base36, last six characters. It changes when the code changes and
   it cannot go stale, because there is nothing to remember to update.

   It exists because a stale build is invisible and expensive. The measurement
   pages load index.html in an iframe whose src never changes. A browser serving
   it from cache therefore had them reporting confidently on a game that no
   longer existed, twice. headGap read back 20 after it was 10, and faceClear
   read undefined after it was added. Both times the numbers looked entirely
   plausible. A visible fingerprint turns that from a day of confusion into a
   glance.

   CONFIG.tune is a different thing and both are wanted. tune hashes the CONFIG,
   so a recorded match can be attributed to a balance. BUILD hashes the CODE, so
   a page can prove which one it is talking to. */
const BUILD = (() => {
  const src = (document.currentScript && document.currentScript.textContent) || "";
  let h = 5381;
  for (let i = 0; i < src.length; i++) h = ((h * 33) ^ src.charCodeAt(i)) >>> 0;
  return h.toString(36).slice(-6);
})();
/* ==================================================================
 * 1. CONFIG — everything tunable lives here.
 *    Swap the two participants, the phrase lists, the art paths, the
 *    key bindings or the AI difficulty without touching anything below.
 * ================================================================== */
const CONFIG = {
  stage:{ w:1600, h:900, groundY:170 },   // groundY = px up from stage bottom

  // ---- contact shadow ---------------------------------------------
  // What stops the bots reading as stickers that hover off the floor. The
  // ellipse needs a genuinely DARK core for that. A uniformly faint smudge
  // reads as something vaguely down there. A dark centre that fades out reads
  // as a foot in contact with the ground.
  //
  // core and mid are the gradient's own alphas, and opacity scales the whole
  // layer. The darkest pixel on screen is therefore core x opacity. Read that
  // product when tuning, and not either number alone.
  //
  // The floor is ALREADY near-black. Measured off the rendered stage, the
  // boards run 31-57 of 255. A darker shadow therefore has almost no room to
  // work in, and it was not the defect. What a shadow needs on a dark floor is
  // an EDGE. The falloff previously reached zero across the full radius, which
  // is a smudge with no shape. The density now holds out to midStop and drops
  // after it. That gives a defined ellipse, and the eye reads it as occlusion
  // even though the value barely changes.
  // The values sit between the two versions tried on screen. The original was
  // 0.58 core and 0.55 opacity, for a peak of 0.32, and it barely registered.
  // A peak of 0.70 was too heavy and read as a hole in the floor.
  shadow:{
    w:225, h:36,          // px on the stage; wider than the stance, not rounder
    drop:-15,             // px below the ground line, so it sits under the feet
    core:0.73, mid:0.50,  // gradient alpha at the centre and at midStop
    midStop:"57%",        // density holds out to here, then falls away fast
    opacity:0.68,         // layer opacity at ground level -> 0.50 peak black
    liftShrink:0.42,      // how much of its size a escalate takes away
    liftFade:0.46,        // how much of its opacity a escalate takes away
    liftFull:260,         // px of height at which the two above are fully applied
  },

  art:{
    // ONE STAGE PER EVAL, indexed by the eval number. Eval 1 gets [0], and so
    // on. A change of arena between evals is the arcade convention. It is what
    // makes a best-of-three read as three contests rather than as one contest
    // with the radio on.
    //
    // These are NOT paired with CONFIG.audio.eval. They were once, and this
    // comment claimed it long after applyStage() stopped doing it. The music
    // pool is five tracks and this list is three, so an index pairing could not
    // have held anyway. The invariant a test keeps is
    // `backdrops.length >= round.best`. That is enough stages that no single
    // match shows the same arena twice. Added tracks are free. Added evals are
    // not.
    //
    // ORDER IS AN ESCALATION, and the last step is the point. A match starts
    // underground in the turbine vault, comes up into the server hall, and
    // finishes on the surface of MARS. The decider is the one round that leaves
    // the planet, so the stage states that the stakes changed.
    //
    // It reads on the wheel too, at 258deg, 191deg and 10deg. The three evals
    // of a match never sit next to each other in hue. The run also ends
    // somewhere the first two rounds gave no reason to expect.
    //
    // MARS is the only warm stage. It exists because the set had no warm
    // quadrant at all. The others span 191 to 258 degrees while RUST is hue 27.
    // Nothing on any stage was therefore within 160 degrees of the warmest
    // thing in the game. A participant on ground that shares its hue is how a
    // participant is lost. The reason it works here is VALUE rather than hue.
    // Mars is the darkest plate in the set at 0.246 against RUST at 0.878. RUST
    // separates by brightness, so the 17-degree hue gap costs no legibility.
    // Check that separation before any regrade of this plate to a lighter
    // value.
    backdrops:["assets/backdrop-vault.jpg",     // violet turbine vault
               "assets/backdrop-datacenter.jpg",// cyan server hall
               "assets/backdrop-mars.jpg"],     // rust-red Martian plain
    // The menus get a stage of their OWN rather than borrowing the first
    // arena. It is the widest shot of the set and the only one with a horizon.
    // That suits a screen meant to be read rather than played on. The first
    // arena is then a reveal rather than something already stared at.
    titleBackdrop:"assets/backdrop-rooftop.jpg",  // navy city rooftop
    // The iris that covers a stage change. closeMs is deliberately shorter
    // than openMs: shutting is punctuation and wants to feel decisive, while
    // opening is the reveal of a new arena and wants to be looked at.
    iris:{ closeMs:420, openMs:620, soft:90 },
    logo:"assets/logo.png",
    // Bump this whenever a bitmap in assets/ is REPLACED IN PLACE. Filenames
    // never change, so a browser keeps serving whatever it cached the first
    // time. Correct files then sit on disk while the game draws the old ones.
    // Only the query string differs, and that is enough to force a refetch.
    //
    // It is applied to EVERY bitmap, and not only the backdrop and logo.
    // Sprites and bursts used to be exempt, on the grounds that new art gets a
    // new filename. The packaging step resizes and recompresses them under
    // their existing names, so they are replaced in place like anything else.
    version:"34",
    // RESOLVED art now comes from CONFIG.phrases.resolved — see the resolve overlay.

    // The CSS marquee that stands in for a missing logo.png. Every value here
    // is published to CSS custom properties at boot, so the wordmark is tuned
    // from CONFIG like everything else. Two stacked lines: a small wide-tracked
    // word over a big one, the way a cabinet marquee is set.
    wordmark:{
      line1:"BOT", line2:"ARENA",
      size1:112, size2:182,      // px, in stage coords
      track1:26,  track2:8,      // letter-spacing
      tilt:13,                   // deg of rotateX — the marquee leans back
      skew:-7,                   // deg of skewX — the italic lean
      ink:"#07030c",             // heavy outline + the slab itself
      outline:26,                // px of that outline
      rim:"#ff2fd0", rimWidth:11,// neon edge, drawn INSIDE the black outline
      extrude:"#3a0f57",         // the 3D side delivered down-right
      depth:9,                   // extrusion steps (2px each)
      glow:"#ff2fd0",
      bar:true,                  // the underlighting strip beneath the words
    },
  },

  audio:{
    // Base paths, deliberately WITHOUT an extension. The container is chosen
    // at runtime (see Sound.ext) because the best-supported one differs by
    // engine, and the two looping tracks need a GAPLESS one specifically.
    // A LIST, cycled for each round. One loop is fine for a demo and wearing
    // by the third eval. The cheapest variety available is more of them. Order
    // is the rotation order, so the track a new player hears first stays the
    // same.
    // STAGE music, for every eval except the decider. It is a pool rather than
    // a fixed list of three. The backdrop is keyed to the eval number now,
    // rather than to which track came up. The playlist can therefore be any
    // length, and a rematch does not have to sound identical.
    eval:["assets/audio/eval-loop",           // 57s — the original
            "assets/audio/stage-steel-foundry",   // heroic funk-rock, 171s
            "assets/audio/stage-turbine-vault",   // hard rock, 158s
            "assets/audio/stage-coolant-hall",    // jazz-funk, 153s
            "assets/audio/stage-cold-storage"],   // icy and sleek, 125s
    // The DECIDER gets its own music. Arcade convention, and it is the one
    // round where both participants are one win from the end.
    //
    // The decider is also always the MARS stage, so everything in this pool
    // plays over a Martian sunset. Red Planet was written for it -- space-age
    // sci-fi funk on the Capcom spine rather than the two interior-sounding
    // themes beside it. Three tracks means it comes up a third of the time; if
    // the stage and its theme should always arrive together, this list becomes
    // that one entry, at the cost of the other two.
    boss:["assets/audio/boss-overseer",           // driving boss theme
          "assets/audio/boss-final-iteration",    // frantic, 45s
          "assets/audio/boss-red-planet"],        // space-age, for Mars, 141s
    // Swapped in mid-round the first time either health bar goes critical.
    tension:["assets/audio/tension-last-stand",   // 46s
             "assets/audio/tension-final-seconds"],// 64s
    title:"assets/audio/title-theme",     // high-energy intro, loops
    // The attract demo gets its own theme rather than borrowing the menus',
    // for the same reason the menus have their own backdrop.
    attract:"assets/audio/title-neon-rooftop",
    champion:"assets/audio/victory-champion",   // plays over the result screen
    continueCue:"assets/audio/cue-continue",    // between evals
    victory:"assets/audio/victory",       // 1.95s sting
    loss:"assets/audio/loss",             // 2.43s sting
    // In preference order, best first.
    //
    // Opus loops SAMPLE-ACCURATELY. Its encoder delay is recorded as a
    // pre-skip in the header, and browsers honour it. MP3 and AAC both carry
    // encoder padding instead. A decoded file is then longer than the audio it
    // holds, and the loop point lands in silence. That is an audible tick on
    // every lap, and it is why the fallback is second rather than the only
    // format.
    // Opus is also just smaller: the four tracks are 1.2MB against 1.5MB.
    formats:[
      { ext:"webm", mime:'audio/webm; codecs="opus"' },
      { ext:"m4a",  mime:'audio/mp4; codecs="mp4a.40.2"' },
    ],
    // Impact sounds, split by register so the two moves stay distinguishable
    // with the music up: AFFIRM is the lighter 500Hz glide, CLARIFY the heavier
    // 210Hz drop. Both are ~135ms, deliberately dull (2.6kHz ceiling) and slow
    // to open (~23ms). A conceded fires many times a round straight into headphones,
    // and a fast, bright transient is what makes that tiring.
    // NOTE: these are level-set by a single static gain, NOT by loudnorm. A
    // limiter on a transient this short chews the response and reads as clipping.
    // The BYTES live in SFX_DATA further down, base64-inlined; the .wav files
    // in assets/audio are the source they are generated from. See SOUNDS.md.
    // How long the win/loss sting owns the room before the theme comes in
    // underneath the result screen.
    stingMs:1800,
    // Health fraction at which the stage track gives way to a tension track.
    // A quarter is late enough to mean something and early enough to still
    // have a round left to play.
    tensionAt:0.25,
    musicVolume:0.4, stingVolume:0.7,
    // Ducked under the comic burst: the burst is the loud part of a landed

    sfxVolume:0.45,
    caveatVolume:0.22,   // a stopped move is a quieter event than a landed one
    // Per-voice pitch jitter, +/- this fraction. Two participants can trade in the

    sfxDetune:0.06,
