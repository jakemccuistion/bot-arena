  learn = { moves:{}, deliveries:0, roundsLost:0, playerDmg:0, cpuDmg:0 };
}
function learnMove(kind){
  if (!learn) learnReset();
  learn.moves[kind] = (learn.moves[kind] || 0) + 1;
  learn.deliveries++;
}

/* 0 to the rung's ceiling. Three signals, and the weighting IS the design:
   habit dominates, because being worked out should feel like being read, while
   an opponent that improves purely because it is behind feels like cheating. */
function adaptLevel(){
  const A = CONFIG.ai, cap = A.adaptMax || 0;
  if (!cap || !learn || learn.deliveries < A.adaptMinDeliveries) return 0;
  const counts = Object.values(learn.moves);
  const top = counts.length ? Math.max(...counts) : 0;
  // 0.5 is an even split between the two moves; 1.0 is one move and nothing else.
  const habit = Math.max(0, (top / learn.deliveries - 0.5) * 2);
  const seen = learn.playerDmg + learn.cpuDmg;
  const exchange = seen > 0
    ? Math.max(0, (learn.playerDmg - learn.cpuDmg) / seen) : 0;
  const rounds = Math.min(1, learn.roundsLost / 2);
  return cap * Math.min(1, A.adaptHabit * habit
                         + A.adaptExchange * exchange
                         + A.adaptRounds * rounds);
}
/* A dial moved toward certainty by what has been learned. A dial that starts
   at zero stays at zero. Adaptation sharpens what a rung already does, and it
   never hands one a tool it was not given. */
function dialUp(base){
  const b = base || 0;
  return b <= 0 ? 0 : Math.min(1, b + (1 - b) * adaptLevel());
}

/* The move this opponent is repeating, or null. It counts consecutive repeats
   rather than a frequency over the window. A player who alternates two moves
   evenly is NOT predictable in the sense that matters, because the next one
   still cannot be named. Four CLARIFYs in a row name it exactly.

   `readAfter` is per rung and is the honest difficulty dial. THINK never reads
   at all, THINK HARD needs a long habit, and ULTRATHINK needs three. That is
   also what the rungs claim to be selling, because the ladder is labelled
   THINKING EFFORT. */
function readMove(f){
  // Reads sooner the more it has learned, but never on fewer than two: one
  // delivery is not a habit, it is a delivery.
  const base = CONFIG.ai.readAfter;
  /* ONE FEWER REPEAT ONCE AN EVAL HAS BEEN DROPPED. The second eval is played
     by a bot that has watched a whole round of you, and it should show.

     It is kept OUT of adaptLevel's blend deliberately. That blend encodes a
     hierarchy, in which habits matter most, then the exchange, then the score.
     A weight large enough to move this threshold would have inverted it. This
     is a separate and smaller claim, about information rather than about
     momentum, so it gets its own step and leaves the hierarchy alone.

     It is bounded by the same floor. Two repeats is the least it will ever ask
     for, because one delivery is not a habit, and neither is two in a row by
     accident. */
  const dropped = (learn && learn.roundsLost > 0) ? 1 : 0;
  const need = base
    ? Math.max(2, Math.round(base - adaptLevel() * 2) - dropped) : 0;
  const h = f.counterpartMoves;
  if (!need || !h || h.length < need) return null;
  const last = h[h.length - 1];
  for (let i = h.length - need; i < h.length; i++)
    if (h[i] !== last) return null;
  return last;
}
function breathes(f){
  return f.y === 0
      && f.state === "idle"
      && Math.abs(f.vx) < 0.5
      && f.recover <= 0;
}
/* Which pose a participant's current state should draw. It is pulled out of
   render() so it can be asserted against directly. The anticipation window is
   four frames wide and exists only mid-response. A test cannot catch that by
   driving the renderer and reading class names. */
function poseFor(f){
  let pose = f.state;
  /* ANTICIPATION. A response's startup frames show a wind-up rather than the
     response itself. This costs nothing in frame data. The startup window
     already exists, `responseBox()` reads the same expression to decide when
     the response box opens, and the pose swap lands entirely inside it.

     It is worth a render because the affirm needs it. Silhouette distance
     between poses, put through this same transform (tests/handshake.html):
     idle to affirm changes the outline 19.9%, which is LESS than the erasure
     of one of the participant's arms at 21.3%. idle to clarify changes it
     57.8%. The two responses were nearly 3x apart in readability, and the
     affirm was on the wrong side of that. It started to matter once the reach
     and depletion pass turned AFFIRM into the move people actually use. A pass
     through the wind-up makes the change 41.3% at the instant the response box
     opens.

     AFFIRM ONLY, and that is a measured decision rather than a shortcut.
     CLARIFY does not have the problem, because it already changes the
     silhouette 57.8% off idle. The same pose makes it WORSE, at 45.9%, because
     the wind-up is closer to a clarify's outline than idle is. Volt agrees in
     both directions: affirm 28.9% to 53.8%, and clarify 72.9% to 74.1%, for no
     gain. The art says the same thing the numbers do. A pose with both fists
     drawn back is an affirm being loaded. A reading of it as the tell for a
     clarify would misstate what is coming. */
  if (f.state==="affirm" || f.state==="clarify"){
    const A = CONFIG.responses[f.state];
    const frame = A ? A.lock - f.stateTimer : 0;
    if (A && f.state==="affirm" && frame < A.active[0]) pose = "handshake";
    else if (A && frame > A.active[1]){
      // Late recovery reads as pulling back, not as a held pose.
      const rec = A.lock - A.active[1] - 1;
      if (frame - A.active[1] > rec * CONFIG.responses.recoveryHold) pose = "idle";
    }
  }
  /* FOLLOW-THROUGH. The first moment of concedeLock shows a deeper reaction and
     then settles into `conceded`. A concession therefore reads as one motion
     rather than as a single held picture. It is keyed off the SAME expression
     that concedeSetback() uses for its lean, which is frames since the response
     landed. The pose and the lean therefore cannot drift apart.

     v4 was selected over a candidate that measured much closer to `conceded`.
     That candidate read as the same motion continuing. This one reads as the
     heavier response. Measured against the shipping pose: 64.0% from neutral,
     where `conceded` itself is 66.0%, and 69.1% from `concluded`, which is the
     furthest of any candidate. It therefore reads as forceful and is never
     mistakable for a fall. */
  /* THE POSE FOLLOWS THE LEAN, rather than running on shares of its own.

     concedeSetback() builds its lean over `concedeFlinchFrames` and releases it
     across (concedeSpan - rise) / followSpeed. At followSpeed 4 that whole
     motion is over in about ten frames. The pose was switching on independent
     fractions of the FULL concedeLock and did not reach neutral until frame 15,
     or 22 counting the freeze. The body visibly stopped moving and the picture
     then changed twice more. That is a ratchet, and it arrives well after the
     response.

     The shares also never accounted for the freeze. A frozen participant does
     not decrement concedeFrames, so `done` does not advance during it. The deep
     setback was on screen for 216ms on AFFIRM and 283ms on CLARIFY, with more
     than half of that completely static.

     The picture is now keyed to the same two constants the transform uses, so
     it resolves exactly when the motion does: setback while the lean builds,
     conceded while it releases, and neutral once it is home. */
  if (f.state==="conceded" && f.concedeSpan > 0 && f.concedeFrames > 0){
    const P = CONFIG.physics;
    const done = f.concedeSpan - f.concedeFrames;
    const rise = Math.min(P.concedeFlinchFrames, f.concedeSpan);
    const settled = rise + Math.max(1, (f.concedeSpan - rise) / P.followSpeed);
    if (done < rise) pose = "setback";
    else if (done >= settled) pose = "idle";
  }
  if (f.state==="idle"){
    if (f.y > 0) pose = "escalate";
    else if (Math.abs(f.vx) > 0.5) pose = "idle";   // no walk art -> idle
  }
  if (f.y > 0 && (f.state==="idle")) pose = "escalate";
  /* Bridges the one or two frames between a commit ending and the next press
     landing. It is applied last and only to a grounded idle, so it can never
     mask a response, a concession, a defer or an escalate. All of those have
     something to say and say it immediately. A just-released guard is the one
     transition with nothing to show, which is why it is the one that
     flickers. */
  if (pose === "idle" && f.y === 0 && f.caveatPoseHold > 0) pose = "caveat";
  return pose;
}

function render(now){
  for (const f of F){
    showPose(f, poseFor(f));

    // No walk cycle exists in the art, so a moving participant is a static
    // sprite that travels sideways. That is what reads as sliding. A small
    // vertical bob keyed to DISTANCE TRAVELLED, rather than to time, restores
    // the up-and-down rhythm a gait has. Because it is distance-keyed it slows
    // automatically when the participant does, and stops flat when they
    // stop.
    if (f.y === 0 && Math.abs(f.vx) > 0.5){
      f.walkPhase = (f.walkPhase || 0) + Math.abs(f.vx) * CONFIG.physics.walkBobRate;
    } else if (f.y === 0){
      f.walkPhase = 0;
    }
    const bob = f.y === 0 && f.walkPhase
      ? Math.abs(Math.sin(f.walkPhase)) * CONFIG.physics.walkBobPx : 0;
    /* SQUASH AND STRETCH, about the feet. See transform-origin on
       .participant. Volume is preserved, because sx is 1/sy. A scale that only
       flattens reads as a compressed sprite, and one that widens as it
       flattens reads as weight. That pairing is the whole principle and it is
       free.

       The settle uses sin(p*PI). It is zero at the moment of contact, deepest
       at the midpoint, and zero again on exit. Six frames down and six back.
       It arrives at exactly 1.0 rather than near it, so nothing is left
       leaning when the animation ends. */
    const rec = concedeSetback(f);
    let sy = 1;
    if (rec){
      sy = rec.sy;
    } else if (f.landFrames > 0){
      const p = 1 - f.landFrames / CONFIG.physics.landSettleFrames;
      sy = 1 - CONFIG.physics.landSquashMax * (f.landPower || 1) * Math.sin(p * Math.PI);
    } else if (breathes(f)){
      sy = 1 + CONFIG.physics.breathAmp
             * Math.sin(now * 2 * Math.PI / CONFIG.physics.breathPeriodMs);
    }
    const sx = 1 / sy;
    // The delivery lean rides on top, in WORLD px. It is therefore applied
    // before the facing flip, and it reads the same on both sides of the
    // stage.
    /* The delivery is in the participant's own frame and is multiplied by
       facing to reach world. The setback is already world, because it is
       relative to where the response came from. The two are mutually exclusive
       in practice, because a participant cannot be mid-delivery and in
       concedeLock at once. The setback wins if they ever overlap, because a
       concession interrupts whatever was in progress. */
    const sw = deliveryOffset(f);
    const lx = rec ? rec.dx : sw ? sw.dx * f.facing : 0;
    const rot = rec ? rec.rot : sw ? sw.rot * f.facing : 0;
    const left = f.x - f.def.bodyW/2 + lx;
    f.node.style.transform =
      `translate(${left}px, ${-f.y - bob}px) rotate(${rot}deg) `
      + `scaleX(${f.facing * sx}) scaleY(${sy})`;
    /* WHERE THE ART ACTUALLY ENDED UP, recorded here because this is the only
       place that knows all of it. Burst placement needs the top of the drawn
       sprite. Three separate things move it away from `ground - y - spriteH`.
       The pose on screen renders at its own height, and a low stance is 267px
       against an idle 400. The walk bob lifts the whole node. sy carries the
       landing squash and the breath. Any re-derivation of that in the
       placement code would be a second model of the render, and the first one
       already drifted 153px. */
    const drawnH = (f.poseNode ? parseFloat(f.poseNode.style.height) : NaN) || f.def.spriteH;
    f.footY = (STAGE.h - CONFIG.stage.groundY) - f.y - bob;
    f.headY = f.footY - drawnH * sy;

    // The shadow tracks x only, and SHRINKS and fades with height. One that
    // held its size while its caster climbed would read as a decal painted on
    // the floor rather than as contact with it.
    if (f.shadow){
      const S = CONFIG.shadow;
      const lift = Math.min(1, f.y / S.liftFull);
      f.shadow.style.transform =
        `translateX(${f.x}px) scale(${(1 - lift*S.liftShrink).toFixed(3)})`;
      f.shadow.style.opacity =
        (S.opacity * (1 - lift*S.liftFade)).toFixed(3);
    }
  }

  // On-screen controls belong to the ROUND, not to the menus. Showing move
  // and response buttons over a select screen offers actions that do nothing,
  // on a select screen the d-pad also collides with the longest blurb.
  // Countdown is included so they are already in place when the round starts
  // rather than popping in on the first frame of play.
  if (isTouch)
    el("touch").classList.toggle("on", phase === "countdown" || phase === "active");

  // HUD
  const pct = f => Math.max(0, f.health / f.def.maxHealth) * 100;
  for (let i=0;i<2;i++){
    const bar = el("hp"+(i+1)); const p = pct(F[i]);
    bar.style.width = p + "%";
    bar.style.backgroundColor =
      p > 50 ? getCSS("--hud-hi") : p > 22 ? getCSS("--hud-mid") : getCSS("--hud-lo");
    // The chip is given the SAME target and simply arrives late, courtesy of
    // its own transition delay. Nothing here needs to know it is lagging.
    el("chip"+(i+1)).style.width = p + "%";
    // Chain counter. It is driven off the HOLD CLOCK rather than off
    // chainCount, because chainCount is not cleared when a chain ends. It
    // survives on the participant until their next response overwrites it. A
    // direct read would therefore leave the last number parked on screen for
    // the rest of the round.
    // REASON meter. Three states, and they must be distinguishable: filling,
    // full-and-ready, and currently spent-and-running.
    const RE = CONFIG.reason, mf = el("meter"+(i+1));
    const lit = reasonActive(F[i]);
    mf.style.width = (F[i].reason / RE.max * 100) + "%";
    mf.classList.toggle("full", !lit && F[i].reason >= RE.max);
    mf.classList.toggle("lit", lit);
    const live = phase === "active" && F[i].chainCount >= 2
                 && now < (F[i].comboUntil || 0);
    const cd = el("combo"+(i+1));
    if (live) cd.textContent = F[i].chainCount + " " + CONFIG.responses.comboLabel;
    cd.classList.toggle("on", live);
  }
  // The demo shows its OWN clock. timeLeft is match state and the demo never
  // touches it.
  const secs = Math.ceil(phase==="attract" ? attractTimeLeft : timeLeft);
  el("timer").textContent = secs;
  el("timer").classList.toggle("low", phase==="active" && secs <= 10);
  // Round furniture: hidden wherever there is no round to describe.
  el("hud").classList.toggle("off", phase==="title" || phase==="select");
  // Same rule for PAUSE, which can only act during a round. SOUND is a cabinet
  // control and stays on every screen.
  el("cabbar").classList.toggle("nopause",
    !(phase==="countdown" || phase==="active" || phase==="paused"));

  // screen shake. It is gated HERE, at the point it becomes visible, rather
  // than only in shake(). A test caught the difference. A gate on the request
  // alone stops new shakes and lets one already in flight run to completion.
  // The moment this setting is turned on is very often the moment the screen
  // is already moving. A read at application makes it immediate.
  const s = (!reduceMotion.matches && now < shakeUntil) ? CONFIG.screenShake.px : 0;
  const dx = s ? (visualRandom()*2-1)*s : 0, dy = s ? (visualRandom()*2-1)*s : 0;
  stageEl.style.transform = `${fitTransform()} translate(${dx}px,${dy}px)`;
  /* THE CONTROLS DO NOT SHAKE. The touch layer is a child of the stage on
     purpose -- that is what keeps it scaled and positioned with the game -- so
     it inherits the shake, and a control that moves under the thumb reads as
     the button dodging rather than as the game reacting. The playfield is the
     thing responding; the pad is furniture in the room.

     Cancelled rather than reparented, so the layer keeps every other property
     of living inside the stage. The offset is applied INSIDE the same scale
     the stage carries, so an equal and opposite translate cancels it exactly
     -- no division by fitScale, which would over-correct. */
  if (touchEl) touchEl.style.transform = s ? `translate(${-dx}px,${-dy}px)` : "";
}
const getCSS = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ---- scale the whole stage to fit, letterboxed ---- */
let fitScale = 1, fitX = 0, fitY = 0;
function fitTransform(){ return `translate(${fitX}px, ${fitY}px) scale(${fitScale})`; }
/* THE VISIBLE AREA, NOT THE WINDOW. On a phone innerHeight is not what you can
   see: Safari reports the pre-settle height while the toolbars are still on
   their way out, so a fit computed at boot describes a viewport that stops
   existing a frame later -- which is how the stage ends up translated off its
   own screen on first load, and why nothing on a desktop reproduces it.
   visualViewport is the area actually visible and is the right input; the
   window is the fallback for engines without it. */
function viewport(){
  const v = window.visualViewport;
  return (v && v.width) ? { w: v.width, h: v.height }
                        : { w: innerWidth, h: innerHeight };
}
function fit(){
  const { w: vw, h: vh } = viewport();
  const portrait = vh > vw;
  document.body.classList.toggle("portrait", portrait && isTouch);
  // The controls are overlaid on the game rather than sitting in a band
  // beneath it, so the stage gets the full height in portrait.
  const avail = vh;
  fitScale = Math.min(vw/STAGE.w, avail/STAGE.h);
  // Offset the SCALED size, not the layout size. Portrait pins the stage near
  // the top so the touch controls own the band underneath it.
  // NEVER NEGATIVE. A translate computed from a viewport larger than the real
  // one pushes the stage down and right, off the edge, and the player sees a
  // corner of the game. Clamping cannot make the fit correct on its own, but it
  // bounds how wrong a stale measurement is allowed to look.
  fitX = Math.max(0, (vw - STAGE.w*fitScale) / 2);
  fitY = Math.max(0, (vh - STAGE.h*fitScale) / 2);
  stageEl.style.transform = fitTransform();
}
addEventListener("resize", fit);
addEventListener("orientationchange", ()=>setTimeout(fit,120));
/* THE VIEWPORT SETTLES AFTER THE FIRST PAINT, and none of the events above
   necessarily fire when it does. iOS collapses its toolbars, restores a
   scroll position and reports a new height over the first second or so, in
   whatever order it likes. Re-fitting is idempotent and costs one transform,
   so it is cheaper to do it at every point the size could have changed than to
   guess which one is authoritative on a given version. */
if (window.visualViewport){
  visualViewport.addEventListener("resize", fit);
  visualViewport.addEventListener("scroll", fit);
}
addEventListener("pageshow", fit);
addEventListener("load", () => { fit(); for (const t of [60, 250, 600, 1200]) setTimeout(fit, t); });

const Sound = {
  tracks:{},
  make(name, src, loop, vol){
    // Busted like the bitmaps are. Tracks are REPLACED under the same name,
    // and eval-loop has been a different song twice now. That is exactly the
    // case bust() exists for, and audio was the one loader not using it. A
    // returning player would have gone on hearing the retired track.
    const a = new Audio(); a.src = bust(src); a.loop = !!loop; a.volume = vol;
    a.addEventListener("error", ()=>{ a.dataset.silent="1"; }, {once:true});
    /* A PAUSE WE DID NOT ASK FOR IS AN INTERRUPTION, AND IT IS RECOVERABLE.
       iOS gives a page ONE audio session. Resuming the Web Audio context
       reconfigures it, and that interrupts the media element carrying the
       music -- so a contact sound could stop the song. dataset.want records
       what this code last asked for, so an unrequested pause can be told
       apart from hold(), stopAll() or the mute switch, and only that kind is
       undone. Without the distinction, it would override the pause screen. */
    /* AND IT IS RATE-LIMITED, NOT COUNTED. A recovery that cannot give up is a
       runaway -- pause calls play, play produces another pause, and the two
       chase each other as fast as the event loop allows until the tab gives
       out. But a recovery that gives up PERMANENTLY is silence, which is the
       other failure and the one a player actually notices. A count of attempts
       chooses one of those; a limit on the RATE avoids both, because what
       makes a runaway dangerous is its frequency and not its persistence.
       Four attempts a second cannot melt anything and never stops trying. */
    a.addEventListener("pause", ()=>{
      if (a.dataset.want !== "play" || Sound.muted) return;
      if (Sound.tracks[Sound.current] !== a) return;
      const now = performance.now();
      if (now - (+a.dataset.recoverAt || 0) < 250) return;
      a.dataset.recoverAt = String(now);
      a.play().catch(()=>{});
    });
    this.tracks[name] = a; return a;
  },
  /* Which container this engine actually wants. canPlayType answers probably,
     maybe, or an empty string. Anything non-empty is worth trying, and the last
     format is the fallback for an engine that admits to nothing. */
  ext: (() => {
    const probe = document.createElement("audio");
    const F = CONFIG.audio.formats;
    return (F.find(f => probe.canPlayType(f.mime)) || F[F.length - 1]).ext;
  })(),
  /* A logical track name may map to SEVERAL files. play() cycles them, so the
     eval name means the next eval track rather than one particular file.
     Everything that already asks for eval gets the variety for free. */
  variants:{},
  init(){
    const C = CONFIG.audio, e = "." + this.ext;
    // Any config entry that is a LIST becomes a cycling logical track. Done
    // generically, a boss or tension playlist added later is a config edit
    // rather than a code edit. It is also how the eval name already worked, so
    // this is the same idea stated once instead of three times.
    const pool = (key) => {
      const list = Array.isArray(C[key]) ? C[key] : [C[key]];
      this.variants[key] = list.map((src, i) => {
        const name = i ? key + i : key;
        this.make(name, src + e, true, C.musicVolume);
        return name;
      });
    };
    pool("eval"); pool("boss"); pool("tension");
    this.make("title",   C.title   + e, true, C.musicVolume);
    this.make("attract", C.attract + e, true, C.musicVolume);
    this.make("champion",C.champion+ e, true, C.musicVolume);
    this.make("continueCue", C.continueCue + e, true, C.musicVolume);
    this.make("victory",C.victory+ e, false,C.stingVolume);
    this.make("loss",   C.loss   + e, false,C.stingVolume);
    this.initSfx();
    // The first gesture of any kind unlocks the whole set -- see unlock().
    // Registered here rather than on the sound button alone, so starting a
    // game authorises the music too and the switch works from then on.
    for (const ev of ["pointerdown", "touchend", "keydown"])
      addEventListener(ev, () => this.unlock(), { once:true, capture:true });
  },

  /* A GESTURE AUTHORISES AN ELEMENT, NOT THE PAGE. iOS grants playback to the
     media element that was played DURING a user gesture and to no other. The
     mute switch starts only the CURRENT track, so exactly one of the eleven
     elements was ever authorised; every other one begins from a timer -- a
     round starting, the attract cycle turning over -- and is refused. The
     music therefore plays until the song changes, and whether it plays at all
     depends on which track happened to be current when the switch was tapped.

     It fails silently because a refused play() rejects a promise, and every
     call site here ends in .catch(()=>{}).

     So the first gesture touches all of them: play, then pause immediately.
     Nothing is audible -- the elements do not advance far enough to sound --
     and each is authorised from that point on. Muted or not, because the
     gesture is the only chance to do it and there may not be another. */
  /* ONE SESSION, ONE GRAPH -- the cure rather than the recovery above.
     iOS gives a page a single audio session. Music on a media element and
     contact sounds on a Web Audio context are two claimants on it, and the
     symptom of them contending is the music stopping when a sound plays.
     Routing the elements THROUGH the context ends the contention: there is
     then one output, and nothing to interrupt.
     The elements keep streaming, which is why they were chosen -- a track held
     as a decoded buffer is tens of megabytes, and there are sixteen of them.
     createMediaElementSource does not change that; it redirects the output of
     a still-streaming element into the graph.
     It may only be called once per element and errors on a second attempt, so
     the flag is the guard. If it is unavailable the element keeps its own
     output and behaves exactly as it did before -- worse on iOS, unchanged
     everywhere else, and never silent. */
  route(){
    if (!this.ctx || !this.musicGain) return;
    for (const k in this.tracks){
      const a = this.tracks[k];
      if (!a || a.dataset.routed) continue;
      try {
        this.ctx.createMediaElementSource(a).connect(this.musicGain);
        a.dataset.routed = "1";
      } catch(_){ a.dataset.routed = "no"; }
    }
  },
  unlocked:false, keepAlive:null,
  unlock(){
    if (this.unlocked) return;
    this.unlocked = true;
    /* AND HOLD THE CONTEXT OPEN. The cure above treats the symptom; this
       removes the cause. iOS suspends an idle AudioContext, and sfx() resumes
       it on the next contact sound -- so the session was being reconfigured
       mid-song, repeatedly, which is heard as the music cutting in and out.
       A silent looping source keeps the context running, so it never idles
       and that resume never fires. One sample at zero gain: inaudible, and
       cheaper than the interruption it prevents. Started here because a
       context may only be resumed from a gesture. */
    if (this.ctx){
      if (this.ctx.state === "suspended") this.ctx.resume();
      if (!this.keepAlive){
        const src = this.ctx.createBufferSource();
        src.buffer = this.ctx.createBuffer(1, 1, this.ctx.sampleRate);
        src.loop = true;
        const g = this.ctx.createGain(); g.gain.value = 0;
        src.connect(g).connect(this.ctx.destination);
        src.start();
        this.keepAlive = src;
      }
      this.route();
    }
    for (const k in this.tracks){
      const a = this.tracks[k];
      if (!a || a.dataset.silent) continue;
      const quiet = () => { if (k !== this.current || this.muted){
        a.dataset.want="pause"; a.pause(); try { a.currentTime = 0; } catch(_){} } };
      let p; try { p = a.play(); } catch(_){ continue; }
      if (p && p.then) p.then(quiet, ()=>{}); else quiet();
    }
  },
  /* ---- impacts: Web Audio, deliberately NOT media elements -------------
     Music stays on <audio> because that is what media elements are good at:
     they STREAM a long loop instead of holding it decoded in memory, and
     eval-loop.wav is ~18MB as a decoded buffer.

     Impacts are the opposite problem, and a pool of <audio> elements is the
     wrong tool for them. Playing one means assigning `.src`, which invokes the
     HTML media load algorithm: the element drops to readyState 0, re-fetches,
     re-decodes, and play() only reaches the speakers once it climbs back to
     HAVE_FUTURE_DATA. The sound then starts when DECODE finishes rather than
     when the response lands. Measured that way: 1.3ms median but a 242ms worst
     case, and it is the SPREAD that is audible — erratic timing reads as
     broken where uniform latency does not. Pool size cannot fix it, because
     the load is per-conceded.

     A decoded AudioBuffer has no readyState to climb (0.1ms, no spread).
     Source nodes are cheap, single-use and self-collecting, so there is no
     pool to size and no ceiling on overlap. --------------------------------- */
  ctx:null, buffers:{}, sfxGain:null, musicGain:null,
  initSfx(){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;               // no Web Audio: silent concessions, not a crash
    this.ctx = new AC();           // starts suspended; the mute button resumes it
    this.sfxGain = this.ctx.createGain();
    this.sfxGain.gain.value = this.muted ? 0 : 1;
    this.sfxGain.connect(this.ctx.destination);
    this.musicGain = this.ctx.createGain();
    this.musicGain.connect(this.ctx.destination);
    // Decode NOW, while the context is still suspended, so the buffers are
    // ready long before the first conceded instead of racing it.
    for (const id in SFX_DATA){
      const bin = atob(SFX_DATA[id]);
      const bytes = new Uint8Array(bin.length);
      for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
      this.ctx.decodeAudioData(bytes.buffer)
              .then(buf => { this.buffers[id] = buf; })
              .catch(()=>{});
    }
  },
  sfx(id, vol){
    if (this.muted || !this.ctx) return;
    const buf = this.buffers[id];
    if (!buf) return;              // decode still in flight; drop it silently
    if (this.ctx.state === "suspended") this.ctx.resume();
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const d = CONFIG.audio.sfxDetune;
    src.playbackRate.value = 1 + (visualRandom()*2 - 1) * d;
    const g = this.ctx.createGain();
    g.gain.value = vol ?? CONFIG.audio.sfxVolume;
    src.connect(g).connect(this.sfxGain);
    src.start();                   // no stop() needed — it frees itself
  },
  // Starts MUTED on purpose. A cabinet page that plays music the instant it
  // loads is hostile, and browsers prevent autoplay anyway. The honest default
  // is silence plus a visible switch.
  muted:true,
  /* Cycle rather than shuffle. Random repeats itself — hearing the same loop
     twice running is exactly what this is meant to stop, and it is the case a
     player notices. A silent file is skipped, so a missing track costs its turn
     and not the music. */
  cursor:{},
  pick(n){
    const v = this.variants[n];
    if (!v) return n;
    for (let i = 0; i < v.length; i++){
      const k = v[(this.cursor[n] = ((this.cursor[n] ?? -1) + 1)) % v.length];
      if (!this.tracks[k]?.dataset.silent) return k;
    }
    return v[0];
  },
  /* An explicit index picks a variant outright instead of advancing the
     cursor. Rounds use it, so eval N always lands on stage N -- see the note
     in startRound. Callers with no particular track in mind (the attract
     demo) still just cycle. */
  at(n, i){
    const v = this.variants[n];
    if (!v) return n;
    return v[((i % v.length) + v.length) % v.length];
  },
  play(n, index){ const k = index == null ? this.pick(n) : this.at(n, index);
           const a=this.tracks[k];
           if(!a||a.dataset.silent) return;
           this.current=k; if(this.muted) return;
           a.currentTime=0; a.dataset.want="play"; a.play().catch(()=>{}); },
  /* START IT ONLY IF IT IS NOT ALREADY RUNNING. play() sets currentTime to 0.
     That is right when a new track takes over and wrong every other time.
     titleScreen() called stopAll and then play on EVERY draw. The attract cycle
     is title, demo, records card, title, so the theme was cut back to the top
     on every lap. The restart was audible mid-song a few minutes in, at the
     exact moment the screen switched.

     A loop that is already looping should be left alone. This checks that the
     track is the current one AND is actually playing before deciding there is
     nothing to do. It therefore still recovers from a stopAll, or from a track
     that ended. */
  ensure(n){ const ks = this.variants[n] || [n];
             const cur = this.tracks[this.current];
             if (cur && ks.includes(this.current) && !cur.paused) return;
             this.stopAll(); this.play(n); },
  /* Pausing must not restart the loop, and must not advance the rotation:
     coming back from the pause screen into a different song half a bar in is
     a bug the player hears as the game losing its place. */
  hold(){ const a=this.tracks[this.current]; if(a){ a.dataset.want="pause"; a.pause(); } },
  unhold(){ const a=this.tracks[this.current];
            if(a && !this.muted){ a.dataset.want="play"; a.play().catch(()=>{}); } },
  stop(n){ for (const k of (this.variants[n] || [n])){
             const a=this.tracks[k]; if(!a) continue;
             a.dataset.want="pause"; a.pause();
             if(this.current===k) this.current=null; } },
  stopAll(){ for(const k in this.tracks){ const a=this.tracks[k];
               if(a){ a.dataset.want="pause"; a.pause(); } }
             this.current=null; },
  // Unmuting mid-round has to pick the loop back up, otherwise the switch
  // reads as broken until the next round starts.
  setMuted(v){
    this.muted = v;
    // RAMP the contact bus, and never cut it. A zeroed gain, or a paused
    // element, while a concession is still sounding is itself a click. That is
    // the precise artifact the rest of this design exists to avoid.
    if (this.ctx && this.sfxGain){
      const t = this.ctx.currentTime, g = this.sfxGain.gain;
      g.cancelScheduledValues(t);
      g.setValueAtTime(g.value, t);
      g.linearRampToValueAtTime(v ? 0 : 1, t + 0.015);
      if (!v && this.ctx.state === "suspended") this.ctx.resume();
    }
    if (v){ for(const k in this.tracks){ const a=this.tracks[k];
              a.dataset.want="pause"; a.pause(); } }
    else if (this.current){
      const a=this.tracks[this.current];
      if (a && !a.dataset.silent){ a.dataset.want="play"; a.play().catch(()=>{}); }
    }
  },
};

/* ==================================================================
 * 10. ROUND FLOW
 * ================================================================== */
/* Building an overlay also CLEARS attract-mode's presentation state. Cleanup
   belongs where every screen is BUILT, and not on one exit path. exitAttract
   bails unless the phase is still attract. Cleanup placed there would leave any
   other route out of the demo permanently dressed as attract mode. The selector
   `#overlay.attract.nohints .hint` would then hide the control list on every
   later screen, including the pause screen. enterAttract re-applies the state
   immediately after it draws, so the demo is unaffected. */
function overlayHTML(html){
  const o = el("overlay");
  o.classList.remove("attract","nohints");
  o.style.removeProperty("--scrim-a");
  o.style.removeProperty("--attract-lift");
  o.style.removeProperty("--attract-scale");
  el("overlayInner").innerHTML = html;
  o.classList.remove("hidden");
}
function hideOverlay(){ el("overlay").classList.add("hidden"); }

/* The two participants. One helper serves the title pair, the round pair and
   the attract pair, so exactly one place can leave DOM behind. It always
   clears #participants first, so the count is always exactly 2. */
function spawnPair(cpu1, cpu2){
  el("participants").innerHTML = "";
  el("shadows").innerHTML  = "";
  F = [ makeParticipant(CONFIG.p1, CONFIG.round.startX1,  1, cpu1),
        makeParticipant(CONFIG.p2, CONFIG.round.startX2, -1, cpu2) ];
  // Second wind is per ROUND, so the latch starts undefined every spawn.
  F.forEach(f => { f.secondWind = undefined; f.aiAntiAirAt = 0; f.aiWhiffAt = 0;
                   f.chainCount = 1; f.comboUntil = 0;
                   f.reason = 0; f.reasonUntil = 0;
                   f.actedSinceConceded = true; });
  buildParticipant(F[0]); buildParticipant(F[1]);
  for (const f of F){
    const sh = document.createElement("div");
    sh.className = "shadow";
    el("shadows").appendChild(sh);
    f.shadow = sh;
  }
  el("name1").textContent = F[0].def.name;
  el("name2").textContent = F[1].def.name;
  // A single player gets the merged solo scheme whichever bot they picked.
  // Nobody expects to be moved onto a different half of the keyboard for
  // choosing the blue one.
  if (cpu1 !== cpu2){ F[0].scheme = "solo"; F[1].scheme = "solo"; }
  else { F[0].scheme = "p1"; F[1].scheme = "p2"; }
  el("cpu1").classList.toggle("on", !!F[0].isCPU);
  el("cpu2").classList.toggle("on", !!F[1].isCPU);
  for (const f of F) f.node.style.zIndex = f.isCPU ? 10 : 11;
}

/* THE ONLY THING THAT WRITES `phase`.

   It was one of 26 module-level `let` bindings, assignable from anywhere,
   including delayed callbacks. That is how a result screen landed on top of a
   running countdown and stranded a round. Ownership of the timers removed that
   instance. This removes the ABILITY to write the state from somewhere that
   should not.

   It refuses rather than delivers. A wrong table must not be able to take the
   game down in front of a player. An illegal move is therefore recorded and
   dropped, and the suite fails on any recording. Loud in test, survivable in
   play. */
function setPhase(to){
  const from = phase;
  if (from === to) return to;
  const move = from + " -> " + to;
  phaseMoves.add(move);
  /* RECORDS, AND STILL MOVES. A refusal here was the obvious design and it is
     the wrong one. A table with a gap in it would refuse a legitimate
     transition and strand the game. That is the exact failure this whole step
     exists to remove, and an error in the direction of the original defect is
     not a fix.

     The table is therefore a tripwire rather than a gate. Illegal moves are
     recorded, and the suite fails on any recording. That is loud where it
     needs to be and survivable where a player is watching. If the recorded set
     stays empty across a long soak, it can be promoted to a gate later, on
     evidence. */
  if (!(PHASE_MOVES[from] || []).includes(to)) illegalPhaseMoves.push(move);
  phase = to;
  return to;
}

function titleScreen(){
  setPhase("title"); paused = true;
  cardUntil = 0;                         // the card, if any, is done
  lastInputAt = performance.now();       // start the idle countdown fresh
  const W = CONFIG.art.wordmark;
  const row = (text, cls) => `<div class="mqrow ${cls}">` +
    ["extrude","rim","face","gloss"].map(l=>`<span class="mql ${l}">${text}</span>`).join("") +
    `</div>`;
  const logoImg = `<img id="logo" src="${bust(CONFIG.art.logo)}" alt=""
     onerror="this.remove();document.getElementById('cssTitle').style.display='caveat'">`;
  overlayHTML(`
    ${logoImg}
    <div id="cssTitle" class="marquee" style="display:none">
      ${row(W.line1,"r1")}${row(W.line2,"r2")}
      ${W.bar ? '<div class="mqbar"></div>' : ''}
    </div>
    <div class="sub blink">${prompt2("PRESS SPACE TO BEGIN","TAP TO BEGIN")}</div>
    ${controlsHTML()}`);
  Sound.ensure("title");   // already playing? leave the loop alone
  applyStage();          // back to the menu stage, whatever we were playing on
}

/* The high score table, kept per difficulty rather than as a list of names.
   A cabinet with two buttons has nowhere to enter initials. The best run on
   each rung is also the more useful thing to brag about.

   EVERY rung gets a row whether or not it has been cleared. An untouched
   cabinet reads as a table waiting to be filled. It does not read as a blank
   screen. It also states the choice. */
function recordsCard(){
  const rows = CONFIG.difficulty.levels.map(L => {
    const rec = Records.get(L.name);
    return `<div class="recrow"><span class="reclvl">${L.name}</span>`
         + `<span class="recval${rec ? "" : " none"}">`
         + `${rec ? Records.describe(rec) : "NOT YET EVALUATED"}</span></div>`;
  }).join("");
  overlayHTML(`
    <div class="bigtitle" style="font-size:76px">EVAL RECORDS</div>
    <div class="reclist">${rows}</div>
    <div class="sub blink">${prompt2("PRESS SPACE TO BEGIN","TAP TO BEGIN")}</div>`);
  cardUntil = performance.now() + CONFIG.attract.recordsMs;
}

/* Touch has no keyboard, so every "PRESS <key>" instruction on it is an
   instruction the player cannot follow. One helper rather than a sprinkling of
   conditionals, so a new prompt cannot forget to ask. */
const prompt2 = (keyText, tapText) => isTouch ? tapText : keyText;

/* The control list renders on the title screen AND the pause screen, so it
   lives in one function. Two copies would drift the moment a key is rebound.
   On touch it renders nothing, because the controls are already on screen,
   labelled, under the player's thumbs. */
/* Turn a KeyboardEvent.code into the thing printed on the key. */
const KEYFACE = { ArrowLeft:"&larr;", ArrowRight:"&rarr;", ArrowUp:"&uarr;",
                  ArrowDown:"&darr;", Comma:",", Period:".", Slash:"/" };
const keyFace = c => KEYFACE[c] || c.replace(/^Key/, "");

/* The legend is GENERATED from CONFIG.keys and never written out by hand. It
   was hand-written once, and it went stale twice in a row. The first time was
   when the guard moved off S, and the second was when DEFER and ESCALATE got
   their names. A legend that disagrees with the bindings is worse than no
   legend, and this one cannot disagree. */
function controlsHTML(){
  /* THE BUILD LINE RIDES WITH THE CONTROLS, which is the point: those are the
     two screens that already carry small print -- the title and the pause --
     and a fingerprint is small print. On a screen that is otherwise an exchange it
     would be litter.
     Touch has no key table to print, so it gets the line on its own rather
     than losing it: the build is the one thing a bug report needs. */
  const buildLine =
    `<div class="keyfoot build">BUILD ${BUILD.toUpperCase()}</div>` +
    `<div class="keyfoot build byline">BY <a href="https://jakemccuistion.com"` +
    ` target="_blank" rel="noopener noreferrer">JAKE MCCUISTION</a></div>`;
  if (isTouch) return `<div class="hint">${buildLine}</div>`;
  const K = CONFIG.keys;
  // Two columns, because there are only two sets of keys. The solo column was
  // a third way of saying that either set works. That is a sentence rather
  // than a table column, so it is a sentence now.
  const rows = [
    ["MOVE",     s => keyFace(K[s].left[0]) + " " + keyFace(K[s].right[0])],
    ["ESCALATE", s => K[s].escalate.map(keyFace).join("<i>/</i>")],
    ["DEFER",    s => K[s].defer.map(keyFace).join("<i>/</i>")],
    ["AFFIRM",   s => K[s].affirm.map(keyFace).join(" ")],
    ["CLARIFY",  s => K[s].clarify.map(keyFace).join(" ")],
    ["CAVEAT",   s => K[s].caveat.map(keyFace).join(" ")],
    // The argument for REASON on its own key is that a cabinet prints its
    // controls and a booth player reads them once. The genre standard is a
    // two-button press. That argument holds only if the row is actually
    // here.
    ["REASON",   s => K[s].reason.map(keyFace).join(" ")],
  ];
  const cells = rows.map(([name, fn]) =>
    `<span class="ka">${name}</span>` +
    ["p1","p2"].map(scheme => `<span class="kk">${fn(scheme)}</span>`).join("")
  ).join("");
  return `<div class="hint">
      <div class="keygrid two">
        <span class="kh"></span>
        <span class="kh">P1</span><span class="kh">P2</span>
        ${cells}
      </div>
      <div class="keyfoot">ONE PLAYER &mdash; USE EITHER SIDE</div>
      <div class="keyfoot">ESC PAUSE &nbsp;·&nbsp; M SOUND</div>
      ${buildLine}
    </div>`;
}

/* The stage follows the TRACK. The backdrop reads back whichever eval variant
   Sound selected. It is not told an index. The pairing therefore stays in step
   with the rotation. There is one cursor, it is in Sound, and the backdrop is
   a consequence of it. The first stage is the fallback whenever no eval track
   plays. That is the menus and the silent attract demo. */
/* Run an iris. Shut the screen, do the swap while nothing is visible, then
   open again. The `mid` step must happen BEHIND black. A stage change that is
   only faded shows both arenas at once halfway through. That reads as a glitch
   instead of an edit. */
/* TIMERS THE ROUND OWNS, so a round that ends takes its pending work with it.

   The stranded round came from a delayed callback that outlived the thing it
   drew. endRound schedules the result screen 1.4s out. The player presses on
   inside that window. The callback then fires under a running countdown. It
   overwrites the phase and leaves two idle participants with no UI and no way
   forward.

   An early return patched that fault. The guard works, and it leaves the SHAPE
   of the fault intact. Every future delayed callback must repeat the same
   check. A guard thirty lines above the one that lacked it shows that the
   repetition is what fails. A timer the round owns can be cancelled instead.
   Then there is nothing to guard against.

   Membership is deliberate, not automatic. The round lifecycle puts its work
   here: the sting, the result screen, the iris, and the countdown ladder.
   Timers that own themselves stay out. The burst cleanup in spawnPop removes a
   DOM node. Cancellation of that timer leaks the node, which is worse than the
   fault it prevents. */
/* PRESENTATION RANDOMNESS, ON ITS OWN STREAM.

   The soak seeds Math.random so a run is reproducible. Seeded equality proves
   every refactor in this file safe: the same seed must return the SAME number,
   not a similar one. That check holds only while the simulation is the sole
   consumer of the stream.

   It was not the sole consumer. Burst rotation, screen shake and audio pitch
   wobble all drew from Math.random. Any VISUAL change therefore moved every
   measurement. Suppression of a crowded burst returns from spawnPop before the
   rotation draw. One fewer number is taken, and every later draw shifts. Two
   ladder cells moved by ten and twenty-seven points for a change that touches
   nothing the participants do.

   This is the shape of the two-clocks fault: a boundary that was absent. The
   replacement is an LCG. It is deterministic, so the look is reproducible. It
   is separate, so it cannot perturb a match. A lint test keeps presentation
   off Math.random. */
const visualRandom = (() => {
  let s = 0x9E3779B9;
  return () => { s = (Math.imul(s, 1103515245) + 12345) >>> 0; return s / 4294967296; };
})();

const RoundTimers = {
  ids: new Set(),
  after(ms, fn){
    const id = setTimeout(() => { RoundTimers.ids.delete(id); fn(); }, ms);
    RoundTimers.ids.add(id);
    return id;
  },
  cancelAll(){
    for (const id of RoundTimers.ids) clearTimeout(id);
    RoundTimers.ids.clear();
  },
};

function iris(mid){
  const I = CONFIG.art.iris, node = el("iris");
  if (!node){ mid && mid(); return; }
  // Open means the hole clears the CORNERS, so it comes off the diagonal --
  // a radius sized to the edges leaves black sitting in the corners. The soft
  // band is added on top so the fade itself is also outside the frame.
  const open = Math.hypot(STAGE.w, STAGE.h) / 2 + I.soft;
  const set = (k,v) => node.style.setProperty(k, v);
  set("--iris-soft", I.soft + "px");
  set("--iris-ms", "0ms");
  set("--iris-r", open + "px");          // start wide open, with no transition
  node.classList.add("on");
  // Two frames: one for the un-transitioned open state to be committed, one
  // to start the transition from it. Setting both in the same frame gives the
  // browser nothing to interpolate between and the iris simply appears shut.
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    set("--iris-ms", I.closeMs + "ms");
    set("--iris-r", "0px");
  }));
  /* THE ONE THAT MATTERS MOST. `mid` is what happens behind the shut screen —
     for a round start that is hideOverlay, spawnPair and the countdown ladder.
     Left as a raw timer it fires under a cancelled transition and respawns the
     pair anyway, which is the exact mechanism that stranded a round. */
  RoundTimers.after(I.closeMs + 40, ()=>{   // +40: cover the two priming frames
    if (mid) mid();
    set("--iris-ms", I.openMs + "ms");
    set("--iris-r", open + "px");
    RoundTimers.after(I.openMs, ()=> node.classList.remove("on"));
  });
}

/* Every stage image, fetched AND decoded, before anything asks for one.

   applyStage assigns .src from inside the iris. An element that receives an
   unseen src drops what it shows. It then has nothing to draw until the bytes
   arrive, which is a few hundred KB of JPEG. The stage therefore arrives as a
   blank that fills in. The iris hides that only while it is shut. The result
   looks correct on a warm local load and flashes on a cold one.

   decode() replaces a bare `new Image()` for one reason. An image that is
   cached but not yet decoded still blanks on first paint. Preloading without
   decoding moves the stall instead of removing it.

   The promises are kept in a map rather than fired and forgotten. A claim that
   the images were requested is not something a test can check. This code was
   written once before. A commit message described it in detail, and the code
   was never added to the file. Nothing detected the absence while every load
   was warm. */
/* Every burst's on-screen WIDTH, measured once.

   A burst is 190px tall with `width:auto`. Its width therefore depends on the
   art, and the widest in the set is more than twice the narrowest. Nothing can
   be pushed clear of anything without that number. The number cannot be read
   at spawn time, because the first appearance of a phrase may not have decoded
   yet. The measurement is warmed at boot with the stages. That also removes
   the hitch on the first firing of each phrase. */
const burstWidth = new Map();
function preloadBursts(){
  const h = CONFIG.popPlacement.burstH;
  for (const tier of Object.values(CONFIG.phrases))
    for (const item of tier.items)
      for (const src of (item.imgs || [item.img])){
        if (!src || burstWidth.has(src)) continue;
        const img = new Image();
        img.onload = () => burstWidth.set(src,
          img.naturalHeight ? h * img.naturalWidth / img.naturalHeight : h * 1.6);
        img.src = bust(src);
        burstWidth.set(src, h * 1.6);      // provisional until it decodes
      }
}

const stageWarm = new Map();
function preloadStages(){
  for (const src of [...CONFIG.art.backdrops, CONFIG.art.titleBackdrop]){
    if (stageWarm.has(src)) continue;
    const img = new Image();
    img.src = bust(src);
    // The decode PROMISE is kept, and not only the image. There is no way to
    // ask an <img> whether it has been decoded. A test that calls decode()
    // itself therefore proves only that the file is decodable, and it passes
    // just as well when boot decoded nothing. A held promise makes the request
    // itself observable, which is the part that was missing.
    //
    // A missing stage is already handled by the backdrop's own error handler.
    // An unhandled rejection here would only be console noise.
    const decoding = img.decode ? img.decode().catch(()=>{}) : null;
    stageWarm.set(src, { img, decoding });
  }
}
/* The backdrop is keyed to the EVAL NUMBER and not to whichever track came
   up. It used to read back the eval playlist's cursor, which tied the two
   lists together. The playlist could then never be longer than the backdrop
   list without a stage silently never appearing. A key on the eval keeps the
   property that matters, which is that eval N always looks the same. It also
   lets the music pool be any length, so a rematch does not have to sound
   identical. */
function applyStage(){
  const list = CONFIG.art.backdrops;
  const inMatch = phase !== "title" && phase !== "select" && phase !== "attract";
  const src = !inMatch ? CONFIG.art.titleBackdrop
                       : list[(Math.max(1, roundNum) - 1) % list.length];
  const node = el("backdrop");
  if (node.dataset.stage === src) return;      // already showing it
  node.dataset.stage = src;
  node.src = bust(src);
}

/* Pause is its own phase rather than a flag: the main loop already gates every
   branch on `phase`, so nothing steps, no AI thinks, and the round clock stops
   with no extra guards. `paused` alone would have left the phase at "active"
   and kept the timer honest-looking while frozen. */
function togglePause(){
  if (phase === "active"){
    setPhase("paused"); paused = true;
    el("pauseBtn").classList.add("on");
    Sound.hold();
    overlayHTML(`<div class="bigtitle" style="font-size:104px">PAUSED</div>
      ${controlsHTML()}
      <div class="sub blink" style="font-size:26px">${prompt2("PRESS ESC TO RESUME","TAP &#9654; TO RESUME")}</div>`);
  } else if (phase === "paused"){
    hideOverlay();
    el("pauseBtn").classList.remove("on");
    setPhase("active"); paused = false;
    Sound.unhold();
  }
}
function toggleMute(){
  // Belt and braces: the capture-phase listener has normally already run, but
  // the authorisation has to happen inside a gesture and this IS one.
  Sound.unlock();
  Sound.setMuted(!Sound.muted);
  el("muteBtn").classList.toggle("on", !Sound.muted);
}

/* Two-step select: how many players, then (for one) which bot. Keyboard and
   mouse both drive it — the arcade answer is a joystick, but this also has to
   work on a laptop trackpad and a phone. */
let selStep = 0, selIdx = 0;
let difficulty = 1;                 // index into CONFIG.difficulty.levels
const SEL_STEPS = [
  // AUTONOMOUS is the no-humans option: both bots are driven by the same
  // difficulty setting, so the screen becomes a benchmark of the model
  // against itself. The question is "how many players", and the honest answer
  // for it is ZERO — so it leads, and the list reads 0, 1, 2. That ordering
  // is not just tidiness: it makes the option INDEX equal the player count,
  // which is why nothing here needs a lookup table to translate between them.
  // The cursor still opens on 1 PLAYER, because `players` starts at 1.
  { label:"HOW MANY PLAYERS?", opts:["AUTONOMOUS","1 PLAYER","2 PLAYERS"] },
  { label:"CHOOSE YOUR BOT",   opts:["RUST","VOLT"] },
  // The plain word, then the jargon name for the same thing, joined by an em
  // dash. It reads as an industry euphemism caught in the act. The dash is the
  // joke twice over. EM DASH is already a clarify-tier comic in this game, for
  // being the tell that gives AI writing away.
  { label:`${CONFIG.difficulty.prompt}` +
          ` <span class="gloss">&mdash; ${CONFIG.difficulty.label}</span>`,
    opts:CONFIG.difficulty.levels.map(l=>l.name),
    blurbs:CONFIG.difficulty.levels.map(l=>l.blurb) },
];
/* decisionCooldown is the real difficulty dial; the rest shade it. Copied
   into CONFIG.ai rather than read through an indirection so updateAI stays
   a straight read of one config object. */
/* THE DEFAULTS, CAPTURED ONCE, BECAUSE A RUNG THAT DOES NOT SET A KEY MUST GET
   THE BASE VALUE AND NOT THE LAST RUNG'S.

   This used to be `if (L[k] !== undefined) CONFIG.ai[k] = L[k]`, mutating in
   place and leaving anything a rung did not mention exactly as the previously
   selected rung left it. Every key defined on SOME rungs therefore leaked
   across all of them, in selection order.

   It was invisible while every listed key happened to be set on all three.
   Adding one that was not made it plain: THINK opts out of the Director with
   `paceRelaxMs:0`, and after visiting THINK once the Director was off at every
   difficulty. `desperateModes` had just acquired the same fault in the other
   direction — ULTRATHINK's 0.45 wind share would have followed you down to
   THINK. A settings merge that depends on which screen you visited first is a
   bug whatever it is merging. */
const AI_BASE = { ...CONFIG.ai };

/* The keys a rung is allowed to override. Named once, so `deriveAI` and the
   test that exercises it cannot disagree about the list. */
const TUNED_KEYS = ["decisionCooldown","caveatChance","caveatReactionMs","postResponseRest",
                   "assertivenessWhenDepleted","escalateChance","baseAssertiveness",
                   "feintChance","closeRange","airResponseChance","antiAirChance",
                   "punishChance","spacingSkill","comboSkill","reasonSkill",
                   "guardWeight","retreatWeight",
                   "pressureGuard","counterSkill","readAfter","adaptMax",
                   "retreatChance","retreatAfterResponse","deferChance",
                   "secondWindAssertiveness",
                   // The Director is per-rung: THINK sets paceRelaxMs to 0 to
                   // opt out. Without these three in the list that opt-out is a
                   // comment rather than a setting.
                   "paceRelaxMs","paceIntensity","paceEase",
                   "desperateModes",
                   "secondWindSpeed"];

/* PURE. Reads a base and a rung, returns a NEW object, touches neither.

   The guard version of this — assign from the base when the rung is silent —
   produced the right answer and left the fault representable: it still wrote
   into one shared object, so the correctness depended on the loop covering
   every key, every time, forever. Deriving instead means there is nowhere for
   a previous selection to persist, which is a different kind of fixed. */
function deriveAI(base, rung, keys){
  const out = { ...base };
  for (const k of keys) out[k] = rung[k] !== undefined ? rung[k] : base[k];
  return out;
}

function applyDifficulty(){
  CONFIG.ai = deriveAI(AI_BASE, CONFIG.difficulty.levels[difficulty], TUNED_KEYS);
}
/* The BENCHMARK is over, so two things are worth offering: another run exactly
   as configured, and another run configured differently. REGENERATE is the
   retry for a result the player did not like. A NEW RUN is a fresh execution
   under a setup the player chooses. It therefore goes all the way back to the
   player count rather than only to the difficulty. */
/* ==================================================================
 * BENCHMARK RECORDS — the arcade ritual, in this game's own units
 *
 * The cabinet remembered nothing. Not the best run, and not even whether the
 * sound was muted. The high-score table is the reason anybody plays a sixth
 * time. Its absence was the single largest thing separating this from an
 * arcade game that ships.
 *
 * A classic score table needs a SCORE, and this game does not have one. It is
 * scored in evals and benchmarks. Invented points beside that would bolt a
 * second and weaker scoring system onto a game that already has one. The
 * record is therefore kept in the units the game already uses. That is the
 * MARGIN the benchmark was taken by, where 2-0 outranks 2-1, with health
 * remaining as the tiebreak. A flawless clear is the same instinct a score
 * chases.
 *
 * Per difficulty rung, because a 2-0 against THINK and a 2-0 against
 * ULTRATHINK are not the same achievement, and one table would hide that.
 *
 * ONE-PLAYER ONLY. Two humans leave nobody to credit, and AUTONOMOUS has
 * nobody playing at all. A record of either would fill the table with runs
 * nobody made.
 */
const Records = {
  KEY: "botarena.records.v1",
  // Every access is wrapped. localStorage RAISES rather than returning null
  // in a Safari private window and under some embedding policies. A cabinet
  // that refuses to boot because it could not remember a score is a far worse
  // failure than one that simply forgets.
  all(){
    try {
      const raw = localStorage.getItem(this.KEY);
      const v = raw ? JSON.parse(raw) : null;
      return (v && typeof v === "object") ? v : {};
    } catch { return {}; }
  },
  get(level){ return this.all()[level] || null; },
  // Returns true when this run OUTRANKS the stored one, so the caller can say so.
  submit(level, rec){
    const prev = this.get(level);
    if (prev && !this.outranks(rec, prev)) return false;
    try {
      const all = this.all();
      all[level] = rec;
      localStorage.setItem(this.KEY, JSON.stringify(all));
    } catch { /* forgetting is acceptable; crashing is not */ }
    return true;
  },
  // Margin first, health second. It is DERIVED from won and lost rather than
  // stored alongside them. The first version compared a `margin` field that
  // was never written. Both sides therefore read undefined, the margin test
  // always fell through, and every record ranked purely on health. It returned
  // an answer the whole time, which is why a test rather than a playthrough
  // found it. A derived value cannot disagree with the stored run.
  margin(r){ return (r.won || 0) - (r.lost || 0); },
  outranks(a, b){
    const ma = this.margin(a), mb = this.margin(b);
    if (ma !== mb) return ma > mb;
    return a.health > b.health;
  },
  describe(rec){
    return rec ? `${rec.won}-${rec.lost} &middot; ${Math.round(rec.health)}% HEALTH` : null;
  },
};

/* THE SCORE PANEL, lifted out of endRound so the suite can measure what the
   screen actually renders, rather than rebuilding the markup beside it. Rows
   carry data-score-row because the thing asserted is the RHYTHM between them. A
   test that hunted for .sub would need rewriting every time the styling moves,
   and that is the change most likely to break the rhythm. */
function scoreBlock(level, rec, prev, isBest){
  const row = (cls, label, value) =>
    `<div class="scorerow ${cls}" data-score-row><span class="scorelbl">${label}</span>`
    + `<span class="scoreval">${value}</span></div>`;
  let rows = "";
  if (isBest)      rows = row("best", "NEW RECORD", Records.describe(rec));
  else {
    if (rec)  rows += row("", "THIS RUN", Records.describe(rec));
    if (prev) rows += row("prev", `BEST ${level}`, Records.describe(prev));
  }
  return rows ? `<div class="scoreboard">${rows}</div>` : "";
}

const END_CHOICES = [
  { text:"REGENERATE", run:()=>startMatch() },
  { text:"NEW RUN",    run:()=>selectScreen() },
];
let endIdx = 0;
function renderEndChoices(){
  document.querySelectorAll(".endchoices .choice").forEach((b,i)=>
    b.classList.toggle("sel", i === endIdx));
}
function confirmEnd(){ const c = END_CHOICES[endIdx]; if (c) c.run(); }

function selectScreen(){
  setPhase("select"); paused = true;
  // Touch is single-player by construction. There is one set of on-screen
  // controls and no second pair of hands, so the player count has one possible
  // answer. The flow skips straight to the choice of bot.
  if (isTouch){
    players = 1;
    selStep = 1; selIdx = humanSide;
  } else {
    // Always opens on 1 PLAYER. Deliberately NOT the last thing chosen:
    // AUTONOMOUS is an aside, and having tried it once should not make it the
    // thing that happens next time somebody walks up to the cabinet.
    selStep = 0; selIdx = 1;
  }
  renderSelect();
}
/* THE BLURB PANEL IS ALWAYS PRESENT, on every step, including the two that
   have nothing to say. Rendered only where it had content, the heading and the
   buttons both jumped 46.5px on the final confirm. SELECT sat at 126.9px on the
   first two steps and 80.4px on the third, because the overlay centres its
   content and the third step is taller. That is three keypresses, with the
   title of the screen moving on the last one.

   The reserved height comes from the REAL STRINGS rather than from a magic
   number. The panel renders every blurb the flow has, stacked in one grid cell
   and hidden. It is therefore exactly as tall as the longest one, and it
   re-measures itself if the copy is ever rewritten. That is the same technique
   the step already used to stop the heading moving between rungs. It simply was
   not extended to movement between steps.

   It uses `visibility:hidden` and not `display:none`, for the same reason.
   Hidden children still take up space, which is the entire point. */
function blurbBlock(st){
  const set = st.blurbs || (SEL_STEPS.find(s => s.blurbs) || {}).blurbs || [];
  if (!set.length) return "";
  const live = !!st.blurbs;
  return `<div class="blurb">${set.map((b, i) =>
    `<div class="${live && i === selIdx ? "on" : ""}">${
      b.replace(/\u2014/g, '<span class="dash">&mdash;</span>')}</div>`).join("")}</div>`;
}
function renderSelect(){
  const st = SEL_STEPS[selStep];
  overlayHTML(`
    <div class="bigtitle" style="font-size:76px">SELECT</div>
    <div class="steplabel">${st.label}</div>
    <div class="choices">${st.opts.map((o,i)=>
      `<button class="choice ${i===selIdx?"sel":""}" data-i="${i}" type="button">${o}</button>`
      ).join("")}</div>
    ${blurbBlock(st)}
    <div class="sub blink go" style="font-size:22px">${
      prompt2("&larr; &rarr; &nbsp; THEN SPACE","TAP TO CONTINUE")}</div>`);
  for (const b of document.querySelectorAll(".choice"))
    b.addEventListener("click", e=>{
      e.stopPropagation();
      const i = +e.currentTarget.dataset.i;
      // Touch needs a SELECT step before the CONFIRM step. A tap that confirms
      // immediately leaves a phone unable to read the other difficulty
      // descriptions. The blurb changes only as the selection moves, and touch
      // has no equivalent of the arrow keys, which move it without committing.
      // The first tap highlights an option and shows its description. A tap on
      // the option already selected commits it, as does the prompt line
      // below.
      if (!isTouch || selIdx === i){ selIdx = i; confirmSelect(); return; }
      selIdx = i; renderSelect();
    });
  // HOVER PREVIEWS a blurb without moving the selection. Without it, the only
  // way to read the other two descriptions is to select them. On a difficulty
  // screen that means committing to a rung to find out what it says. It is the
  // same gap the touch branch below solves with a two-tap select. A mouse has
  // hover and should use it.
  //
  // It is cheap, because every blurb is ALREADY in the DOM. They are stacked
  // into one grid cell with visibility toggled, so a preview is a class swap
  // rather than a re-render. A re-render would also discard the button the
  // pointer is sitting on, which is how a hover handler becomes a flicker loop.
  //
  // Nothing moves. The cell is sized to the tallest of the three blurbs, which
  // is the 136px measured above. A swap of a 22px blurb for a 128px one
  // therefore leaves the prompt line below exactly where it was.
  if (!isTouch && st.blurbs){
    const blurbs = [...document.querySelectorAll(".blurb > *")];
    const show = i => blurbs.forEach((el, n) => el.classList.toggle("on", n === i));
    for (const b of document.querySelectorAll(".choice")){
      b.addEventListener("mouseenter", e => show(+e.currentTarget.dataset.i));
      // Back to the SELECTION, not to whatever was hovered last. Leaving a
      // preview up would let the screen highlight one rung while describing
      // another.
      b.addEventListener("mouseleave", () => show(selIdx));
    }
  }
  if (isTouch){
    const go = document.querySelector(".go");
    if (go) go.addEventListener("click", e=>{ e.stopPropagation(); confirmSelect(); });
  }
}
function confirmSelect(){
  if (selStep === 0){
    players = selIdx;              // the list is ordered 0, 1, 2 players
    // Two players pick neither a side nor a difficulty — both slots are
    // human, so there is no AI left to tune.
    if (players === 2){ startMatch(); return; }
    // Autonomous picks no side either, because there is no human to place. It
    // DOES pick a difficulty, which is the point of watching.
    if (players === 0){ selStep = 2; selIdx = difficulty; renderSelect(); return; }
    selStep = 1; selIdx = humanSide; renderSelect();
  } else if (selStep === 1){
    humanSide = selIdx;
    selStep = 2; selIdx = difficulty; renderSelect();
  } else {
    difficulty = selIdx;
    applyDifficulty();
    startMatch();
  }
}

/* Which match this is, counted for the life of the page. Only used to advance
   playlists that should not repeat between matches. */
let matchNo = 0;
/* Latched per round: the tension track is swapped in once, not every frame. */
let tensionSwapped = false;


function startMatch(){
  learnReset();          // every game faces an opponent that knows nothing
  
  matchNo++;
  wins = [0,0]; roundNum = 1; resolvedPhrase = null;
  renderPips();
  startRound();
}
function startRound(){
  // Whatever the last round left in flight belongs to the last round.
  RoundTimers.cancelAll();
  timeLeft = CONFIG.round.seconds;
  held.clear();
  Sound.stopAll();
  setPhase("countdown"); paused = true;
  // The music comes up UNDER the countdown rather than after it. A start on
  // BEGIN meant roughly two seconds of silence while three words flashed by.
  // The round then opened with the track already a moment behind the action.
  // Keyed to the EVAL NUMBER, not to a free-running cursor. The cursor was
  // global and never reset, so a match began on whatever stage the last one
  // happened to stop at: finish on stage 3, conceded REGENERATE, and eval 1 opened
  // on stage 2. It was not running backwards, it simply had no notion of a
  // first stage. Now eval 1 is always stage 1, and REGENERATE genuinely
  // restarts rather than resuming a queue.
  // THE DECIDER GETS ITS OWN MUSIC. The last possible eval is the one both
  // participants are one win from taking. A boss theme on it is the oldest
  // trick in the arcade. It is deliberately keyed to the eval NUMBER rather
  // than to the score. At best-of-three the third eval only ever happens at one
  // apiece, so the last eval and the decider are the same round. The number
  // also cannot get out of step with the pips the way a score test can.
  //
  // The boss playlist advances per MATCH, so a rematch of the decider is not
  // the same track twice.
  const decider = roundNum >= CONFIG.round.best;
  if (decider) Sound.play("boss", (matchNo - 1) % (Sound.variants.boss||[1]).length);
  else         Sound.play("eval", roundNum - 1);
  tensionSwapped = false;

  // EVERY visible change happens inside the iris, behind the black.
  //
  // hideOverlay and spawnPair used to run out here, before the iris had begun
  // closing. The menu vanished and the participants appeared on an open screen.
  // The iris THEN shut over the finished picture and opened on the same thing.
  // The transition showed its destination, blacked out, and showed it again.
  // That double-take is the hiccup. No amount of easing fixes it, because the
  // problem is the order rather than the curve.
  //
  // The announce chain moves in here too. Started outside, EVAL 1 flashed up
  // over the select screen a moment before that screen was gone.
  iris(()=>{
    hideOverlay();
    spawnPair(...cpuFlags());
    applyStage();
    flashAnnounce("EVAL "+roundNum, 700, ()=>{
      flashAnnounce("READY", 650, ()=>{
        flashAnnounce("BEGIN", 600, ()=>{
          // The chain is a plain setTimeout ladder with no handle to cancel.
          // It must not start a round for a countdown that is no longer
          // current.
          if (phase !== "countdown") return;
          setPhase("active"); paused = false;
        });
      });
    });
  });
  // Restarting a stalled rAF is lifecycle, not simulation: this is the wall
  // timestamp the NEXT frame is measured against, and the value the boundary
  // will hand down as Clock.now on that frame.
  if (!running){ running = true; lastTs = performance.now(); requestAnimationFrame(loop); } // CLOCK-OK
}
function flashAnnounce(word, ms=700, then){
  const a = el("announce");
  a.innerHTML = `<div class="word">${word}</div>`;
  RoundTimers.after(ms, ()=>{ a.innerHTML=""; then && then(); });
}
function renderPips(){
  el("rounds").innerHTML =
    [0,1].map(i=>`<span class="pip ${wins[0]>i?'win':''}"></span>`).join("") +
    `<span class="chrome evallabel">EVAL ${roundNum}</span>` +
    [0,1].map(i=>`<span class="pip ${wins[1]>i?'win':''}"></span>`).join("");
}

/* Which phrase tier the resolve headline draws from.

   Three outcomes, not two. A win draws from the WIN tier. A lost EVAL is
   recoverable, so it reuses the RESOLVED tier. resolve() then prefers the
   burst's own phrase, so the resolve and the screen replacing it agree. A lost
   BENCHMARK is final and gets the tier that says so.

   Only ONE-player mode can produce a loss to report. With two humans somebody
   always wins, and with nobody playing there is nobody to have lost. Both of
   those always draw from win, however the round went.

   This is a named function rather than the expression it used to be. That
   expression lived inside a setTimeout inside resolve(), where no test could
   reach it. The suite therefore carried its own copy of the rule and asserted
   against the copy. There were four tests, and none of them could fail for any
   change made here. A rule worth testing has to be a rule that can be
   called. */
function endTier(winnerIdx, matchOver){
  const humanWon = players !== 1 || winnerIdx === humanSide;
  return humanWon ? "win" : matchOver ? "gone" : "resolved";
}
function resolve(loser){
  if (phase !== "active") return;      // endRound guards too; bail before the SFX
  const winnerIdx = F.indexOf(loser)===0 ? 1 : 0;
  setState(loser,"concluded");
  // Under the bot that went down, not parked in the middle of the screen —
  // it labels the resolve instead of floating beside it. Held for the whole
  // resolvedHoldMs so it plays under the sting and hands over to the result screen,
  // rather than blinking out and leaving a gap.
  const ground = STAGE.h - CONFIG.stage.groundY;
  const kx = Math.min(STAGE.w - CONFIG.popPlacement.edgePad,
             Math.max(CONFIG.popPlacement.edgePad, loser.x));
  // Draw the phrase ONCE and hold it. resolve() and endRound() must not call
  // nextPhrase for the resolved tier independently. The burst under the
  // concluded bot would then say one thing while the result screen says
  // another. The transition would contradict itself mid-fade.
  resolvedPhrase = nextPhrase("resolved");
  // -burstH/2 keeps the resolve burst exactly where it was once its anchor
  // moved from the centre to the TOP edge.
  spawnPop("resolved", kx, ground + 58 - CONFIG.popPlacement.burstH / 2,
           CONFIG.round.resolvedHoldMs, resolvedPhrase);
  raiseParticipant(F[winnerIdx]);
  endRound(winnerIdx, "resolved");
}
/* cause is "resolved", "time" (health decision) or "coin" (a statistical tie). It decides
   the headline: only a resolve earns the
   RESOLVED starburst. A participant who merely ran out of clock is still standing, so
   popping RATE LIMITED over them read as a bug. Every round has a winner —
   see the timer-expiry coin flip. */
/* Font size for a text headline, against the 1380px the stage can spare.
   ~0.62em average advance for this face plus the 10px tracking; capped at
   the design size so short phrases are unaffected, floored so a very long
   one stays a headline rather than becoming body text. */
function headlinePx(text){
  const perChar = 0.62 + 10/132;
  return Math.max(58, Math.min(132, Math.floor(1380 / (text.length * perChar))));
}
function endRound(winnerIdx, cause){
  if (phase !== "active") return;
  /* THE STATE MOVES NOW; THE SCREEN CATCHES UP LATER.

     `matchover` used to be entered inside the resolvedHoldMs timeout,
     alongside the result screen. That timeout then acquired a guard against
     overwriting a phase the player had already advanced past. The guard skipped
     the transition too, so a won benchmark never ended. The soak found it at
     once. It reported more wins than the match needed, at 2 and 3 against a
     target of 2. It then reported a match stuck in `active` for 12,000 frames.
     The suite and the package smoke both passed, because neither plays long
     enough to finish a benchmark.

     A decision and its drawing are different jobs with different clocks. The
     transition here is immediate and unconditional. The timeout below owns only
     the presentation, and it may be skipped freely. */
  wins[winnerIdx]++;
  const need = Math.ceil(CONFIG.round.best/2);
  const matchOver = wins[winnerIdx] >= need;
  setPhase(matchOver ? "matchover" : "roundover"); paused = true;
  timerAcc = 0;              // drop any partial second so the clock cannot tick
  // A ROUND is a boxing word, and an EVAL is what this game thinks it is
  // measuring. Rounds are therefore evals, and the match they add up to is a
  // BENCHMARK, which is genuinely what a suite of evals is called. It does mean
  // the BENCHMARK CLEARED win phrase can land on the same screen as the verdict
  // line about one time in five. That reads as a callback rather than an error,
  // so it is left alone.
  //
  // REGENERATE is the button for a result the player did not like, which is
  // exactly what a rematch is. It is deliberately not RETRY. That word is
  // already native to games, so it reads as ordinary UI and the joke
  // evaporates. Nobody regenerates a boxing match.
  renderPips();
  // Everything that could be playing, and not only the stage track. The
  // decider runs on the boss playlist, and a critical round may have swapped
  // to tension. A stop of the eval track alone left either of those running
  // under the result screen.
  Sound.stop("eval"); Sound.stop("boss"); Sound.stop("tension");
  Sound.play(winnerIdx === 0 ? "victory" : "loss");
  if (learn && F[winnerIdx] && !F[winnerIdx].isCPU) learn.roundsLost++;
  

  // The sting is a punctuation mark; the theme underneath it is what the
  // result screen sits on. A whole benchmark ending in two seconds of noise
  // and then silence is the same mistake as a loop that fades out.
  RoundTimers.after(CONFIG.audio.stingMs, () => {
    // BELT AND SUSPENDERS, and this game has a phrase for it. Cancellation is
    // the structural fix; the guard costs nothing and still covers any path
    // that schedules outside the group.
    if (phase !== "roundover" && phase !== "matchover") return;
    Sound.play(matchOver ? "champion" : "continueCue");
  });

  RoundTimers.after(CONFIG.round.resolvedHoldMs, ()=>{
    /* THE ROUND MAY ALREADY HAVE BEEN ADVANCED PAST, and this used to
       overwrite it. endRound sets phase to "roundover" immediately and shows
       the result screen resolvedHoldMs later. For 1.4 seconds the game is
       therefore in a state where SPACE is accepted and starts the next eval. A
       press in that window left this timeout to fire anyway, which set phase
       back to "roundover" under a countdown that was already running.

       What the player was left with: the countdown's iris callback had hidden
       the overlay and respawned the pair, and its BEGIN step correctly bailed
       on `phase !== "countdown"`. The screen therefore showed two participants
       at full health, breathing, with no UI and no way to continue. Play
       reported that the participant could not be moved. That was true, because
       the round was over.

       The sting timeout above already carries this guard. This one did not. A
       delayed presentation must always check that what it presents is still
       the current state. */
    if (phase !== "roundover" && phase !== "matchover") return;
    // The resolve headline IS the RESOLVED-tier phrase, such as RATE LIMITED
    // or CONTEXT EXCEEDED. It is cycled the same way the in-round pops are and
    // uses the same starburst art. It falls back to styled text if the art is
    // gone.
    // The headline is the WIN phrase whenever the screen is rooting for the
    // winner, and the RESOLVED phrase when it is not. The boast belongs in the
    // starburst rather than bolted underneath a resolve.
    // Only ONE-player mode can produce a loss to report. With two humans
